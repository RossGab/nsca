<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | NSCA Task Viewer</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 5vw, 3rem);
      background: #edf2f7;
      color: #14243a;
      font: 1rem/1.5 system-ui, sans-serif;
    }

    .portal {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: min(100%, 58rem);
      overflow: hidden;
      border: 1px solid #dbe4ee;
      border-radius: 1.25rem;
      background: #fff;
      box-shadow: 0 20px 55px #152d4a16;
    }

    .intro, .signin { padding: clamp(1.5rem, 5vw, 3.5rem); }

    .intro {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: clamp(2rem, 8vw, 5.5rem);
      background: linear-gradient(145deg, #10223b, #1b3d65);
      color: #fff;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: .875rem;
      font-weight: 650;
    }

    .brand img {
      width: 3rem;
      height: 3rem;
      object-fit: contain;
      background: #fff;
      border-radius: .5rem;
    }

    h1, h2, p { margin: 0; }

    h1 {
      max-width: 12ch;
      font-size: clamp(2rem, 5vw, 3.25rem);
      line-height: 1.05;
      letter-spacing: -.045em;
    }

    h2 {
      font-size: 1.875rem;
      line-height: 1.15;
      letter-spacing: -.035em;
    }

    .intro p { margin-top: 1rem; color: #d8e6f6; }
    .signin > p { margin-top: .625rem; color: #485c74; }
    form { margin-top: 1.75rem; }

    label {
      display: block;
      margin-bottom: .375rem;
      font-size: .9375rem;
      font-weight: 650;
    }

    .field + .field { margin-top: 1rem; }

    input, button {
      width: 100%;
      min-height: 3rem;
      border-radius: .5rem;
      font: inherit;
    }

    input {
      padding: .625rem .75rem;
      border: 1px solid #8194aa;
      color: inherit;
      background: #fff;
    }

    button {
      margin-top: 1.5rem;
      border: 0;
      background: #1c4e84;
      color: #fff;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: #153c68; }
    button:disabled { opacity: .7; cursor: default; }

    :focus-visible {
      outline: 3px solid #2873c3;
      outline-offset: 3px;
    }

    .error:not(:empty) {
      margin-top: .875rem;
      color: #a21b2d;
      font-size: .9375rem;
    }

    @media (max-width: 42rem) {
      .portal { grid-template-columns: 1fr; }
      .intro { gap: 1.5rem; }
      h1 { max-width: none; }
    }
  </style>
</head>
<body>
  <main class="portal">
    <header class="intro">
      <div class="brand">
        <img src="logo.jpg" alt="" width="48" height="48">
        <span>NSCA Task Viewer</span>
      </div>
      <div>
        <h1>Completed task review</h1>
        <p>View completed tasks and verify delivery details.</p>
      </div>
    </header>

    <section class="signin" aria-labelledby="signin-heading">
      <h2 id="signin-heading">Sign in</h2>
      <p>Use your assigned Task Viewer account.</p>
      <form id="signin-form">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button id="signin-button" type="submit" disabled>Sign in</button>
        <p id="error" class="error" role="alert"></p>
      </form>
      <noscript><p>Enable JavaScript to sign in.</p></noscript>
    </section>
  </main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDFW61pnwLvh6HGKWt10zLYNr860fI8vkg",
  authDomain: "driva-pwa.firebaseapp.com",
  databaseURL: "https://driva-pwa-default-rtdb.firebaseio.com",
  projectId: "driva-pwa",
  storageBucket: "driva-pwa.firebasestorage.app",
  messagingSenderId: "299138219722",
  appId: "1:299138219722:web:623ff6b0a067ea822dfe33"
};

const auth = getAuth(initializeApp(firebaseConfig));
const form = document.getElementById("signin-form");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const button = document.getElementById("signin-button");
const errorBox = document.getElementById("error");

onAuthStateChanged(auth, (user) => {
  if (user) {
    window.location.replace("taskview.html");
  }
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  if (button.disabled) return;

  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();
  if (!email || !password) {
    errorBox.textContent = "Enter your email address and password.";
    return;
  }

  errorBox.textContent = "";
  button.textContent = "Signing in...";
  button.disabled = true;

  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (error) {
    if (error.code === "auth/network-request-failed") {
      errorBox.textContent = "Check your internet connection and try again.";
    } else if (error.code === "auth/too-many-requests") {
      errorBox.textContent = "Too many sign-in attempts. Please wait and try again.";
    } else {
      errorBox.textContent = "Sign-in failed. Check your email address and password and try again.";
    }
    button.textContent = "Sign in";
    button.disabled = false;
  }
});

button.disabled = false;
</script>
</body>
</html>
