<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leave Management</title><link rel="stylesheet" href="./styles.css?v=3"></head><body><header class="topbar"><div><div class="eyebrow">NSCA Payroll System</div><h1>Leave Management</h1><p>Record and approve employee leave.</p></div></header><nav class="tabs"><a href="./index.html">Payroll</a><a href="./index.html#employees">Employees</a><a href="./attendance.html">Attendance</a><a class="active" href="./leaves.html">Leaves</a><a href="./settings.html">Settings</a></nav><main><div id="message" class="message">Add or review a leave request.</div><section class="card form-card"><form id="form" class="employee-form"><div class="field"><label>Employee</label><select id="employee" required></select></div><div class="field"><label>Leave type</label><select id="type"><option value="VACATION_LEAVE">Vacation leave</option><option value="SICK_LEAVE">Sick leave</option><option value="OTHER_LEAVE">Other leave</option></select></div><div class="field"><label>From</label><input id="from" type="date" required></div><div class="field"><label>To</label><input id="to" type="date" required></div><div class="field"><label>Status</label><select id="status"><option>PENDING</option><option>APPROVED</option><option>REJECTED</option></select></div><div class="field"><label>Reason</label><input id="reason" maxlength="250"></div><label class="check-field"><input id="paid" type="checkbox" checked> Paid leave</label><div class="form-actions"><button class="primary">Save Leave</button></div></form></section><section class="card table-card"><div class="table-heading"><div><h2>Leave Records</h2><p>Only approved paid leave is included in payroll.</p></div><button id="loadBtn">Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Employee</th><th>Type</th><th>Dates</th><th>Status</th><th>Paid</th><th>Reason</th></tr></thead><tbody id="body"><tr><td colspan="6" class="empty">Loading...</td></tr></tbody></table></div></section></main><script type="module" src="./leaves.js?v=1"></script></body></html>
