<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payroll Settings</title><link rel="stylesheet" href="./styles.css?v=7"></head><body><header class="topbar"><div><div class="eyebrow">NSCA HR &amp; Payroll</div><h1>Settings</h1><p>Shared company, schedule, and payroll rules.</p></div></header><nav class="tabs"></nav><main><div id="message" class="message">Loading payroll settings...</div><section class="card form-card"><form id="form" class="employee-form"><div class="field"><label>Company name</label><input id="companyName" value="NSCA"></div><div class="field"><label>Hours per workday</label><input id="hoursPerDay" type="number" min="1" max="24" step=".5" value="8"></div><div class="field"><label>Monthly workdays divisor</label><input id="monthlyWorkdays" type="number" min="1" max="31" value="22"></div><div class="field"><label>Payroll frequency</label><select id="payFrequency"><option value="SEMI_MONTHLY">Semi-monthly</option></select></div><label class="check-field"><input id="present" type="checkbox" checked> Present is paid</label><label class="check-field"><input id="vacation" type="checkbox" checked> Vacation leave is paid</label><label class="check-field"><input id="sick" type="checkbox" checked> Sick leave is paid</label><label class="check-field"><input id="holiday" type="checkbox" checked> Holiday is paid</label><label class="check-field"><input id="absent" type="checkbox"> Absent is paid</label><label class="check-field"><input id="rest" type="checkbox"> Rest day is paid</label><div class="form-actions"><button class="primary">Save Settings</button></div></form></section><div class="message">Government contribution tables are calculated by the statutory module. HR must verify applicable rates before production payroll.</div></main><script type="module" src="./nav.js?v=1"></script><script type="module" src="./settings.js?v=2"></script></body></html>
