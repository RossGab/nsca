<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance</title><link rel="stylesheet" href="./styles.css?v=3"></head><body>
<header class="topbar"><div><div class="eyebrow">NSCA Payroll System</div><h1>Attendance</h1><p>Daily attendance for regular employees.</p></div></header>
<nav class="tabs"><a href="./index.html">Payroll</a><a href="./index.html#employees">Employees</a><a class="active" href="./attendance.html">Attendance</a><a href="./leaves.html">Leaves</a><a href="./settings.html">Settings</a></nav>
<main><div id="message" class="message">Choose an employee and date.</div><section class="card form-card"><form id="attendanceForm" class="employee-form"><div class="field"><label>Employee</label><select id="employee" required></select></div><div class="field"><label>Date</label><input id="date" type="date" required></div><div class="field"><label>Status</label><select id="status"><option>PRESENT</option><option>VACATION_LEAVE</option><option>SICK_LEAVE</option><option>ABSENT</option><option>HOLIDAY</option><option>REST_DAY</option></select></div><div class="field"><label>Time in</label><input id="timeIn" type="time"></div><div class="field"><label>Time out</label><input id="timeOut" type="time"></div><div class="field"><label>Overtime hours</label><input id="overtime" type="number" min="0" step="0.25" value="0"></div><div class="field"><label>Notes</label><input id="notes" maxlength="200"></div><div class="form-actions"><button class="primary">Save Attendance</button></div></form></section>
<section class="card table-card"><div class="table-heading"><div><h2>Attendance Records</h2><p>Use the filters to review previously saved records.</p></div><div class="file-row"><input id="from" type="date"><input id="to" type="date"><button id="loadBtn">Load</button></div></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Employee</th><th>Status</th><th>Time</th><th class="number">OT Hours</th><th>Notes</th></tr></thead><tbody id="body"><tr><td colspan="6" class="empty">No records loaded.</td></tr></tbody></table></div></section></main><script type="module" src="./attendance.js?v=1"></script></body></html>
