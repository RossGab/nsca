<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NSCA - Correct Completed Task</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#edf3f8;color:#17212d;font-family:Arial,sans-serif}
    .page{width:min(980px,calc(100% - 24px));margin:18px auto 50px}.header,.card{background:#fff;border:1px solid #d8e1ea;border-radius:14px;box-shadow:0 8px 24px rgba(37,61,84,.08)}
    .header{display:flex;align-items:center;gap:15px;padding:18px 22px;border-top:4px solid #1768b2}.header img{width:55px;height:55px;object-fit:contain}.header h1{margin:2px 0;font-size:clamp(22px,4vw,32px)}
    .eyebrow{color:#1760a8;font-weight:700;font-size:12px;letter-spacing:1.5px}.card{margin-top:14px;padding:18px}.notice{border-left:5px solid #e6aa32;background:#fff7df}
    .summary,.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 20px}.summary b,label{display:block;margin-bottom:5px;font-size:12px;color:#526477}.summary span{overflow-wrap:anywhere}.full,.radio-set{grid-column:1/-1}
    .methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px;margin:12px 0 16px}.method{display:flex;align-items:center;gap:8px;padding:11px;border:1px solid #b9c9d9;border-radius:9px;cursor:pointer}.method:has(input:checked){border-color:#0875c1;background:#eaf6ff}
    input[type=text],select,textarea{width:100%;border:1px solid #b9c9d9;border-radius:8px;padding:11px;font:inherit;background:#fff}textarea{min-height:85px;resize:vertical}.radio-set{border:1px solid #d3dde6;border-radius:9px;padding:11px}.radio-set label{display:inline-flex;align-items:center;gap:6px;margin:7px 18px 4px 0;color:#17212d;font-size:14px}
    .photos{display:flex;flex-wrap:wrap;gap:10px}.photos img{display:block;width:130px;height:100px;object-fit:cover;border-radius:8px;border:1px solid #ccd7e1}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}button{border:0;border-radius:8px;padding:11px 17px;font-weight:700;cursor:pointer}.primary{color:#fff;background:#0875c1}.secondary{background:#dfe7ef;color:#26394b}button:disabled{opacity:.55;cursor:wait}#status{margin-top:12px;font-weight:700}.error{color:#a5222c}.success{color:#18733c}
    @media(max-width:650px){.summary,.fields{grid-template-columns:1fr}.header{padding:14px}}
  </style>
</head>
<body>
<main class="page">
  <header class="header"><img src="./logo.jpg" alt="NSCA logo"><div><div class="eyebrow">NSCA TASK ADMINISTRATION</div><h1>Correct Completed Task</h1></div></header>
  <section class="card notice">This changes submitted delivery information only. Existing photos, driver, completion time, and completed status will be preserved.</section>
  <section class="card" id="loadingCard">Loading completed task...</section>
  <div id="editor" hidden>
    <section class="card"><div class="summary" id="summary"></div></section>
    <section class="card"><h2>Existing photos</h2><div class="photos" id="photos"></div></section>
    <section class="card">
      <h2>Correct delivery information</h2><div class="methods" id="methods"></div><div class="fields" id="deliveryFields"></div>
      <div class="full" style="margin-top:15px"><label for="reason">Correction reason *</label><textarea id="reason" placeholder="Explain why this completed task is being corrected."></textarea></div>
      <div id="status" role="status"></div><div class="actions"><button class="secondary" id="cancelBtn" type="button">Cancel</button><button class="primary" id="saveBtn" type="button">Submit Correction</button></div>
    </section>
  </div>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import{getAuth}from"https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import{initializeFirestore,doc,getDoc,updateDoc,deleteField,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
import{getDatabase,ref,get}from"https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyDFW61pnwLvh6HGKWt10zLYNr860fI8vkg",authDomain:"driva-pwa.firebaseapp.com",databaseURL:"https://driva-pwa-default-rtdb.firebaseio.com",projectId:"driva-pwa",storageBucket:"driva-pwa.firebasestorage.app",messagingSenderId:"299138219722",appId:"1:299138219722:web:623ff6b0a067ea822dfe33"};
const app=initializeApp(firebaseConfig),firestore=initializeFirestore(app,{},"drver-task"),rtdb=getDatabase(app),auth=getAuth(app);
const taskId=new URLSearchParams(location.search).get("taskId")||"",state={task:null,methods:{},method:"",radio:"",values:{}};
const loadingCard=document.getElementById("loadingCard"),editor=document.getElementById("editor"),methodsBox=document.getElementById("methods"),fieldsBox=document.getElementById("deliveryFields"),statusBox=document.getElementById("status");
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
function showError(message){loadingCard.hidden=false;loadingCard.classList.add("error");loadingCard.textContent=message}
function dateText(value){const d=value?.toDate?value.toDate():new Date(value||0);return Number.isNaN(d.getTime())?"-":d.toLocaleString("en-PH",{timeZone:"Asia/Manila"})}
function fieldHtml(key,field){const label=esc(field?.label||key)+(field?.required?" *":""),value=esc(state.values[key]??""),numeric=field?.numbersOnly?' inputmode="numeric" pattern="[0-9]*" data-numbers-only':"";if(field?.type==="textarea")return`<div class="full"><label>${label}</label><textarea data-key="${esc(key)}"${numeric}>${value}</textarea></div>`;if(field?.type==="dropdown"){const opts=(field.options||[]).map(v=>`<option value="${esc(v)}" ${String(v)===String(state.values[key]??"")?"selected":""}>${esc(v)}</option>`).join("");return`<div><label>${label}</label><select data-key="${esc(key)}"><option value="">-- Select --</option>${opts}</select></div>`}return`<div><label>${label}</label><input type="text" data-key="${esc(key)}" value="${value}"${numeric}></div>`}
function syncVisible(){fieldsBox.querySelectorAll("[data-key]").forEach(el=>{if(el.type==="radio"){if(el.checked)state.radio=el.value}else state.values[el.dataset.key]=el.value.trim()})}
function attachEvents(){fieldsBox.querySelectorAll("[data-key]").forEach(el=>el.addEventListener("input",()=>{if(el.hasAttribute("data-numbers-only"))el.value=el.value.replace(/[^0-9]/g,"");if(el.type!=="radio")state.values[el.dataset.key]=el.value}))}
function renderFields(){const method=state.methods[state.method];if(!method){fieldsBox.innerHTML="";return}let html="";const radios=[];for(const key of method._order||[]){const field=method.fields?.[key];if(!field)continue;if(field.type==="radio")radios.push([key,field]);else html+=fieldHtml(key,field)}if(radios.length){if(!radios.some(([key])=>key===state.radio))state.radio=radios[0][0];html+=`<div class="radio-set"><b>Delivery status</b><div>${radios.map(([key,field])=>`<label><input type="radio" data-key="deliverytype_2nd" name="deliveryStatus" value="${esc(key)}" ${key===state.radio?"checked":""}> ${esc(field.label||key)}</label>`).join("")}</div></div>`;const selected=method.fields?.[state.radio];for(const key of selected?.fields?._order||[]){const field=selected.fields.options?.[key];if(field)html+=fieldHtml(key,field)}}else state.radio="";fieldsBox.innerHTML=html;attachEvents();fieldsBox.querySelectorAll('input[name="deliveryStatus"]').forEach(radio=>radio.addEventListener("change",()=>{syncVisible();state.radio=radio.value;renderFields()}))}
function renderMethods(){methodsBox.innerHTML=Object.keys(state.methods).map(method=>`<label class="method"><input type="radio" name="method" value="${esc(method)}" ${method===state.method?"checked":""}> <span>${esc(method)}</span></label>`).join("");methodsBox.querySelectorAll('input[name="method"]').forEach(input=>input.addEventListener("change",()=>{syncVisible();state.method=input.value;state.radio="";renderFields()}))}
function configKeys(cfg){const keys=new Set;for(const key of cfg?._order||[]){keys.add(key);const field=cfg.fields?.[key];for(const child of field?.fields?._order||[])keys.add(child)}return keys}
function validate(){syncVisible();if(!state.method)return"Select a delivery method.";const method=state.methods[state.method];for(const key of method?._order||[]){const field=method.fields?.[key];if(field?.type!=="radio"&&field?.required&&!state.values[key])return`${field.label||key} is required.`}if(state.radio){const radio=method.fields?.[state.radio];for(const key of radio?.fields?._order||[]){const field=radio.fields.options?.[key];if(field?.required&&!state.values[key])return`${field.label||key} is required.`}}if(!document.getElementById("reason").value.trim())return"Correction reason is required.";return""}
async function saveCorrection(){const error=validate();if(error){statusBox.className="error";statusBox.textContent=error;return}const saveBtn=document.getElementById("saveBtn");saveBtn.disabled=true;statusBox.className="";statusBox.textContent="Saving correction...";try{const freshSnap=await getDoc(doc(firestore,"TASK",taskId));if(!freshSnap.exists())throw new Error("Task no longer exists.");const fresh=freshSnap.data();if(String(fresh.status||"").toUpperCase()!=="COMPLETED")throw new Error("Task is no longer completed. Reload the Admin Dashboard.");const oldKeys=new Set;Object.values(state.methods).forEach(cfg=>configKeys(cfg).forEach(key=>oldKeys.add(key)));const activeKeys=configKeys(state.methods[state.method]),payload={};oldKeys.forEach(key=>payload[key]=deleteField());activeKeys.forEach(key=>{if(state.values[key]!==undefined&&state.values[key]!=="")payload[key]=state.values[key]});payload.deliveryType=state.method;payload.deliverytype_2nd=state.radio||deleteField();payload.correctionReason=document.getElementById("reason").value.trim();payload.correctedBy=auth.currentUser?.email||auth.currentUser?.uid||"Administrator";payload.correctedAt=serverTimestamp();payload.adminCorrectedAt=serverTimestamp();payload.updatedAt=serverTimestamp();await updateDoc(doc(firestore,"TASK",taskId),payload);statusBox.className="success";statusBox.textContent="Correction saved. Completed status, photos, and completion time were preserved.";saveBtn.textContent="Saved"}catch(err){console.error("Completed task correction failed:",err);statusBox.className="error";statusBox.textContent=`Save failed: ${err.message||err}`;saveBtn.disabled=false}}
async function boot(){if(!taskId){showError("Missing task ID.");return}try{const snap=await getDoc(doc(firestore,"TASK",taskId));if(!snap.exists())throw new Error("Task not found.");state.task={_key:snap.id,...snap.data()};if(String(state.task.status||"").toUpperCase()!=="COMPLETED")throw new Error("Only completed tasks can be corrected on this page.");const cfgSnap=await get(ref(rtdb,`config/driverUI/jobTypes/${state.task.JOBTYPE}/deliveryMethods`));state.methods=cfgSnap.val()||{};if(!Object.keys(state.methods).length)throw new Error(`No delivery configuration was found for job type ${state.task.JOBTYPE||"(blank)"}.`);state.method=state.methods[state.task.deliveryType]?state.task.deliveryType:"";state.radio=state.task.deliverytype_2nd||"";state.values={...state.task};document.getElementById("summary").innerHTML=`<div><b>Task ID</b><span>${esc(taskId)}</span></div><div><b>Status</b><span>${esc(state.task.status)}</span></div><div><b>Customer</b><span>${esc(state.task.CUSTOMERNAME)}</span></div><div><b>Driver</b><span>${esc(state.task.driverId||state.task.AGENTID)}</span></div><div><b>Job type</b><span>${esc(state.task.JOBTYPE)}</span></div><div><b>Completed at</b><span>${esc(dateText(state.task.completedAt))}</span></div><div><b>BA</b><span>${esc(state.task.BA)}</span></div><div><b>DMZ / MRU</b><span>${esc([state.task.DMZ,state.task.MRU].filter(Boolean).join(" / "))}</span></div><div><b>Account number</b><span>${esc(state.task.ACCOUNTNUMBER)}</span></div><div><b>Meter number</b><span>${esc(state.task.METERNUMBER)}</span></div><div><b>Sequence</b><span>${esc(state.task.SEQUENCE)}</span></div><div><b>Current delivery method</b><span>${esc(state.task.deliveryType)}</span></div><div class="full"><b>Address</b><span>${esc(state.task.ADDRESS)}</span></div>`;const urls=Object.keys(state.task).filter(k=>/^photo\d+Url$/i.test(k)&&state.task[k]).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));document.getElementById("photos").innerHTML=urls.length?urls.map((key,i)=>`<a href="${esc(state.task[key])}" target="_blank" rel="noopener"><img src="${esc(state.task[key])}" alt="Task photo ${i+1}"></a>`).join(""):"No uploaded photos found.";renderMethods();renderFields();loadingCard.hidden=true;editor.hidden=false}catch(err){console.error(err);showError(err.message||String(err))}}
document.getElementById("saveBtn").addEventListener("click",saveCorrection);document.getElementById("cancelBtn").addEventListener("click",()=>window.close());boot();
</script>
</body>
</html>
