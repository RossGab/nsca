<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Report V5</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f3f3f3;padding:12px}
h2{text-align:center}
.filters{background:#fff;padding:12px;border-radius:8px;box-shadow:0 0 4px rgba(0,0,0,.1);margin-bottom:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
select,input,button{padding:8px;border-radius:6px;border:1px solid #ccc}
.check-filter{position:relative;border:1px solid #ccc;border-radius:6px;background:#fff;min-width:0}
.check-filter summary{padding:8px;cursor:pointer;list-style:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check-filter summary::-webkit-details-marker{display:none}
.check-filter summary::after{content:"▾";float:right;margin-left:8px}
.check-filter[open] summary::after{content:"▴"}
.check-options{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);max-height:260px;overflow:auto;padding:8px;background:#fff;border:1px solid #bbb;border-radius:6px;box-shadow:0 8px 22px rgba(0,0,0,.18)}
.check-options label{display:flex;align-items:center;gap:7px;padding:5px 3px;cursor:pointer;overflow-wrap:anywhere}
.check-options input{margin:0;padding:0;flex:0 0 auto}
button{background:#007bff;color:#fff;border:none;cursor:pointer}
button:hover{background:#0056b3}
button:disabled{background:#999;cursor:not-allowed}
.note{text-align:center;font-size:12px;color:#555}
#progressBox{background:#fff;padding:12px;margin-bottom:10px;border-radius:6px;font-size:13px;display:none}
.report-progress-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:7px;font-weight:bold}
.report-progress-detail{color:#555;font-size:12px;font-weight:normal;text-align:left;margin-top:6px}
.report-progress-track{height:12px;overflow:hidden;border-radius:999px;background:#dfe5ec}
.report-progress-fill{height:100%;width:0;background:#2878df;border-radius:inherit;transition:width .2s ease}
.report-progress-fill.indeterminate{width:35%;animation:reportProgress 1.1s ease-in-out infinite}
@keyframes reportProgress{0%{transform:translateX(-110%)}100%{transform:translateX(290%)}}
#dataStatus{text-align:center;font-size:12px;color:#555;margin:8px}
.error{color:#b00020;font-weight:bold}
</style>
<link rel="stylesheet" href="./admin-theme.css">
<script src="./admin-dialog.js?v=4"></script>
</head>
<body>

<header class="app-header">
  <div class="app-brand">
    <img src="./logo.jpg" class="app-logo" alt="Company Logo">
    <div class="app-brand-copy">
      <div class="app-eyebrow">NSCA Task Administration</div>
      <h1 class="app-title">Task Report <span class="app-version">V.R.0.0.6</span></h1>
    </div>
  </div>
  <div class="app-header-actions">
    <a class="app-nav-button" href="admin.html">Back to Dashboard</a>
  </div>
</header>

<div class="filters">
<select id="statusFilter">
<option value="">All Status</option>
<option value="PENDING">PENDING</option>
<option value="COMPLETED">COMPLETED</option>
</select>

<details class="check-filter" id="jobTypeFilterMenu">
  <summary id="jobTypeFilterLabel">All Job Types</summary>
  <div id="jobTypeFilter" class="check-options"></div>
</details>
<details class="check-filter" id="baFilterMenu">
  <summary id="baFilterLabel">All BA</summary>
  <div id="baFilter" class="check-options"></div>
</details>
<select id="dmzFilter"><option value="">All DMZ</option></select>

<input type="date" id="dateFrom">
<input type="date" id="dateTo">

<button id="loadButton" onclick="loadTasksForSelectedDates()">🔄 Load Firestore</button>
<button id="exportButton" onclick="generateReport()" disabled>⬇ Export XLSX</button>
</div>

<p class="note">Date range is based on <b>Created Date</b> using Philippine time.</p>
<div id="dataStatus">☁ Firestore</div>
<div id="progressBox"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import {
  initializeFirestore,
  collection,
  query,
  where,
  getDocs,
  Timestamp
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyDFW61pnwLvh6HGKWt10zLYNr860fI8vkg",
  authDomain:"driva-pwa.firebaseapp.com",
  projectId:"driva-pwa",
  storageBucket:"driva-pwa.firebasestorage.app",
  messagingSenderId:"299138219722",
  appId:"1:299138219722:web:623ff6b0a067ea822dfe33"
};

const app=initializeApp(firebaseConfig);

/* Same named Firestore database used by the Admin Dashboard */
const db=initializeFirestore(app,{}, "drver-task");
const TASK_COLLECTION="TASK";

let ALL_TASKS=[];

const dateFrom=document.getElementById("dateFrom");
const dateTo=document.getElementById("dateTo");
const statusFilter=document.getElementById("statusFilter");
const jobTypeFilter=document.getElementById("jobTypeFilter");
const baFilter=document.getElementById("baFilter");
const dmzFilter=document.getElementById("dmzFilter");
const loadButton=document.getElementById("loadButton");
const exportButton=document.getElementById("exportButton");
const progressBox=document.getElementById("progressBox");
const dataStatus=document.getElementById("dataStatus");

function getTodayPH(){
  return new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Manila"});
}

function getPHStartOfDay(s){
  const [y,m,d]=s.split("-").map(Number);
  return new Date(Date.UTC(y,m-1,d,-8,0,0,0));
}

function getPHEndOfDay(s){
  const [y,m,d]=s.split("-").map(Number);
  return new Date(Date.UTC(y,m-1,d,15,59,59,999));
}

function dayCount(from,to){
  return Math.floor(
    (new Date(to+"T00:00:00")-new Date(from+"T00:00:00"))/86400000
  )+1;
}

function toJSDate(value){
  if(!value)return null;
  if(typeof value==="object" && typeof value.toDate==="function")return value.toDate();
  if(typeof value==="object" && typeof value.seconds==="number"){
    return new Date(value.seconds*1000+Math.floor((value.nanoseconds||0)/1000000));
  }
  if(value instanceof Date)return value;
  const d=new Date(value);
  return isNaN(d.getTime())?null:d;
}

function toPHDateTime(value){
  const d=toJSDate(value);
  if(!d)return "";
  return d.toLocaleString("en-GB",{
    timeZone:"Asia/Manila",
    year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false
  });
}

function normalizeStatus(value){
  const v=String(value||"").trim().toUpperCase();
  if(v==="COMPLETED")return "COMPLETED";
  if(v==="PENDING"||v==="OPEN")return "PENDING";
  return v;
}

function taskStatus(raw){
  const status=normalizeStatus(raw?.status);
  const workStatus=normalizeStatus(raw?.workStatus);
  if(status==="COMPLETED"||workStatus==="COMPLETED")return "COMPLETED";
  return status||workStatus||"PENDING";
}

function normalizeTask(docSnap){
  const raw=docSnap.data()||{};
  return {
    _key:docSnap.id,
    ...raw,

    driverId:raw.driverId??raw.agentId??"",
    JOBTYPE:raw.JOBTYPE??raw.jobType??"",
    BA:raw.BA??raw.ba??"",
    DMZ:raw.DMZ??raw.dmz??"",
    MRU:raw.MRU??raw.mru??"",
    BG:raw.BG??raw.bg??"",
    SEQUENCE:raw.SEQUENCE??raw.sequence??"",
    METERNUMBER:raw.METERNUMBER??raw.meterNumber??"",
    ACCOUNTNUMBER:raw.ACCOUNTNUMBER??raw.accountNumber??"",
    CUSTOMERNAME:raw.CUSTOMERNAME??raw.customerName??"",
    ADDRESS:raw.ADDRESS??raw.address??"",
    ZIPCODE:raw.ZIPCODE??raw.zipCode??"",
    LATITUDE:raw.LATITUDE??raw.latitude??null,
    LONGITUDE:raw.LONGITUDE??raw.longitude??null,
    deliveryType:raw.deliveryType??"",
    status:taskStatus(raw)
  };
}

async function fetchTasks(from,to){
  const q=query(
    collection(db,TASK_COLLECTION),
    where("createdAt",">=",Timestamp.fromDate(getPHStartOfDay(from))),
    where("createdAt","<=",Timestamp.fromDate(getPHEndOfDay(to)))
  );

  const snap=await getDocs(q);
  const tasks=[];

  snap.forEach(docSnap=>{
    const task=normalizeTask(docSnap);
    if(task.deleted!==true)tasks.push(task);
  });

  tasks.sort((a,b)=>{
    const da=toJSDate(a.createdAt)?.getTime()||0;
    const db=toJSDate(b.createdAt)?.getTime()||0;
    return da-db;
  });

  return tasks;
}

function setLoading(on,text=""){
  loadButton.disabled=on;
  exportButton.disabled=on||ALL_TASKS.length===0;
  progressBox.style.display=on?"block":"none";
  if(on)progressBox.textContent=text;
}

function showReportProgress(phase,detail,percent=null,indeterminate=false){
  const safePercent=percent===null?null:Math.max(0,Math.min(100,Math.round(percent)));
  progressBox.style.display="block";
  progressBox.replaceChildren();

  const head=document.createElement("div");
  head.className="report-progress-head";
  const phaseText=document.createElement("span");
  phaseText.textContent=phase;
  const percentText=document.createElement("span");
  percentText.textContent=safePercent===null?"Working…":`${safePercent}%`;
  head.append(phaseText,percentText);

  const track=document.createElement("div");
  track.className="report-progress-track";
  const fill=document.createElement("div");
  fill.className=`report-progress-fill${indeterminate?" indeterminate":""}`;
  if(!indeterminate&&safePercent!==null)fill.style.width=`${safePercent}%`;
  track.appendChild(fill);

  const detailText=document.createElement("div");
  detailText.className="report-progress-detail";
  detailText.textContent=detail;
  progressBox.append(head,track,detailText);
}

window.loadTasksForSelectedDates=async function(){
  const from=dateFrom.value;
  const to=dateTo.value;

  if(!from||!to){
    alert("Please select both From and To dates.");
    return;
  }

  if(from>to){
    alert("Date From cannot be later than Date To.");
    return;
  }

  if(dayCount(from,to)>180){
    alert("Maximum date range is 180 days.");
    return;
  }

  setLoading(true,"☁ Loading tasks directly from Firestore...");

  try{
    ALL_TASKS=await fetchTasks(from,to);
    buildFilterOptions();
    exportButton.disabled=ALL_TASKS.length===0;

    dataStatus.textContent=
      `☁ Firestore — ${ALL_TASKS.length.toLocaleString()} task(s) loaded`;

    if(!ALL_TASKS.length){
      dataStatus.textContent=
        "☁ Firestore — No tasks found for the selected Created Date range.";
    }
  }catch(error){
    console.error("Firestore report load failed:",error);
    ALL_TASKS=[];
    exportButton.disabled=true;
    dataStatus.innerHTML=
      `<span class="error">❌ Firestore load failed: ${escapeHtml(error.message||String(error))}</span>`;
    alert("Failed to load tasks from Firestore. Check the browser console.");
  }finally{
    setLoading(false);
  }
};

function buildFilterOptions(){
  fillCheckboxGroup("jobTypeFilter","JOBTYPE","Job Types");
  fillCheckboxGroup("baFilter","BA","BA");
  fillSelect("dmzFilter","DMZ","DMZ");
}

function fillCheckboxGroup(id,field,label){
  const container=document.getElementById(id);
  const previous=new Set(
    [...container.querySelectorAll('input[type="checkbox"]:checked')].map(input=>input.value)
  );
  container.innerHTML="";

  const values=[...new Set(
    ALL_TASKS.map(t=>t[field])
      .filter(v=>v!==undefined&&v!==null&&v!=="")
      .map(String)
  )].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:"base"}));

  values.forEach(value=>{
    const option=document.createElement("label");
    const checkbox=document.createElement("input");
    const text=document.createElement("span");
    checkbox.type="checkbox";
    checkbox.value=value;
    checkbox.checked=previous.has(value);
    text.textContent=value;
    option.append(checkbox,text);
    container.appendChild(option);
  });

  updateCheckboxLabel(id,label);
}

function getCheckedValues(id){
  return new Set(
    [...document.querySelectorAll(`#${id} input[type="checkbox"]:checked`)]
      .map(input=>input.value)
  );
}

function updateCheckboxLabel(id,label){
  const selected=getCheckedValues(id);
  const labelElement=document.getElementById(`${id}Label`);
  labelElement.textContent=selected.size ? `${label} (${selected.size})` : `All ${label}`;
}

function fillSelect(id,field,label){
  const select=document.getElementById(id);
  const previous=select.value;
  select.innerHTML=`<option value="">All ${label}</option>`;

  const values=[...new Set(
    ALL_TASKS.map(t=>t[field])
      .filter(v=>v!==undefined&&v!==null&&v!=="")
      .map(String)
  )].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:"base"}));

  values.forEach(v=>{
    const opt=document.createElement("option");
    opt.value=v;
    opt.textContent=v;
    select.appendChild(opt);
  });

  if(values.includes(previous))select.value=previous;
}

function getFilteredTasks(){
  const status=statusFilter.value;
  const jobTypes=getCheckedValues("jobTypeFilter");
  const bas=getCheckedValues("baFilter");
  const dmz=dmzFilter.value;

  return ALL_TASKS.filter(task=>{
    if(status&&normalizeStatus(task.status)!==status)return false;
    if(jobTypes.size&&!jobTypes.has(String(task.JOBTYPE||"")))return false;
    if(bas.size&&!bas.has(String(task.BA||"")))return false;
    if(dmz&&String(task.DMZ||"")!==dmz)return false;
    return true;
  });
}

function flattenTaskForReport(task){
  const row={TASK_ID:task._key||""};

  for(const key in task){
    if(key==="_key")continue;

    const value=task[key];
    const col=key.toUpperCase();

    if(
      key==="createdAt"||
      key==="updatedAt"||
      key==="completedAt"||
      key==="uploadedAt"||
      key==="reopenedAt"
    ){
      // Keep timestamps as real spreadsheet dates so Excel can group the
      // filter by year and month. Invalid or missing values remain blank.
      row[col]=toJSDate(value)||"";
      continue;
    }

    if(typeof value==="object"&&value!==null){
      if(typeof value.toDate==="function"){
        row[col]=toPHDateTime(value);
      }else{
        try{row[col]=JSON.stringify(value);}
        catch{row[col]=String(value);}
      }
      continue;
    }

    row[col]=value??"";
  }

  return row;
}

function escapeHtml(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

window.generateReport=async function(){
  const from=dateFrom.value;
  const to=dateTo.value;
  const filtered=getFilteredTasks();

  if(!filtered.length){
    alert("No data found for the selected filters.");
    return;
  }

  exportButton.disabled=true;
  loadButton.disabled=true;
  const reportStartedAt=Date.now();
  const elapsed=()=>`${Math.max(1,Math.round((Date.now()-reportStartedAt)/1000))} second(s) elapsed`;
  showReportProgress(
    "Step 1 of 3 — Preparing data",
    `0 / ${filtered.length.toLocaleString()} rows • ${elapsed()}`,
    0
  );

  try{
    const rows=[];
    const headerSet=new Set();

    for(let i=0;i<filtered.length;i++){
      const row=flattenTaskForReport(filtered[i]);
      Object.keys(row).forEach(k=>headerSet.add(k));
      rows.push(row);

      if(i%500===0){
        const completed=i+1;
        showReportProgress(
          "Step 1 of 3 — Preparing data",
          `${completed.toLocaleString()} / ${filtered.length.toLocaleString()} rows • ${elapsed()}`,
          (completed/filtered.length)*40
        );
        await new Promise(r=>setTimeout(r,0));
      }
    }

    const headers=Array.from(headerSet)
      .filter(h=>h!=="TASK_ID")
      .sort();

    headers.unshift("TASK_ID");

    showReportProgress(
      "Step 2 of 3 — Building worksheet",
      `0 / ${rows.length.toLocaleString()} rows • ${elapsed()}`,
      40
    );
    await new Promise(r=>setTimeout(r,0));

    const wb=XLSX.utils.book_new();

  // Dense worksheets store cells in arrays instead of creating millions of
  // properties on one object. This prevents "Too many properties to enumerate"
  // on large reports.
    const worksheetOptions={
      dense:true,
      cellDates:true,
      dateNF:"yyyy-mm-dd hh:mm:ss"
    };
    const ws=XLSX.utils.aoa_to_sheet([headers],worksheetOptions);
    const EXCEL_BATCH_SIZE=500;

    for(let start=0;start<rows.length;start+=EXCEL_BATCH_SIZE){
      const end=Math.min(start+EXCEL_BATCH_SIZE,rows.length);
      const batch=[];

      for(let i=start;i<end;i++){
        batch.push(headers.map(h=>rows[i][h]??""));
      }

      XLSX.utils.sheet_add_aoa(ws,batch,{origin:-1,...worksheetOptions});

      showReportProgress(
        "Step 2 of 3 — Building worksheet",
        `${end.toLocaleString()} / ${rows.length.toLocaleString()} rows • ${elapsed()}`,
        40+(end/rows.length)*50
      );
      await new Promise(r=>setTimeout(r,0));
    }

  // AutoFilter is worksheet metadata, so enabling it does not require an
  // additional pass over the report rows.
    ws["!autofilter"]={
      ref:XLSX.utils.encode_range({
        s:{r:0,c:0},
        e:{r:rows.length,c:headers.length-1}
      })
    };

    XLSX.utils.book_append_sheet(wb,ws,"Tasks");
    showReportProgress(
      "Step 3 of 3 — Packaging XLSX",
      `The download is being prepared. Large reports may pause briefly • ${elapsed()}`,
      null,
      true
    );
    await new Promise(r=>setTimeout(r,50));
    XLSX.writeFile(wb,`Task_Report_${from}_to_${to}.xlsx`);
    showReportProgress(
      "Export complete",
      `${rows.length.toLocaleString()} rows exported • ${elapsed()}`,
      100
    );
    setTimeout(()=>{progressBox.style.display="none";},5000);
  }catch(error){
    console.error("XLSX report generation failed:",error);
    showReportProgress(
      "Export failed",
      error.message||String(error),
      0
    );
    alert("Failed to generate the XLSX report. Keep the page open and check the browser console.");
  }finally{
    loadButton.disabled=false;
    exportButton.disabled=ALL_TASKS.length===0;
  }
};

[statusFilter,jobTypeFilter,baFilter,dmzFilter].forEach(el=>{
  el.addEventListener("change",()=>{
    if(el===jobTypeFilter)updateCheckboxLabel("jobTypeFilter","Job Types");
    if(el===baFilter)updateCheckboxLabel("baFilter","BA");
    const count=getFilteredTasks().length;
    dataStatus.textContent=
      `☁ Firestore — ${ALL_TASKS.length.toLocaleString()} loaded / ${count.toLocaleString()} matching current filters`;
  });
});

document.addEventListener("click",event=>{
  document.querySelectorAll(".check-filter[open]").forEach(menu=>{
    if(!menu.contains(event.target))menu.removeAttribute("open");
  });
});

function markReportDateRangeChanged(){
  ALL_TASKS=[];
  buildFilterOptions();
  exportButton.disabled=true;
  dataStatus.textContent="Select a date range, then click Load Firestore.";
  progressBox.style.display="none";
}

dateFrom.addEventListener("change",markReportDateRangeChanged);
dateTo.addEventListener("change",markReportDateRangeChanged);

const today=getTodayPH();
dateFrom.value=today;
dateTo.value=today;
markReportDateRangeChanged();

</script>
</body>
</html>
