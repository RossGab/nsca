/* Same named Firestore database used by the Admin Dashboard */
const db=initializeFirestore(app,{}, "drver-task");
const TASK_COLLECTION="TASK";

let ALL_TASKS=[];

const dateFrom=document.getElementById("dateFrom");
const dateTo=document.getElementById("dateTo");

function getTodayPH(){
  return new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Manila"});
}

function getPHStartOfDay(s){
  const [y,m,d]=s.split("-").map(Number);
  return new Date(Date.UTC(y,m-1,d,-8,0,0,0));
}

function getPHEndOfDay(s){
  const [y,m,d]=s.split("-").map(Number);
  return new Date(Date.UTC(y,m-1,d,15,59,59,999));
}

function dayCount(from,to){
  return Math.floor(
    (new Date(to+"T00:00:00")-new Date(from+"T00:00:00"))/86400000
  )+1;
}

function toJSDate(value){
  if(!value)return null;
  if(typeof value==="object" && typeof value.toDate==="function")return value.toDate();
  if(typeof value==="object" && typeof value.seconds==="number"){
    return new Date(value.seconds*1000+Math.floor((value.nanoseconds||0)/1000000));
  }
  if(value instanceof Date)return value;
  const d=new Date(value);
  return isNaN(d.getTime())?null:d;
}

function toPHDateTime(value){
  const d=toJSDate(value);
  if(!d)return "";
  return d.toLocaleString("en-GB",{
    timeZone:"Asia/Manila",
    year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false
  });
}

function normalizeStatus(value){
  const v=String(value||"").trim().toUpperCase();
  if(v==="COMPLETED")return "COMPLETED";
  if(v==="PENDING"||v==="OPEN")return "PENDING";
  return v;
}

function taskStatus(raw){
  const status=normalizeStatus(raw?.status);
  const workStatus=normalizeStatus(raw?.workStatus);
  if(status==="COMPLETED"||workStatus==="COMPLETED")return "COMPLETED";
  return status||workStatus||"PENDING";
}

function normalizeTask(docSnap){
  const raw=docSnap.data()||{};
  return {
    _key:docSnap.id,
    ...raw,

    driverId:raw.driverId??raw.agentId??"",
    JOBTYPE:raw.JOBTYPE??raw.jobType??"",
    BA:raw.BA??raw.ba??"",
    DMZ:raw.DMZ??raw.dmz??"",
    MRU:raw.MRU??raw.mru??"",
    BG:raw.BG??raw.bg??"",
    SEQUENCE:raw.SEQUENCE??raw.sequence??"",
    METERNUMBER:raw.METERNUMBER??raw.meterNumber??"",
    ACCOUNTNUMBER:raw.ACCOUNTNUMBER??raw.accountNumber??"",
    CUSTOMERNAME:raw.CUSTOMERNAME??raw.customerName??"",
    ADDRESS:raw.ADDRESS??raw.address??"",
    ZIPCODE:raw.ZIPCODE??raw.zipCode??"",
    LATITUDE:raw.LATITUDE??raw.latitude??null,
    LONGITUDE:raw.LONGITUDE??raw.longitude??null,
    deliveryType:raw.deliveryType??"",
    status:taskStatus(raw)
  };
}

async function fetchTasks(from,to,onProgress=()=>{}){
  const q=query(
    collection(db,TASK_COLLECTION),
    where("createdAt",">=",Timestamp.fromDate(getPHStartOfDay(from))),
    where("createdAt","<=",Timestamp.fromDate(getPHEndOfDay(to)))
  );

  const snap=await getDocs(q);
  const tasks=[];

  const documents=snap.docs;
  onProgress(0,documents.length,"processing");
  for(let i=0;i<documents.length;i++){
    const docSnap=documents[i];
    const task=normalizeTask(docSnap);
    if(task.deleted!==true)tasks.push(task);

    if((i+1)%500===0||i===documents.length-1){
      onProgress(i+1,documents.length,"processing");
      await new Promise(resolve=>setTimeout(resolve,0));
    }
  }

  onProgress(documents.length,documents.length,"sorting");
  await new Promise(resolve=>setTimeout(resolve,0));
  tasks.sort((a,b)=>{
    const da=toJSDate(a.createdAt)?.getTime()||0;
    const db=toJSDate(b.createdAt)?.getTime()||0;
    return da-db;
  });

  return tasks;
}

function setLoading(on,text=""){
  loadButton.disabled=on;
  exportButton.disabled=on||ALL_TASKS.length===0;
  progressBox.style.display=on?"block":"none";
  if(on)progressBox.textContent=text;
}

function showReportProgress(phase,detail,percent=null,indeterminate=false){
  const safePercent=percent===null?null:Math.max(0,Math.min(100,Math.round(percent)));
  progressBox.style.display="block";
  progressBox.replaceChildren();

  const head=document.createElement("div");
  head.className="report-progress-head";
  const phaseText=document.createElement("span");
  phaseText.textContent=phase;
  const percentText=document.createElement("span");
  percentText.textContent=safePercent===null?"Working…":`${safePercent}%`;
  head.append(phaseText,percentText);

  const track=document.createElement("div");
  track.className="report-progress-track";
  const fill=document.createElement("div");
  fill.className=`report-progress-fill${indeterminate?" indeterminate":""}`;
  if(!indeterminate&&safePercent!==null)fill.style.width=`${safePercent}%`;
  track.appendChild(fill);

  const detailText=document.createElement("div");
  detailText.className="report-progress-detail";
  detailText.textContent=detail;
  progressBox.append(head,track,detailText);
}

window.loadTasksForSelectedDates=async function(){
  const from=dateFrom.value;
  const to=dateTo.value;

  if(!from||!to){
    alert("Please select both From and To dates.");
    return;
  }

  if(from>to){
    alert("Date From cannot be later than Date To.");
    return;
  }

  if(dayCount(from,to)>180){
    alert("Maximum date range is 180 days.");
    return;
  }

  setLoading(true,"Loading tasks directly from Firestore...");
  const loadStartedAt=Date.now();
  const loadElapsed=()=>`${Math.max(1,Math.round((Date.now()-loadStartedAt)/1000))} second(s) elapsed`;
  showReportProgress(
    "Connecting to Firestore",
    `Waiting for tasks in the selected date range • ${loadElapsed()}`,
    null,
    true
  );
  let queryProgressTimer=setInterval(()=>{
    showReportProgress(
      "Loading tasks from Firestore",
      `Still working — waiting for Firestore • ${loadElapsed()}`,
      null,
      true
    );
  },1000);

  try{
    ALL_TASKS=await fetchTasks(from,to,(processed,total,phase)=>{
      if(queryProgressTimer){
        clearInterval(queryProgressTimer);
        queryProgressTimer=null;
      }

      if(phase==="sorting"){
        showReportProgress(
          "Finalizing loaded tasks",
          `${total.toLocaleString()} tasks received • Sorting by date • ${loadElapsed()}`,
          null,
          true
        );
        return;
      }

      const percent=total?processed/total*100:100;
      showReportProgress(
        "Processing Firestore results",
        `${processed.toLocaleString()} / ${total.toLocaleString()} tasks • ${loadElapsed()}`,
        percent
      );
    });
    buildFilterOptions();
    exportButton.disabled=ALL_TASKS.length===0;

    dataStatus.textContent=
      `☁ Firestore — ${ALL_TASKS.length.toLocaleString()} task(s) loaded`;

    if(!ALL_TASKS.length){
      dataStatus.textContent=
        "☁ Firestore — No tasks found for the selected Created Date range.";
    }
  }catch(error){
    console.error("Firestore report load failed:",error);
    ALL_TASKS=[];
    exportButton.disabled=true;
    dataStatus.innerHTML=
      `<span class="error">❌ Firestore load failed: ${escapeHtml(error.message||String(error))}</span>`;
    alert("Failed to load tasks from Firestore. Check the browser console.");
  }finally{
    if(queryProgressTimer)clearInterval(queryProgressTimer);
    setLoading(false);
  }
};

function buildFilterOptions(){
  fillCheckboxGroup("jobTypeFilter","JOBTYPE","Job Types");
  fillCheckboxGroup("baFilter","BA","BA");
  fillSelect("dmzFilter","DMZ","DMZ");
}

function fillCheckboxGroup(id,field,label){
  const container=document.getElementById(id);
  const previous=new Set(
    [...container.querySelectorAll('input[type="checkbox"]:checked')].map(input=>input.value)
  );
  container.innerHTML="";

  const values=[...new Set(
    ALL_TASKS.map(t=>t[field])
      .filter(v=>v!==undefined&&v!==null&&v!=="")
      .map(String)
  )].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:"base"}));

  values.forEach(value=>{
    const option=document.createElement("label");
    const checkbox=document.createElement("input");
    const text=document.createElement("span");
    checkbox.type="checkbox";
    checkbox.value=value;
    checkbox.checked=previous.has(value);
    text.textContent=value;
    option.append(checkbox,text);
    container.appendChild(option);
  });

  updateCheckboxLabel(id,label);
}

function getCheckedValues(id){
  return new Set(
    [...document.querySelectorAll(`#${id} input[type="checkbox"]:checked`)]
      .map(input=>input.value)
  );
}

function updateCheckboxLabel(id,label){
  const selected=getCheckedValues(id);
  const labelElement=document.getElementById(`${id}Label`);
  labelElement.textContent=selected.size ? `${label} (${selected.size})` : `All ${label}`;
}

function fillSelect(id,field,label){
  const select=document.getElementById(id);
  const previous=select.value;
  select.innerHTML=`<option value="">All ${label}</option>`;

  const values=[...new Set(
    ALL_TASKS.map(t=>t[field])
      .filter(v=>v!==undefined&&v!==null&&v!=="")
      .map(String)
  )].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:"base"}));

  values.forEach(v=>{
    const opt=document.createElement("option");
    opt.value=v;
    opt.textContent=v;
    select.appendChild(opt);
  });

  if(values.includes(previous))select.value=previous;
}

function getFilteredTasks(){
  const status=statusFilter.value;
  const jobTypes=getCheckedValues("jobTypeFilter");
  const bas=getCheckedValues("baFilter");
  const dmz=dmzFilter.value;

  return ALL_TASKS.filter(task=>{
    if(status&&normalizeStatus(task.status)!==status)return false;
    if(jobTypes.size&&!jobTypes.has(String(task.JOBTYPE||"")))return false;
    if(bas.size&&!bas.has(String(task.BA||"")))return false;
    if(dmz&&String(task.DMZ||"")!==dmz)return false;
    return true;
  });
}

function flattenTaskForReport(task){
  const row={TASK_ID:task._key||""};

  for(const key in task){
    if(key==="_key")continue;

    const value=task[key];
    const col=key.toUpperCase();

    if(
      key==="createdAt"||
      key==="updatedAt"||
      key==="completedAt"||
      key==="uploadedAt"||
      key==="reopenedAt"
    ){
      // Keep timestamps as real spreadsheet dates so Excel can group the
      // filter by year and month. Invalid or missing values remain blank.
      row[col]=toJSDate(value)||"";
      continue;
    }

    if(typeof value==="object"&&value!==null){
      if(typeof value.toDate==="function"){
        row[col]=toPHDateTime(value);
      }else{
        try{row[col]=JSON.stringify(value);}
        catch{row[col]=String(value);}
      }
      continue;
    }

    row[col]=value??"";
  }

  return row;
}

function escapeHtml(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

window.generateReport=async function(){
  const from=dateFrom.value;
  const to=dateTo.value;
  const filtered=getFilteredTasks();

  if(!filtered.length){
    alert("No data found for the selected filters.");
    return;
  }

  exportButton.disabled=true;
  loadButton.disabled=true;
  const reportStartedAt=Date.now();
  const elapsed=()=>`${Math.max(1,Math.round((Date.now()-reportStartedAt)/1000))} second(s) elapsed`;
  showReportProgress(
    "Step 1 of 3 — Preparing data",
    `0 / ${filtered.length.toLocaleString()} rows • ${elapsed()}`,
    0
  );

  try{
    const rows=[];
    const headerSet=new Set();

    for(let i=0;i<filtered.length;i++){
      const row=flattenTaskForReport(filtered[i]);
      Object.keys(row).forEach(k=>headerSet.add(k));
      rows.push(row);

      if(i%500===0){
        const completed=i+1;
        showReportProgress(
          "Step 1 of 3 — Preparing data",
          `${completed.toLocaleString()} / ${filtered.length.toLocaleString()} rows • ${elapsed()}`,
          (completed/filtered.length)*40
        );
        await new Promise(r=>setTimeout(r,0));
      }
    }

    const headers=Array.from(headerSet)
      .filter(h=>h!=="TASK_ID")
      .sort();

    headers.unshift("TASK_ID");

    showReportProgress(
      "Step 2 of 3 — Building worksheet",
      `0 / ${rows.length.toLocaleString()} rows • ${elapsed()}`,
      40
    );
    await new Promise(r=>setTimeout(r,0));

    const wb=XLSX.utils.book_new();

    // Dense worksheets store cells in arrays instead of creating millions of
    // properties on one object. Large reports are divided into worksheet tabs
    // so SheetJS never has to create one extremely large worksheet XML string.
    const worksheetOptions={
      dense:true,
      cellDates:true,
      dateNF:"yyyy-mm-dd hh:mm:ss"
    };
    const EXCEL_BATCH_SIZE=500;
    const ROWS_PER_SHEET=25000;
    const rowsByJobType=new Map();
    rows.forEach(row=>{
      const jobType=String(row.JOBTYPE||"").trim()||"Unspecified";
      if(!rowsByJobType.has(jobType))rowsByJobType.set(jobType,[]);
      rowsByJobType.get(jobType).push(row);
    });
    const jobTypeGroups=[...rowsByJobType.entries()].sort(([a],[b])=>
      a.localeCompare(b,undefined,{numeric:true,sensitivity:"base"})
    );
    const sheetCount=jobTypeGroups.reduce(
      (total,[,jobRows])=>total+Math.ceil(jobRows.length/ROWS_PER_SHEET),
      0
    );
    let truncatedCellCount=0;
    let completedRows=0;
    let currentSheetNumber=0;
    const usedSheetNames=new Set();
    const toExcelCell=value=>{
      const cellValue=value??"";
      if(typeof cellValue!=="string"||cellValue.length<=32767)return cellValue;
      truncatedCellCount++;
      return `${cellValue.slice(0,32750)}… [truncated]`;
    };
    const uniqueSheetName=(jobType,part,totalParts)=>{
      const suffix=totalParts>1?` ${part}`:"";
      const cleaned=String(jobType).replace(/[\\/?*\[\]:]/g," ").trim()||"Unspecified";
      const base=`${cleaned.slice(0,Math.max(1,31-suffix.length))}${suffix}`;
      let candidate=base;
      let duplicate=2;
      while(usedSheetNames.has(candidate.toUpperCase())){
        const duplicateSuffix=` ${duplicate++}`;
        candidate=`${base.slice(0,31-duplicateSuffix.length)}${duplicateSuffix}`;
      }
      usedSheetNames.add(candidate.toUpperCase());
      return candidate;
    };

    for(const [jobType,jobRows] of jobTypeGroups){
      const parts=Math.ceil(jobRows.length/ROWS_PER_SHEET);
      for(let part=1;part<=parts;part++){
        currentSheetNumber++;
        const sheetStart=(part-1)*ROWS_PER_SHEET;
        const sheetEnd=Math.min(sheetStart+ROWS_PER_SHEET,jobRows.length);
        const ws=XLSX.utils.aoa_to_sheet([headers],worksheetOptions);

        for(let start=sheetStart;start<sheetEnd;start+=EXCEL_BATCH_SIZE){
          const end=Math.min(start+EXCEL_BATCH_SIZE,sheetEnd);
          const batch=[];

          for(let i=start;i<end;i++){
            batch.push(headers.map(h=>toExcelCell(jobRows[i][h])));
          }

          XLSX.utils.sheet_add_aoa(ws,batch,{origin:-1,...worksheetOptions});
          const processedNow=end-start;
          completedRows+=processedNow;
          showReportProgress(
            `Step 2 of 3 — ${jobType} (${currentSheetNumber} of ${sheetCount})`,
            `${completedRows.toLocaleString()} / ${rows.length.toLocaleString()} rows • ${elapsed()}`,
            40+(completedRows/rows.length)*50
          );
          await new Promise(r=>setTimeout(r,0));
        }

        ws["!autofilter"]={
          ref:XLSX.utils.encode_range({
            s:{r:0,c:0},
            e:{r:sheetEnd-sheetStart,c:headers.length-1}
          })
        };
        XLSX.utils.book_append_sheet(wb,ws,uniqueSheetName(jobType,part,parts));
      }
    }

    showReportProgress(
      "Step 3 of 3 — Packaging XLSX",
      `${sheetCount} worksheet(s) • Compression enabled • ${elapsed()}`,
      null,
      true
    );
    await new Promise(r=>setTimeout(r,50));
    XLSX.writeFile(
      wb,
      `Task_Report_${from}_to_${to}.xlsx`,
      {compression:true,bookSST:false}
    );
    showReportProgress(
      "Export complete",
      `${rows.length.toLocaleString()} rows in ${sheetCount} worksheet(s)`+
        `${truncatedCellCount?` • ${truncatedCellCount.toLocaleString()} oversized cell(s) shortened`:""}`+
        ` • ${elapsed()}`,
      100
    );
    setTimeout(()=>{progressBox.style.display="none";},5000);
  }catch(error){
    console.error("XLSX report generation failed:",error);
    showReportProgress(
      "Export failed",
      error.message||String(error),
      0
    );
    alert("Failed to generate the XLSX report. Keep the page open and check the browser console.");
  }finally{
    loadButton.disabled=false;
    exportButton.disabled=ALL_TASKS.length===0;
  }
};

const CLOUD_REPORT_URL=

// WIP export path: Firestore reading and XLSX construction happen inside the
// Cloud Function. The browser only receives the finished compressed stream.
window.generateReport=async function(){
  const from=dateFrom.value;
  const to=dateTo.value;
  if(!from||!to){
    alert("Please select both From and To dates.");
    return;
  }
  if(from>to){
    alert("Date From cannot be later than Date To.");
    return;
  }
  if(dayCount(from,to)>62){
    alert("Cloud reports are limited to 62 days per request.");
    return;
  }

  exportButton.disabled=true;
  loadButton.disabled=true;
  const startedAt=Date.now();
  const elapsed=()=>`${Math.max(1,Math.round((Date.now()-startedAt)/1000))} second(s) elapsed`;
  showReportProgress(
    "Cloud report requested",
    `Firebase is reading tasks and building Job Type worksheets • ${elapsed()}`,
    null,
    true
  );
  const waitingTimer=setInterval(()=>{
    showReportProgress(
      "Cloud Function is working",
      `Keep this page open • ${elapsed()}`,
      null,
      true
    );
  },1000);

  try{
    const status=statusFilter.value;
    const dmz=dmzFilter.value;
    const response=await fetch(CLOUD_REPORT_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        from,
        to,
        statuses:status?[status]:[],
        jobTypes:[...getCheckedValues("jobTypeFilter")],
        bas:[...getCheckedValues("baFilter")],
        dmzs:dmz?[dmz]:[]
      })
    });
    clearInterval(waitingTimer);

    if(!response.ok){
      let message=`Cloud report failed (${response.status}).`;
      try{
        const errorBody=await response.json();
        if(errorBody?.error)message=errorBody.error;
      }catch{}
      throw new Error(message);
    }

    const taskCount=Number(response.headers.get("X-Task-Count")||0);
    const reader=response.body?.getReader();
    const chunks=[];
    let receivedBytes=0;
    if(reader){
      while(true){
        const {done,value}=await reader.read();
        if(done)break;
        chunks.push(value);
        receivedBytes+=value.byteLength;
        showReportProgress(
          "Downloading generated XLSX",
          `${taskCount.toLocaleString()} tasks • ${(receivedBytes/1048576).toFixed(1)} MB received • ${elapsed()}`,
          null,
          true
        );
      }
    }else{
      chunks.push(new Uint8Array(await response.arrayBuffer()));
      receivedBytes=chunks[0].byteLength;
    }

    const blob=new Blob(chunks,{
      type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    });
    const url=URL.createObjectURL(blob);
    const link=document.createElement("a");
    link.href=url;
    link.download=`Task_Report_${from}_to_${to}.xlsx`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    showReportProgress(
      "Cloud export complete",
      `${taskCount.toLocaleString()} tasks • ${(receivedBytes/1048576).toFixed(1)} MB • ${elapsed()}`,
      100
    );
    setTimeout(()=>{progressBox.style.display="none";},5000);
  }catch(error){
    clearInterval(waitingTimer);
    console.error("Cloud XLSX report failed:",error);
    showReportProgress("Cloud export failed",error.message||String(error),0);
    alert(error.message||"Cloud report generation failed.");
  }finally{
    loadButton.disabled=false;
    exportButton.disabled=false;
  }
};

[statusFilter,jobTypeFilter,baFilter,dmzFilter].forEach(el=>{
  el.addEventListener("change",()=>{
    if(el===jobTypeFilter)updateCheckboxLabel("jobTypeFilter","Job Types");
    if(el===baFilter)updateCheckboxLabel("baFilter","BA");
    const count=getFilteredTasks().length;
    dataStatus.textContent=
      `☁ Firestore — ${ALL_TASKS.length.toLocaleString()} loaded / ${count.toLocaleString()} matching current filters`;
  });
});

document.addEventListener("click",event=>{
  document.querySelectorAll(".check-filter[open]").forEach(menu=>{
    if(!menu.contains(event.target))menu.removeAttribute("open");
  });
});

function markReportDateRangeChanged(){
  ALL_TASKS=[];
  buildFilterOptions();
  exportButton.disabled=false;
  dataStatus.textContent="Select a date range and export through the Cloud Function. Load Firestore is optional for choosing task filters.";
  progressBox.style.display="none";
}

dateFrom.addEventListener("change",markReportDateRangeChanged);
dateTo.addEventListener("change",markReportDateRangeChanged);

const today=getTodayPH();
dateFrom.value=today;
dateTo.value=today;
markReportDateRangeChanged();

</script>
</body>
