function getTodayPH() {
  return new Date().toLocaleDateString("en-CA", {
    timeZone: "Asia/Manila"
  });
}

function normalizeDate(dateStr) {
  if (!dateStr || typeof dateStr !== "string") return null;

  // 🔥 FAST PATH: already YYYY-MM-DD or ISO
  if (dateStr.length >= 10) {
    const part = dateStr.slice(0, 10);

    // quick validation: YYYY-MM-DD
    if (/^\d{4}-\d{2}-\d{2}$/.test(part)) {
      return part;
    }
  }

  // ❌ skip expensive parsing for bad data
  return null;
}

/* ===== PH TIME ===== */
function toPHTime(ts) {

  if (!ts) return "";

  // Firestore Timestamp
  if (typeof ts.toDate === "function") {
    return ts.toDate().toLocaleString("en-PH", {
      timeZone: "Asia/Manila",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });
  }

  // Normal Date / string
  const date = ts instanceof Date
    ? ts
    : new Date(ts);

  if (isNaN(date.getTime())) {
    return "";
  }

  return date.toLocaleString("en-PH", {
    timeZone: "Asia/Manila",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  });
}

async function loadLiveTasksFromFirebase(
  dateKey,
  onProgress,
  direction = "first"
) {

  if (FIRESTORE_LOADING) {
    console.log("🔥 Firestore load already running");
    return [];
  }

  FIRESTORE_LOADING = true;

  try {

    const firestoreDate =
      `${dateKey.slice(0, 4)}-${dateKey.slice(4, 6)}-${dateKey.slice(6, 8)}`;

    console.log(
      `🔥 Firestore ${direction}: ${firestoreDate}`
    );

    const tasksRef = collection(db, "TASK");

    let q;

    if (
      direction === "first" ||
      !FIRESTORE_LAST_DOC
    ) {

      q = query(
        tasksRef,
        where("assignedDate", "==", firestoreDate),
        orderBy("createdAt"),
        limit(FIRESTORE_PAGE_SIZE)
      );

    } else {

      q = query(
        tasksRef,
        where("assignedDate", "==", firestoreDate),
        orderBy("createdAt"),
        startAfter(FIRESTORE_LAST_DOC),
        limit(FIRESTORE_PAGE_SIZE)
      );

    }

    const snapshot = await getDocs(q);

    const results = [];

    snapshot.forEach(docSnap => {

      results.push({
        _key: docSnap.id,
        ...docSnap.data()
      });

    });

    if (snapshot.docs.length > 0) {
      FIRESTORE_LAST_DOC =
        snapshot.docs[snapshot.docs.length - 1];
    }

    FIRESTORE_HAS_MORE =
      snapshot.docs.length === FIRESTORE_PAGE_SIZE;

    FIRESTORE_CURRENT_DATE = dateKey;

    console.log(
      `🔥 Firestore returned ${results.length} tasks`
    );

    console.log(
      `🔥 Has more: ${FIRESTORE_HAS_MORE}`
    );

    if (onProgress) {
      onProgress(
        100,
        results.length,
        results.length
      );
    }

    return results;

  } catch (e) {

    console.error(
      "🔥 Firestore load failed:",
      e
    );

    return [];

  } finally {

    FIRESTORE_LOADING = false;

  }
}

/* ===== LOAD TASKS - FIRESTORE ONLY ===== */
async function loadTasks() {
  if (loadBtn.disabled) {
    // Keep the last date selection when a previous range is still loading.
    TASK_LOAD_PENDING = true;
    return;
  }

  loadBtn.disabled = true;
  loadBtn.innerText = "Loading...";

  try {
    const from = filterDateFrom.value;
    const to   = filterDateTo.value;

    if (!from || !to) {
      alert("Select date range");

      loadBtn.disabled = false;
      loadBtn.innerText = "🔄 Load Tasks";
      return;
    }

    document.getElementById("taskList").innerHTML = "";
    loadingBar.style.display = "block";
    loadingProgress.style.width = "0%";
    loadingText.innerText = "Starting...";

    const dateKeys = [];

    for (
      let d = new Date(from);
      d <= new Date(to);
      d.setDate(d.getDate() + 1)
    ) {
      dateKeys.push(
        d.toLocaleDateString("en-CA", {
          timeZone: "Asia/Manila"
        }).replace(/-/g, "")
      );
    }

    let allTasks = [];
    let rangeTasks = [];
    const cached = await readTaskCache(from, to);

    if (!taskCacheNeedsFullRefresh(cached)) {
      rangeTasks = cached.tasks || [];
      const since = Math.max(
        0,
        (cached.syncedAt || 0) - TASK_CACHE_OVERLAP_MS
      );
      loadingText.innerText =
        `Checking updates for ${rangeTasks.length} cached tasks...`;

      const snapshot = await getDocs(query(
        collection(db, "TASK"),
        where("updatedAt", ">", Timestamp.fromMillis(since)),
        orderBy("updatedAt")
      ));
      const updates = [];
      snapshot.forEach(docSnap => {
        updates.push({ _key: docSnap.id, ...docSnap.data() });
      });

      rangeTasks = mergeTaskUpdates(rangeTasks, updates, from, to);
      await writeTaskCache(from, to, rangeTasks, {
        previousFullSyncedAt: cached.fullSyncedAt,
        previousWatermark: cached.watermarkMillis
      });
      loadingProgress.style.width = "100%";
      loadingText.innerText = `Cache updated (${updates.length} change(s))`;
    } else {

    // 🔥 FIRESTORE ONLY
    // Load the selected dates directly from Firestore.
    for (let i = 0; i < dateKeys.length; i++) {

      const key = dateKeys[i];

      // Reset Firestore pagination for every date.
      FIRESTORE_LAST_DOC = null;
      FIRESTORE_HAS_MORE = false;
      FIRESTORE_CURRENT_DATE = null;
      FIRESTORE_PAGE = 0;

      loadingText.innerText =
        `Loading Firestore ${i + 1} / ${dateKeys.length}`;

      const result = await loadLiveTasksFromFirebase(
        key,
        (p, loaded, total) => {

          const dateProgress =
            ((i + (p / 100)) / dateKeys.length) * 100;

          loadingProgress.style.width =
            Math.min(100, dateProgress) + "%";

          loadingText.innerText =
            `Loading Firestore... (${loaded}/${total})`;
        },
        "first"
      );

      result.forEach(t => {
        if (t.deleted === true) return;
        rangeTasks.push(t);
        if (t.status !== "COMPLETED") {
          allTasks.push(t);
        }
      });

      while (FIRESTORE_HAS_MORE) {
        const nextPage = await loadLiveTasksFromFirebase(key, null, "next");
        rangeTasks.push(...excludeDeletedTasks(nextPage));
      }
    }

      await writeTaskCache(from, to, rangeTasks, { full: true });
    }

    allTasks = rangeTasks.filter(task =>
      task.status !== "COMPLETED" &&
      String(task.workStatus || "").toUpperCase() !== "COMPLETED"
    );

    // 🔥 INIT INDEXES
    window.__TASKS_BY_DATE__ = {};
    window.__TASKS_BY_DRIVER__ = {};
    window.__TASKS_BY_JOB__ = {};

    TASK_MAP = {};

    // ===== BUILD INDEXES =====
    allTasks.forEach(t => {

      TASK_MAP[t._key] = t;

      // Use the same date field as the Firestore query. createdAt is UTC
      // and can fall on the previous date before 08:00 in Manila.
      let d = normalizeDate(t.assignedDate);

      if (!d) {
        d = normalizeDate(t.createdAt);
      }

      // 🔥 fallback to filter date if missing
      if (!d) {
        d = filterDateFrom.value;
      }

      t._date = d;

      if (!window.__TASKS_BY_DATE__[d]) {
        window.__TASKS_BY_DATE__[d] = [];
      }

      window.__TASKS_BY_DATE__[d].push(t);

      t._search = Object.values(t)
        .map(v => (v || "").toString().toLowerCase())
        .join(" ");

      // ===== DRIVER INDEX =====
      if (t.agentId) {

        if (!window.__TASKS_BY_DRIVER__[t.agentId]) {
          window.__TASKS_BY_DRIVER__[t.agentId] = [];
        }

        window.__TASKS_BY_DRIVER__[t.agentId].push(t);
      }

      // ===== JOB INDEX =====
      if (t.jobType) {

        if (!window.__TASKS_BY_JOB__[t.jobType]) {
          window.__TASKS_BY_JOB__[t.jobType] = [];
        }

        window.__TASKS_BY_JOB__[t.jobType].push(t);
      }

    });

    // 🔥 RESET SELECTION STATE
    SELECTED_IDS.clear();
    checkAll.checked = false;

    LAST_FILTER_HASH = "";

    // Store the loaded Firestore tasks in the main dataset.
    window.__TASKS_DATA__ = allTasks;

    buildFilterLists();

    applyFilters();

    loadingProgress.style.width = "100%";
    loadingText.innerText =
      `Done (${allTasks.length} tasks loaded)`;

    setTimeout(() => {
      loadingBar.style.display = "none";
    }, 500);

  } catch (err) {

    console.error("❌ loadTasks failed:", err);
    alert("Something went wrong while loading tasks");

  } finally {

    loadBtn.disabled = false;
    loadBtn.innerText = "🔄 Load Tasks";

    if (TASK_LOAD_PENDING) {
      TASK_LOAD_PENDING = false;
      loadTasks();
    }
  }
}


checkAll.onchange = () => {
  const start = CURRENT_PAGE * PAGE_SIZE;
  const end = start + PAGE_SIZE;

  const pageData = FILTERED_TASKS.slice(start, end);

  if (checkAll.checked) {
    pageData.forEach(t => SELECTED_IDS.add(t._key));
  } else {
    pageData.forEach(t => SELECTED_IDS.delete(t._key));
  }

  renderCurrentPage();
};

function renderCurrentPage() {
  const start = CURRENT_PAGE * PAGE_SIZE;
  const end = start + PAGE_SIZE;

  const pageData = FILTERED_TASKS.slice(start, end);

  renderTasks(pageData);
  renderPaginationControls();
}

function buildFilterLists() {
  const drivers = new Set();
  const jobs = new Set();
  const bas = new Set();
  const dmzs = new Set();
  const mrus = new Set();

  const data = window.__TASKS_DATA__ || [];

  // ✅ FIX: LOOP WITH BODY
  for (let i = 0; i < data.length; i++) {
    const t = data[i];

    if (t.agentId) drivers.add(t.agentId);
    if (t.jobType) jobs.add(t.jobType);
    if (t.ba) bas.add(t.ba);
    if (t.dmz) dmzs.add(t.dmz);
    if (t.mru) mrus.add(t.mru);
  }

  // ✅ populate dropdowns
  filterDriver.innerHTML = `<option value="">All Drivers</option>`;
  filterJob.innerHTML = `<option value="">All Job Types</option>`;
  filterBA.innerHTML = `<option value="">All BA</option>`;
  filterDMZ.innerHTML = `<option value="">All DMZ</option>`;
  filterMRU.innerHTML = `<option value="">All MRU</option>`;

  drivers.forEach(v => filterDriver.innerHTML += `<option>${v}</option>`);
  jobs.forEach(v => filterJob.innerHTML += `<option>${v}</option>`);
  bas.forEach(v => filterBA.innerHTML += `<option>${v}</option>`);
  dmzs.forEach(v => filterDMZ.innerHTML += `<option>${v}</option>`);
  mrus.forEach(v => filterMRU.innerHTML += `<option>${v}</option>`);
}

function renderPaginationControls() {
  const el = document.getElementById("paginationControls");
  if (!el) return;

  const totalPages = Math.ceil(FILTERED_TASKS.length / PAGE_SIZE);

  if (totalPages <= 1) {
    el.innerHTML = "";
    return;
  }

  el.innerHTML = `
    <button ${CURRENT_PAGE === 0 ? "disabled" : ""}
      onclick="prevPage()">⬅ Prev</button>

    <span style="margin:0 12px;">
      Page ${CURRENT_PAGE + 1} of ${totalPages}
      (${FILTERED_TASKS.length} tasks)
    </span>

    <button ${CURRENT_PAGE >= totalPages - 1 ? "disabled" : ""}
      onclick="nextPage()">Next ➡</button>
  `;
}

window.prevPage = function () {
  if (CURRENT_PAGE > 0) {
    CURRENT_PAGE--;
    renderCurrentPage();
  }
};

window.nextPage = function () {
  const totalPages = Math.ceil(FILTERED_TASKS.length / PAGE_SIZE);
  if (CURRENT_PAGE < totalPages - 1) {
    CURRENT_PAGE++;
    renderCurrentPage();
  }
};
  
function applyFilters() {

  const filterHash = JSON.stringify({
    from: filterDateFrom.value,
    to: filterDateTo.value,
    driver: filterDriver.value,
    job: filterJob.value,
    ba: filterBA.value,
    dmz: filterDMZ.value,
    mru: filterMRU.value,
    search: SEARCH_TERM
  });

  const prevPage = CURRENT_PAGE;

  const isSame = filterHash === LAST_FILTER_HASH;

    LAST_FILTER_HASH = filterHash;
    
    if (!isSame) {
      CURRENT_PAGE = 0;
    }

  let base = [];

// 🔥 PRIORITY: DRIVER → JOB → DATE → ALL

if (filterDriver.value && window.__TASKS_BY_DRIVER__[filterDriver.value]) {
  base = window.__TASKS_BY_DRIVER__[filterDriver.value];
}
else if (filterJob.value && window.__TASKS_BY_JOB__[filterJob.value]) {
  base = window.__TASKS_BY_JOB__[filterJob.value];
}
else {
  // fallback to date filter
  const from = filterDateFrom.value;
  const to   = filterDateTo.value;

  if (from || to) {
    const start = from || "0000-00-00";
    const end   = to   || "9999-99-99";

    const map = window.__TASKS_BY_DATE__ || {};

    for (const d in map) {
      if (d >= start && d <= end) {
        base.push(...map[d]);
      }
    }
  } else {
    base = window.__TASKS_DATA__ || [];
  }
}



const hasSearch = !!SEARCH_TERM;
let result = [];

for (let i = 0; i < base.length; i++) {
  const t = base[i];

  // DATE
  if (filterDateFrom.value || filterDateTo.value) {
    const from = filterDateFrom.value || "0000-00-00";
    const to   = filterDateTo.value   || "9999-99-99";

    const d = t._date;
    if (d && (d < from || d > to)) continue;
  }

  // OTHER FILTERS
  if (filterDriver.value && t.agentId !== filterDriver.value) continue;
  if (filterJob.value && t.jobType !== filterJob.value) continue;
  if (filterBA.value && t.ba !== filterBA.value) continue;
  if (filterDMZ.value && t.dmz !== filterDMZ.value) continue;
  if (filterMRU.value && t.mru !== filterMRU.value) continue;

  // SEARCH
 if (hasSearch && (!t._search || !t._search.includes(SEARCH_TERM))) continue;

  result.push(t);
}

  FILTERED_TASKS = result;

  const totalPages = Math.ceil(FILTERED_TASKS.length / PAGE_SIZE);

  // 🔥 KEEP PAGE IF STILL VALID
  if (prevPage < totalPages) {
    CURRENT_PAGE = prevPage;
  } else {
    CURRENT_PAGE = Math.max(0, totalPages - 1);
  }

  renderCurrentPage();
}

/* ===== BULK ACTION ===== */
window.openBulkActions = async function () {
  
  const ids = [...SELECTED_IDS];

  console.log("Selected IDs:", ids);
  
  if (!ids.length) return;

  const action = await nscaPrompt(
    "Type an action:\n\n" +
    "TRANSFER - assign to another driver\n" +
    "DELETE - remove selected tasks\n" +
    "REDOWNLOAD - return pending tasks to Task for Download"
  );

  if (!action) return;

  const cmd = action.toUpperCase().trim();

  if (cmd === "DELETE") await bulkDelete(ids);
  else if (cmd === "TRANSFER") await bulkTransfer(ids);
  else if (cmd === "REDOWNLOAD") await bulkRedownload(ids);
  else alert("Invalid action. Use TRANSFER, DELETE or REDOWNLOAD.");
};

async function bulkRedownload(ids) {
  const eligible = [];
  const skipped = [];

  try {
    // Recheck Firestore instead of trusting the locally cached status. This
    // prevents a recently completed or deleted task from being reopened.
    for (let offset = 0; offset < ids.length; offset += 50) {
      const chunk = ids.slice(offset, offset + 50);
      const snapshots = await Promise.all(
        chunk.map(id => getDoc(doc(db, "TASK", id)))
      );

      snapshots.forEach((snapshot, index) => {
        const id = chunk[index];
        if (!snapshot.exists()) {
          skipped.push({ id, reason: "not found" });
          return;
        }

        const task = snapshot.data() || {};
        const status = String(task.status || "").trim().toUpperCase();
        const workStatus = String(task.workStatus || "").trim().toLowerCase();

        if (task.deleted === true) {
          skipped.push({ id, reason: "deleted" });
        } else if (status === "COMPLETED" || workStatus === "completed") {
          skipped.push({ id, reason: "completed" });
        } else if (workStatus !== "pending") {
          skipped.push({ id, reason: `currently ${workStatus || "unknown"}` });
        } else if (!String(task.agentId || task.driverId || "").trim()) {
          skipped.push({ id, reason: "no assigned driver" });
        } else {
          eligible.push(id);
        }
      });
    }
  } catch (error) {
    console.error("Failed to validate tasks for redownload:", error);
    alert("Could not verify the selected tasks. Check the connection and try again.");
    return;
  }

  if (!eligible.length) {
    alert(
      `No selected tasks can be returned for download.\n\n` +
      `${skipped.length} skipped because they are completed, deleted, already for download, missing, or not assigned.`
    );
    return;
  }

  const confirmed = await nscaConfirm(
    `Return ${eligible.length} pending task(s) to Task for Download?\n\n` +
    `${skipped.length} ineligible task(s) will be skipped.\n\n` +
    `Use this only after confirming the driver's local tasks are missing. ` +
    `If the original device still has the tasks, downloading again may duplicate fieldwork.`
  );
  if (!confirmed) return;

  try {
    for (let offset = 0; offset < eligible.length; offset += 450) {
      const batch = writeBatch(db);
      eligible.slice(offset, offset + 450).forEach(id => {
        batch.update(doc(db, "TASK", id), {
          status: "PENDING",
          workStatus: "fordownload",
          redownloadRequestedAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });
      });
      await batch.commit();
    }

    const localUpdatedAt = new Date().toISOString();
    const cacheUpdates = new Map();
    eligible.forEach(id => {
      if (TASK_MAP[id]) {
        TASK_MAP[id].status = "PENDING";
        TASK_MAP[id].workStatus = "fordownload";
        TASK_MAP[id].redownloadRequestedAt = localUpdatedAt;
        TASK_MAP[id].updatedAt = localUpdatedAt;
      }
      cacheUpdates.set(id, {
        status: "PENDING",
        workStatus: "fordownload",
        redownloadRequestedAt: localUpdatedAt,
        updatedAt: localUpdatedAt
      });
    });
    await updateTasksInAllCaches(cacheUpdates);

    SELECTED_IDS.clear();
    applyFilters();
    alert(
      `✅ ${eligible.length} task(s) returned to Task for Download.` +
      (skipped.length ? `\n\n${skipped.length} ineligible task(s) were skipped.` : "")
    );
  } catch (error) {
    console.error("Firestore redownload reset failed:", error);
    alert(`Failed to return tasks for download.\n\n${error?.code || error?.message || error}`);
  }
}

async function bulkDelete(ids) {

  if (!(await nscaConfirm(`Delete ${ids.length} tasks?`))) return;

  try {

    const batch = writeBatch(db);

    ids.forEach(id => {

      const taskRef = doc(db, "TASK", id);

      batch.update(taskRef, {
        deleted: true,
        deletedAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
    });

    await batch.commit();
    await removeTasksFromAllCaches(ids);

    // Remove from local UI
    ids.forEach(id => {
      delete TASK_MAP[id];
    });

    window.__TASKS_DATA__ =
      window.__TASKS_DATA__.filter(
        t => !ids.includes(t._key)
      );

    SELECTED_IDS.clear();

    applyFilters();

    alert(`✅ ${ids.length} tasks deleted.`);

  } catch (error) {

    console.error("❌ Firestore delete failed:", error);

    alert("❌ Failed to delete tasks.");

  }
}

async function bulkTransfer(ids) {

  const enteredDriver = await nscaPrompt("Enter NEW DRIVER ID:");

  if (!enteredDriver) return;

  const normalizedDriver = enteredDriver.trim().toLowerCase();
  let destinationDriver;

  try {
    const driversSnapshot = await getDocs(collection(db, "drivers"));
    const driverDoc = driversSnapshot.docs.find(driver => {
      const data = driver.data() || {};
      return String(data.driverCode || driver.id).trim().toLowerCase() === normalizedDriver;
    });

    if (driverDoc) {
      destinationDriver = {
        ...driverDoc.data(),
        driverCode: driverDoc.data().driverCode || driverDoc.id
      };
    }
  } catch (error) {
    console.error("Driver lookup failed:", error);
    alert("Unable to check the driver list. Check your connection and try again.");
    return;
  }

  if (!destinationDriver) {
    alert("Driver ID was not found. Add the driver in Manage Drivers first, then try again.");
    return;
  }

  const newDriver = String(destinationDriver.driverCode).trim();
  const newDriverName = String(destinationDriver.name || "").trim();

  if (!(await nscaConfirm(
    `Transfer ${ids.length} tasks to ${newDriver}` +
    `${newDriverName ? ` (${newDriverName})` : ""}?`
  ))) return;

  try {

    // Keep below Firestore's 500-write batch limit.
    const batchSize = 450;
    for (let offset = 0; offset < ids.length; offset += batchSize) {
      const batch = writeBatch(db);
      ids.slice(offset, offset + batchSize).forEach(id => {
        const task = TASK_MAP[id];
        const taskRef = doc(db, "TASK", id);
        batch.update(taskRef, {
          agentId: newDriver,
          driverId: newDriver,
          agentName: newDriverName,
          workStatus: "fordownload",
          lastTransferredFromAgentId: task?.agentId || "",
          lastTransferredFromAgentName: task?.agentName || "",
          transferredAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });
      });
      await batch.commit();
    }

    // Local update
    const localUpdatedAt = new Date().toISOString();
    const cacheUpdates = new Map();
    ids.forEach(id => {

      if (TASK_MAP[id]) {
        const oldDriver = TASK_MAP[id].agentId || "";
        const oldDriverName = TASK_MAP[id].agentName || "";
        TASK_MAP[id].agentId = newDriver;
        TASK_MAP[id].agentName = newDriverName;
        TASK_MAP[id].driverId = newDriver;
        TASK_MAP[id].workStatus = "fordownload";
        TASK_MAP[id].lastTransferredFromAgentId = oldDriver;
        TASK_MAP[id].lastTransferredFromAgentName = oldDriverName;
        TASK_MAP[id].transferredAt = localUpdatedAt;
        TASK_MAP[id].updatedAt = localUpdatedAt;

        cacheUpdates.set(id, {
          agentId: newDriver,
          agentName: newDriverName,
          driverId: newDriver,
          workStatus: "fordownload",
          lastTransferredFromAgentId: oldDriver,
          lastTransferredFromAgentName: oldDriverName,
          transferredAt: localUpdatedAt,
          updatedAt: localUpdatedAt
        });
      }
    });

    await updateTasksInAllCaches(cacheUpdates);

    // Rebuild indexes because transferred tasks belong under a new driver.
    window.__TASKS_BY_DRIVER__ = {};
    (window.__TASKS_DATA__ || []).forEach(task => {
      if (!task.agentId) return;
      if (!window.__TASKS_BY_DRIVER__[task.agentId]) {
        window.__TASKS_BY_DRIVER__[task.agentId] = [];
      }
      window.__TASKS_BY_DRIVER__[task.agentId].push(task);
    });
    buildFilterLists();

    SELECTED_IDS.clear();

    applyFilters();

    alert(`✅ ${ids.length} tasks transferred.`);

  } catch (error) {

    console.error("❌ Firestore transfer failed:", error);

    alert("❌ Failed to transfer tasks.");

  }
}


/* ===== BULK UPLOAD ===== */
const REQUIRED_HEADERS = [
  "JOBTYPE",
  "BA",
  "DMZ",
  "MRU",
  "SEQUENCE",
  "BG",
  "METERNUMBER",
  "ACCOUNTNUMBER",
  "CUSTOMERNAME",
  "ADDRESS",
  "ZIPCODE",
  "LATITUDE",
  "LONGITUDE",
  "AGENTID",
  "AGENTNAME"
];

function parseCoordinate(value) {
  const normalized = String(value ?? "").trim();

  if (!normalized || normalized.toUpperCase() === "#N/A") {
    return null;
  }

  const coordinate = Number(normalized);
  return Number.isFinite(coordinate) ? coordinate : null;
}

function appendTasksToLocalState(newTasks) {
  const existing = new Set(
    (window.__TASKS_DATA__ || []).map(t => t._key)
  );

  const unique = newTasks.filter(t => !existing.has(t._key));

  // 🔥 inject into main dataset
  window.__TASKS_DATA__.push(...unique);

  // 🔥 update TASK_MAP too (important for delete/transfer)
  unique.forEach(t => {
    TASK_MAP[t._key] = t;
  });

  // rebuild filters (so new drivers/jobtypes appear)
  window.__FILTER_BUILT__ = false;
  buildFilterLists();
  window.__FILTER_BUILT__ = true;

  applyFilters();
}

const csvFileInput = document.getElementById("csvFile");
const uploadStatus = document.getElementById("uploadStatus");
const uploadProgressTrack = document.getElementById("uploadProgressTrack");
const uploadProgressBar = document.getElementById("uploadProgressBar");

function updateUploadProgress(percent, message, color = "#007bff") {
  const safePercent = Math.max(0, Math.min(100, percent));
  uploadProgressTrack.style.display = "block";
  uploadProgressBar.style.width = `${safePercent}%`;
  uploadProgressBar.style.background = color;
  uploadStatus.textContent = message;
}

function finishUploadAttempt(btn) {
  btn.disabled = false;
  btn.innerText = "Upload CSV";
}

window.uploadCSV = async function(btn){
  const file = csvFileInput.files[0];

  if (!file) {
    showNscaMessage("❌ Please select a CSV file");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Uploading…";
  updateUploadProgress(0, `Reading ${file.name}...`);

  try {
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: async function(results) {

        try {

        const rows = results.data;

        if (!rows.length) {
          alert("❌ CSV has no data rows");
          updateUploadProgress(0, "Upload stopped: CSV has no data rows.", "#dc3545");
          finishUploadAttempt(btn);
          return;
        }

        /* ===== VALIDATE HEADERS ===== */
        const headers = Object.keys(rows[0] || {});
        const missing = REQUIRED_HEADERS.filter(h => !headers.includes(h));
        const extra = headers.filter(h => !REQUIRED_HEADERS.includes(h));

        if (missing.length) {
          alert("❌ Missing required columns:\n\n" + missing.join(", "));
          updateUploadProgress(0, "Upload stopped: required columns are missing.", "#dc3545");
          finishUploadAttempt(btn);
          return;
        }

        if (extra.length) {
          alert("❌ Extra columns not allowed:\n\n" + extra.join(", "));
          updateUploadProgress(0, "Upload stopped: unexpected columns were found.", "#dc3545");
          finishUploadAttempt(btn);
          return;
        }

        /* ===== BUILD UPDATES ===== */

        const base = Date.now();
        
        const now = new Date().toLocaleString("sv-SE", {
          timeZone: "Asia/Manila"
        }).replace(" ", "T");
        
        const assignedDate = now.slice(0, 10);
        
        // ==========================================
        // FIRESTORE BULK WRITE
        // Firestore maximum = 500 writes per batch
        // ==========================================
        
        // Smaller batches provide useful progress updates while staying
        // comfortably below Firestore's 500-write batch limit.
        const BATCH_SIZE = 100;

        updateUploadProgress(0, `Uploading 0 of ${rows.length} tasks...`);
        
        for (
          let start = 0;
          start < rows.length;
          start += BATCH_SIZE
        ) {
        
          const end = Math.min(
            start + BATCH_SIZE,
            rows.length
          );
        
          // NEW batch for every 500 tasks
          const batch = writeBatch(db);
        
          console.log(
            `Creating Firestore batch: ${start + 1}-${end}`
          );
        
          for (
            let index = start;
            index < end;
            index++
          ) {
        
            const task = rows[index];
        
            const taskId =
              `TASK_${base}_${index}`;
        
            const taskRef =
              doc(db, "TASK", taskId);
        
            const taskData = {
        
              taskId: taskId,
        
              jobType: task.JOBTYPE || "",
              ba: task.BA || "",
              dmz: task.DMZ || "",
              mru: task.MRU || "",
        
              sequence: task.SEQUENCE || "",
              bg: task.BG || "",
              meterNumber: task.METERNUMBER || "",
              accountNumber: task.ACCOUNTNUMBER || "",
        
              customerName: task.CUSTOMERNAME || "",
              address: task.ADDRESS || "",
              zipCode: task.ZIPCODE || "",
        
              latitude: parseCoordinate(task.LATITUDE),

              longitude: parseCoordinate(task.LONGITUDE),
        
              agentId: task.AGENTID || "",
              agentName: task.AGENTNAME || "",
        
              assignedDate: assignedDate,
        
              workStatus: "fordownload",
        
              rowIndex: index + 1,
        
              uploadBatch: base,
        
              createdAt: serverTimestamp(),
              updatedAt: serverTimestamp()
            };
        
            // Add task to the current batch
            batch.set(
              taskRef,
              taskData
            );
          }
        
          // Commit AFTER all tasks have been added
          console.log(
            `ABOUT TO COMMIT BATCH: ${start + 1}-${end}`
          );
        
          await batch.commit();

          const percent = Math.round((end / rows.length) * 100);
          updateUploadProgress(
            percent,
            `Uploaded ${end} of ${rows.length} tasks (${percent}%)`
          );
        
          console.log(
            `BATCH COMMITTED SUCCESSFULLY: ${start + 1}-${end}`
          );
        }

        

        // ✅ Build local task objects (NO DB READ)
        const newTasks = rows.map((task, index) => {

          const taskId = `TASK_${base}_${index}`;
        
          return {
            _key: taskId,
        
            taskId: taskId,
        
            jobType: task.JOBTYPE || "",
            ba: task.BA || "",
            dmz: task.DMZ || "",
            mru: task.MRU || "",
        
            sequence: task.SEQUENCE || "",
            bg: task.BG || "",
            meterNumber: task.METERNUMBER || "",
            accountNumber: task.ACCOUNTNUMBER || "",
        
            customerName: task.CUSTOMERNAME || "",
            address: task.ADDRESS || "",
            zipCode: task.ZIPCODE || "",
        
            latitude: parseCoordinate(task.LATITUDE),

            longitude: parseCoordinate(task.LONGITUDE),
        
            agentId: task.AGENTID || "",
            agentName: task.AGENTNAME || "",
        
            assignedDate: assignedDate,
        
            workStatus: "fordownload",
        
            rowIndex: index + 1,
        
            uploadBatch: base,
        
            createdAt: now,
            updatedAt: now
          };
        });
        
        // 🔁 Ensure filters include upload date
        filterDateFrom.value = now.slice(0, 10);
        filterDateTo.value   = now.slice(0, 10);

        // ✅ Inject directly into UI state
        appendTasksToLocalState(newTasks);
        
        updateUploadProgress(100, `Upload complete: ${rows.length} tasks added.`, "#28a745");
        csvFileInput.value = "";
        finishUploadAttempt(btn);
        showNscaMessage(`✅ Upload successful!\n\n${rows.length} tasks added.`);

        } catch (err) {
          console.error(err);
          updateUploadProgress(0, "Upload failed. Check the browser console for details.", "#dc3545");
          finishUploadAttempt(btn);
          alert("❌ Upload failed. Check console for details.");
        }
      },
      error: function(err) {
        console.error(err);
        updateUploadProgress(0, "Could not read the selected CSV file.", "#dc3545");
        finishUploadAttempt(btn);
        alert("❌ Could not read the selected CSV file.");
      }
    });

  } catch (err) {
    console.error(err);
    updateUploadProgress(0, "Upload failed. Check the browser console for details.", "#dc3545");
    alert("❌ Upload failed. Check console for details.");
    finishUploadAttempt(btn);
  }
};
