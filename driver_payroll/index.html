<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Driver payroll confirmation</title>
  <link rel="stylesheet" href="../pr/styles.css?v=20">
  <link rel="stylesheet" href="./confirmation.css?v=13">
</head>
<body class="employee-self-service">
  <header class="topbar"><div><div class="eyebrow">NSCA</div><h1 id="pageTitle">Driver task count confirmation</h1></div><a id="backLink" href="../admin.html">Back to admin dashboard</a></header>
  <main class="driver-confirmation">
    <p class="poc-note">Proof of concept · Use sample driver records.</p>
    <form id="cutoffForm" class="card controls">
      <div id="driverField" class="field"><label for="driver">Driver ID</label><input id="driver" maxlength="80" required></div>
      <div class="field"><label for="periodMonth">Payroll month</label><input id="periodMonth" type="month" required></div>
      <div class="field"><label for="periodHalf">Payroll period</label><select id="periodHalf">
        <option value="first">1st to 15th</option>
        <option value="second">16th to end of month</option>
      </select></div>
      <button class="primary">Open cutoff</button>
    </form>
    <p id="feedback" class="message" role="status" hidden></p>
    <section id="driverRoster" class="card driver-roster" aria-labelledby="rosterHeading" hidden>
      <div class="table-heading"><div><h2 id="rosterHeading">Drivers with completed tasks</h2><p id="rosterPeriod"></p></div><button id="approveReadyDrivers" class="primary" type="button" hidden>Approve all ready drivers</button></div>
      <div id="rosterFilters" class="roster-filters" role="group" aria-label="Filter drivers by status"></div>
      <p id="rosterResultCount" class="roster-result-count" role="status"></p>
      <ul id="rosterList"></ul>
    </section>
    <div id="result" hidden>
      <section class="summary confirmation-summary" aria-label="Confirmation status">
        <div class="summary-card completed-count"><span>Completed tasks in this period</span><strong id="taskCount"></strong></div>
        <div class="summary-card"><span>Driver</span><strong id="driverStatus"></strong></div>
        <div class="summary-card"><span>Task admin</span><strong id="adminStatus"></strong></div>
        <div class="summary-card"><span>Payroll</span><strong id="payrollStatus"></strong></div>
      </section>
      <section class="card confirmation-actions">
        <h2 id="reviewStatus"></h2>
        <p id="cutoffLabel"></p>
        <form id="sampleTaskForm" hidden>
          <div class="field"><label for="sampleTaskId">Sample task ID</label><input id="sampleTaskId" maxlength="80" required></div>
          <div class="field"><label for="sampleTaskDate">Completion date</label><input id="sampleTaskDate" type="date" required></div>
          <button type="submit">Add completed task</button>
        </form>
        <section class="task-calendar" aria-labelledby="taskCalendarHeading">
          <div class="task-calendar-heading"><h3 id="taskCalendarHeading">Completed tasks by day</h3></div>
          <div class="task-calendar-scroll" role="region" aria-label="Completed tasks calendar" tabindex="0">
            <div class="task-calendar-week" aria-hidden="true"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
            <div id="taskCalendar" class="task-calendar-grid"></div>
          </div>
        </section>
        <div id="dayConfirmation" class="day-confirmation" hidden>
          <p id="selectedDaySummary"></p>
          <p id="reviewNote" role="status" hidden></p>
          <div class="action-row">
            <button id="confirmDay" type="button" class="primary">Confirm day</button>
            <button id="flag" type="button">Report discrepancy for this day</button>
            <button id="resolveDiscrepancy" type="button" hidden>Resolve discrepancy</button>
          </div>
          <form id="adminResolutionForm" hidden>
            <div class="field"><label for="verifiedCount">Verified count</label><input id="verifiedCount" type="number" min="0" step="1" required></div>
            <div class="field"><label for="resolutionReason">Reason for the decision</label><textarea id="resolutionReason" maxlength="400" required></textarea></div>
            <button class="primary" type="submit">Save decision and return to driver</button>
          </form>
          <form id="disputeForm" hidden>
            <div class="field"><label for="reportedCount">Expected count</label><input id="reportedCount" type="number" min="0" step="1" required></div>
            <div class="field"><label for="reason">Reason</label><textarea id="reason" maxlength="400" required></textarea></div>
            <button type="submit">Send discrepancy</button>
          </form>
        </div>
        <div class="action-row">
          <button type="button" id="confirm" class="primary">Confirm task count</button>
        </div>
      </section>
      <details id="confirmationHistoryPanel" class="card confirmation-actions" hidden>
        <summary>Confirmation history</summary><ul id="confirmationHistory"></ul>
      </details>
    </div>
  </main>
  <script type="module" src="./confirmation.js?v=24"></script>
</body>
</html>
