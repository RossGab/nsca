<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Install Driver App</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#222222">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-top: 40px;
      margin-bottom: 24px;
    }
    
    .logo-wrap img {
      max-width: 160px;
      width: 60%;
      height: auto;
    }
    .box {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.15);
    }
    h1 {
      margin-bottom: 10px;
    }
    p {
      color: #555;
      font-size: 14px;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      border: none;
      background: #007bff;
      color: #fff;
    }
    button:disabled {
      background: #aaa;
    }
    .recovery-actions {
      display: none;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .recovery-actions button {
      flex: 1 1 120px;
      margin-top: 0;
      padding: 11px;
      font-size: 14px;
    }
    .secondary-button { background: #526579; }
    .repair-button { background: #b36b00; }
    #errorDetails {
      display: none;
      margin-top: 10px;
      color: #7a3d00;
      font-size: 12px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>

<div class="box">
  <div class="logo-wrap">
  <img src="./logo.jpg" alt="Company Logo">
</div>

<h1>Driver App</h1>
<p id="statusText">Install the app to continue</p>

<button id="installBtn" disabled>
  Waiting for install…
</button>
<div id="recoveryActions" class="recovery-actions">
  <button id="retryBtn" type="button">Retry</button>
  <button id="openBtn" type="button" class="secondary-button">Open Driver App Online</button>
  <button id="repairBtn" type="button" class="repair-button">Repair Offline Files</button>
</div>
<div id="errorDetails"></div>
</div>

<script>
let deferredPrompt = null;
const statusText = document.getElementById("statusText");
const installBtn = document.getElementById("installBtn");
const recoveryActions = document.getElementById("recoveryActions");
const retryBtn = document.getElementById("retryBtn");
const openBtn = document.getElementById("openBtn");
const repairBtn = document.getElementById("repairBtn");
const errorDetails = document.getElementById("errorDetails");
let installPromptTimer = null;
const PREPARE_ATTEMPTS = 3;
const PREPARE_TIMEOUT_MS = 15000;

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function withTimeout(promise, timeoutMs, message) {
  return Promise.race([
    promise,
    new Promise((_, reject) =>
      setTimeout(() => reject(new Error(message)), timeoutMs)
    )
  ]);
}

function hideRecoveryActions() {
  recoveryActions.style.display = "none";
  errorDetails.style.display = "none";
}

function describePreparationError(error) {
  const message = String(error?.message || error || "");
  const errorName = String(error?.name || "");

  if (errorName === "QuotaExceededError" || /quota|storage.*full/i.test(message)) {
    return "The browser does not have enough storage for the app's offline files. Existing tasks and captured photos were not deleted.";
  }
  if (!navigator.onLine || /network|fetch|offline|load/i.test(message)) {
    return "The required offline files could not be downloaded. Check the internet connection and retry.";
  }
  if (/timeout/i.test(message)) {
    return "Preparing the offline app took too long. Check the connection and retry.";
  }
  if (/security|not allowed|denied/i.test(message)) {
    return "This browser blocked offline app preparation. Open this page in Chrome and retry.";
  }
  return "The browser could not prepare the app's offline files.";
}

function showPreparationFailure(error) {
  statusText.innerText = describePreparationError(error);
  installBtn.style.display = "none";
  recoveryActions.style.display = "flex";
  errorDetails.style.display = "block";
  errorDetails.innerText =
    `Technical details: ${error?.name || "Error"}: ${error?.message || error || "Unknown error"}`;
}

function showManualInstallHelp() {
  if (deferredPrompt || isStandalone() || isIOS() || isInAppBrowser()) return;

  installBtn.disabled = false;
  installBtn.innerText = "Open Driver App";
  installBtn.onclick = () => location.href = "./driver.html";
  statusText.innerHTML = `
    The automatic install prompt is not available on this browser.<br><br>
    Open the browser menu and select <b>Install app</b> or
    <b>Add to Home screen</b>.<br><br>
    If that option is missing, update Chrome and reload this page.
  `;
}

async function preparePWA() {
  if (!("serviceWorker" in navigator)) {
    statusText.innerText = "PWA installation is not supported. Please use Chrome, Edge, or Safari.";
    installBtn.style.display = "none";
    recoveryActions.style.display = "flex";
    retryBtn.style.display = "none";
    repairBtn.style.display = "none";
    return;
  }

  hideRecoveryActions();
  retryBtn.style.display = "block";
  repairBtn.style.display = "block";
  retryBtn.disabled = false;
  repairBtn.disabled = false;
  installBtn.style.display = "block";
  installBtn.disabled = true;
  installBtn.innerText = "Preparing offline app...";

  let lastError;
  for (let attempt = 1; attempt <= PREPARE_ATTEMPTS; attempt++) {
    try {
      statusText.innerText = attempt === 1
        ? "Preparing the app for offline use..."
        : `Preparation failed. Retrying (${attempt}/${PREPARE_ATTEMPTS})...`;

      const registration = await withTimeout(
        navigator.serviceWorker.register("./sw.js", { scope: "./" }),
        PREPARE_TIMEOUT_MS,
        "Service worker registration timed out"
      );
      await withTimeout(
        registration.update(),
        PREPARE_TIMEOUT_MS,
        "Offline file update timed out"
      );
      await withTimeout(
        navigator.serviceWorker.ready,
        PREPARE_TIMEOUT_MS,
        "Offline app activation timed out"
      );

      statusText.innerText = "Offline app files are ready.";
      installPromptTimer = setTimeout(showManualInstallHelp, 3000);
      return;
    } catch (error) {
      lastError = error;
      console.warn(
        `Driver PWA preparation attempt ${attempt} of ${PREPARE_ATTEMPTS} failed:`,
        error
      );
      if (attempt < PREPARE_ATTEMPTS) await wait(1000);
    }
  }

  console.error("Driver PWA preparation failed:", lastError);
  showPreparationFailure(lastError);
}

retryBtn.onclick = () => preparePWA();
openBtn.onclick = () => location.href = "./driver.html";
repairBtn.onclick = async () => {
  repairBtn.disabled = true;
  retryBtn.disabled = true;
  statusText.innerText = "Repairing offline app files...";
  errorDetails.style.display = "none";

  try {
    const cacheNames = await caches.keys();
    await Promise.all(
      cacheNames
        .filter(name => name.startsWith("field-task-app-"))
        .map(name => caches.delete(name))
    );

    const appScope = new URL("./", location.href).href;
    const registrations = await navigator.serviceWorker.getRegistrations();
    await Promise.all(
      registrations
        .filter(registration => registration.scope === appScope)
        .map(registration => registration.unregister())
    );

    await preparePWA();
  } catch (error) {
    console.error("Offline app repair failed:", error);
    showPreparationFailure(error);
  } finally {
    repairBtn.disabled = false;
    retryBtn.disabled = false;
  }
};

function isStandalone() {
  return window.matchMedia("(display-mode: standalone)").matches ||
         window.navigator.standalone === true;
}

function isIOS() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}

function isInAppBrowser() {
  return /FBAN|FBAV|Instagram|Messenger/i.test(navigator.userAgent);
}

// ✅ Already installed
if (isStandalone()) {
  statusText.innerText = "✅ App already installed. Open it from your app list.";
  installBtn.style.display = "none";
}

// 📱 iOS manual install
else if (isIOS()) {
  statusText.innerHTML = `
    📱 To install on iPhone / iPad:<br><br>
    1️⃣ Open this page in <b>Safari</b><br>
    2️⃣ Tap <b>Share ⬆️</b><br>
    3️⃣ Tap <b>Add to Home Screen</b>
  `;
  installBtn.style.display = "none";
}

// 🚫 In-app browsers (Messenger, FB, IG)
else if (isInAppBrowser()) {
  statusText.innerHTML = `
    ⚠️ Installation not available here.<br><br>
    Please open this link in <b>Chrome</b> to install the app.
  `;
  installBtn.style.display = "none";
}

// ✅ Android Chrome install
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  clearTimeout(installPromptTimer);

  installBtn.disabled = false;
  installBtn.innerText = "📲 Install Driver App";
});

installBtn.onclick = async () => {
  if (!deferredPrompt) return;

  installBtn.disabled = true;
  installBtn.innerText = "Installing…";

  await deferredPrompt.prompt();
  await deferredPrompt.userChoice;

  deferredPrompt = null;
};

window.addEventListener("appinstalled", () => {
  clearTimeout(installPromptTimer);
  installBtn.style.display = "none";
  hideRecoveryActions();
  statusText.innerText =
    "✅ App installed! Open it from your home screen.";
});

if (!isStandalone() && !isIOS() && !isInAppBrowser()) {
  preparePWA();
}
</script>
</body>
</html>
