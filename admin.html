window.DRIVER_UI_CONFIG = {};

function getTodayPH() {
  return new Date().toLocaleDateString("en-CA", {
    timeZone: "Asia/Manila"
  });

let FILTERED_TASK_IDS = [];

const dateFromInput = document.getElementById("adminDateFrom");
const dateToInput = document.getElementById("adminDateTo");

dateFromInput.value = DATE_FROM;
dateToInput.value = DATE_TO;

async function onDateRangeChange() {

  const newFrom = dateFromInput.value;
  const newTo = dateToInput.value;

  if (!newFrom || !newTo) return;

  const keys = getDateRangeKeys(newFrom, newTo);

  // ✅ VALIDATE EARLY (THIS IS THE FIX)
  if (keys.length > 180) {
    alert("Max 180 days range only");

    // 🔥 revert UI (DO NOT CHANGE STATE)
    dateFromInput.value = DATE_FROM;
    dateToInput.value = DATE_TO;

    return;
  }

  // ✅ ONLY NOW update state
  DATE_FROM = newFrom;
  DATE_TO = newTo;

  window.__FIRESTORE_TASKS__ = null;

  showLoader("Loading date range…");

  try {

  await loadTasks(
    CURRENT_STATUS || "PENDING"
  );

  // ==========================================
  // 🗺 LIVE MAP DATE CHANGE
  // ==========================================

  if (MAP_VISIBLE) {

    buildTaskStatsFromFirestore();

    buildDriverBAMapFromFirestore();

    buildMapAssignedDriverIds();

    buildLiveMapBAFilters();

    refreshMap();
  }

} finally {

  hideLoader();
}
}

dateFromInput.addEventListener("change", onDateRangeChange);
dateToInput.addEventListener("change", onDateRangeChange);


async function loadDriverUIConfig() {
  try {

    const snapshot =
      await get(
        ref(rtdb, "config/driverUI")
      );

    const data =
      snapshot.exists()
        ? snapshot.val()
        : {};

    // Support:
    // { jobTypes: {...} }
    // or directly { NOD: {...}, ... }

    window.DRIVER_UI_CONFIG =
      data.jobTypes ||
      data ||
      {};

    console.log(
      "🔥 Driver UI config loaded from Realtime Database:",
      window.DRIVER_UI_CONFIG
    );

  } catch (e) {

    console.error(
      "❌ Failed to load driver UI config from Realtime Database:",
      e
    );

    window.DRIVER_UI_CONFIG = {};
  }
}

function showLoader(text = "Loading…") {
  const el = document.getElementById("loadingScreen");
  if (!el) return;
  setLoaderText(text);
  el.classList.remove("hide");

}

function reloadAllAdminViews() {

  refreshDashboard();

  if (MAP_VISIBLE) {

    // Recalculate drivers assigned

    buildTaskStatsFromFirestore();

    buildDriverBAMapFromFirestore();

    buildLiveMapBAFilters();

    refreshMap();

  } else if (CURRENT_STATUS) {

    loadTasks(CURRENT_STATUS);
  }
}

function normalizeDate(dateStr) {
  if (!dateStr) return null;

  const d = new Date(dateStr);

  if (isNaN(d.getTime())) return null;

  return d.toLocaleDateString("en-CA", {
    timeZone: "Asia/Manila"
  });
}

function renderAdminPagination() {
  const el = document.getElementById("adminPagination");
  if (!el) return;

  // ❌ DO NOT show pagination in Live Map
  if (MAP_VISIBLE) {
    el.innerHTML = "";
    return;
  }

  const totalPages = Math.max(
    1,
    Math.ceil(FILTERED_TASK_IDS.length / ADMIN_PAGE_SIZE)
  );

  el.innerHTML = `
    <button ${ADMIN_CURRENT_PAGE === 0 ? "disabled" : ""}
      onclick="adminPrevPage()">⬅ Prev</button>

    <span style="margin:0 10px;">
      Page ${ADMIN_CURRENT_PAGE + 1} of ${totalPages}
      (${FILTERED_TASK_IDS.length} tasks)
    </span>

    <button ${ADMIN_CURRENT_PAGE >= totalPages - 1 ? "disabled" : ""}
      onclick="adminNextPage()">Next ➡</button>
  `;
}

window.adminPrevPage = function () {
  if (ADMIN_CURRENT_PAGE > 0) {
    ADMIN_CURRENT_PAGE--;
    loadAdminPageFromFirestore(CURRENT_STATUS);
  }
};

window.adminNextPage = function () {
  const totalPages = Math.ceil(FILTERED_TASK_IDS.length / ADMIN_PAGE_SIZE);
  if (ADMIN_CURRENT_PAGE < totalPages - 1) {
    ADMIN_CURRENT_PAGE++;
    loadAdminPageFromFirestore(CURRENT_STATUS);
  }
};

function buildLiveMapBAFilters() {
  const box = document.getElementById("mapBACheckboxes");
  box.innerHTML = "";

  const allBAs = new Set();

  Object.values(DRIVER_BA_MAP).forEach(baList => {
    baList.forEach(ba => allBAs.add(ba));
  });

  [...allBAs].sort().forEach(ba => {
    const label = document.createElement("label");
    label.style.cssText = `
      font-size:13px;
      display:flex;
      align-items:center;
      gap:6px;
      padding:4px 6px;
      border-radius:4px;
      cursor:pointer;
      background:#f5f5f5;
    `;

    label.innerHTML = `
      <input type="checkbox" value="${ba}">
      <span>${ba}</span>
    `;

    const input = label.querySelector("input");
    input.checked = FILTER_BA.has(ba);

    input.onchange = () => {
      if (input.checked) FILTER_BA.add(ba);
      else FILTER_BA.delete(ba);

      refreshMap();        // 🔥 refresh markers
    };

    box.appendChild(label);
  });
}

function driverMatchesBA(driverId) {
  // No BA filter → show all drivers
  if (!FILTER_BA.size) return true;

  const baSet = DRIVER_BA_MAP[driverId];
  if (!baSet) return false;

  // Match if ANY BA overlaps
  for (const ba of baSet) {
    if (FILTER_BA.has(ba)) return true;
  }

  return false;
}

function hideLoader() {
  const el = document.getElementById("loadingScreen");
  if (!el || el.classList.contains("hide")) return;
  el.classList.add("hide");
  setTimeout(() => {
    el.style.display = "none";
  }, 400);
}

function withTimeout(promise, ms = 8000) {
  return Promise.race([
    promise,
    new Promise((_, reject) =>
      setTimeout(() => reject(new Error("Timeout")), ms)
    )
  ]);
}

const rtdb = getDatabase(app);

const auth = getAuth(app);

// if your Firestore schema uses different names.
const TASK_COLLECTION = "TASK";

let SEARCH_TERM = "";

let SHOW_ONLINE_ONLY = false;

/* ===== SEARCH ===== */
searchBox.addEventListener("input", e => {

 function renderGlobalBAFilters() {

/* ===== SLA ===== */
function getSLA(task) {
  if (!task.createdAt || task.status === "COMPLETED") return null;
  const hrs = (Date.now() - new Date(task.createdAt)) / 36e5;
  if (hrs < 24) return { text:"Within SLA", cls:"sla-ok" };
  if (hrs < 48) return { text:"At Risk", cls:"sla-warn" };
  return { text:"SLA Breached", cls:"sla-breach" };
}

async function loadDriverSnapshot() {
  try {
    const snap = await getDocs(collection(db, DRIVER_COLLECTION));
    const data = {};

    snap.forEach(docSnap => {
      const d = docSnap.data() || {};
      const id = docSnap.id;
      data[id] = {
        ...d,
        name: d.name || d.AGENTNAME || d.agentName || "",
        contact: d.contact || d.phone || d.mobile || ""
      };
    });

    DRIVER_CACHE = data;
    console.log(`☁ Firestore drivers loaded: ${Object.keys(data).length}`);
  } catch (e) {
    console.error("❌ Failed to load drivers from Firestore:", e);
    DRIVER_CACHE = {};
  }
}

  btn.className = "snapshot-btn data-fresh";

}

    return;
  }

  let open = 0, done = 0;
  let ok = 0, warn = 0, breach = 0;

  window.__FIRESTORE_TASKS__.forEach(t => {
    if (t.status === "COMPLETED") {
      done++;
    } else {
      open++;

      if (!t.createdAt) return;
      const hrs = (Date.now() - new Date(t.createdAt)) / 36e5;
      if (hrs < 24) ok++;
      else if (hrs < 48) warn++;
      else breach++;
    }
  });

  openCount.innerText = open;
  doneCount.innerText = done;
  slaOk.innerText = ok;
  slaWarn.innerText = warn;
  slaBreach.innerText = breach;
};

function formatFirestoreDate(value) {

  if (!value) {
    return "";
  }

  try {

    // Firestore Timestamp
    if (
      typeof value === "object" &&
      typeof value.toDate === "function"
    ) {
      return value
        .toDate()
        .toLocaleString("en-PH", {
          timeZone: "Asia/Manila"
        });
    }

    // JS Date
    if (value instanceof Date) {
      return value.toLocaleString(
        "en-PH",
        {
          timeZone: "Asia/Manila"
        }
      );
    }

    // ISO/string timestamp
    return new Date(value)
      .toLocaleString(
        "en-PH",
        {
          timeZone: "Asia/Manila"
        }
      );

  } catch (e) {

    console.warn(
      "⚠️ Unable to format date:",
      value
    );

    return String(value);
  }
}

function firestoreDateMillis(value) {
  if (!value) return 0;

  try {
    if (typeof value.toMillis === "function") {
      return value.toMillis();
    }
    if (typeof value.toDate === "function") {
      return value.toDate().getTime();
    }
    if (typeof value.seconds === "number") {
      return (value.seconds * 1000) +
        Math.floor((value.nanoseconds || 0) / 1000000);
    }

    const millis = value instanceof Date
      ? value.getTime()
      : new Date(value).getTime();

    return Number.isFinite(millis) ? millis : 0;
  } catch {
    return 0;
  }
}

function completedTaskMillis(task) {
  return firestoreDateMillis(
    task.completedAt ||
    task.uploadedAt ||
    task.updatedAt ||
    task.createdAt
  );
}

function renderDynamicCompletedFields(t) {

    ];

  }


  console.log(

        t.JOBTYPE,

      deliveryType:
        t.deliveryType,

      fieldOrder:
        cfg._order,

      fields:

      deliverytype_2nd:

    >

      <b>
        DELIVERY DETAILS
      </b>
  `;


  // ==========================================
  // ESCAPE HTML
  // ==========================================

  function escapeHtml(
    value
  ) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }


    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  // ==========================================
  // NORMAL FIELD
  // ==========================================

  function renderField(
    fieldKey,
    field,
    value
  ) {

    if (!field) {
      return "";
    }


    const label =
      field.label ||
      fieldKey;


    const safeValue =
      escapeHtml(
        value
      );


    if (
      field.type ===
      "textarea"
    ) {

      return `

        <label class="full">
          ${escapeHtml(label)}
        </label>

        <textarea
          class="full"
          disabled
        >${safeValue}</textarea>

      `;

    }


    return `

      <label class="full">
        ${escapeHtml(label)}
      </label>

      <input
        class="full"
        value="${safeValue}"
        disabled
      >

    `;

  }


  // ==========================================
  // 1. NORMAL FIELDS
  // ==========================================

  for (
    const fieldKey of
      cfg._order
  ) {

    const field =
      cfg.fields[
        fieldKey
      ];


    if (!field) {
      continue;
    }


    /*
     * Do NOT render radio fields here.
     *
     * We will render the selected radio
     * separately below.
     */

    if (
      field.type === "radio"
    ) {

      continue;

    }


    html +=
      renderField(
        fieldKey,
        field,
        t[fieldKey]
      );

  }


  // ==========================================
  // 2. SELECTED RADIO / STATUS
  // ==========================================

  const selectedKey =
    String(
      t.deliverytype_2nd ||
      ""
    ).trim();


  console.log(
    "🔘 SELECTED DELIVERY STATUS:",
    selectedKey
  );


  if (
    selectedKey
  ) {

    /*
     * DIRECTLY FIND THE RADIO FIELD
     *
     * Example:
     *
     * selectedKey =
     * "c100_disconnected"
     *
     * cfg.fields[
     *   "c100_disconnected"
     * ]
     */

    const selectedRadio =
      cfg.fields[
        selectedKey
      ];


    console.log(
      "🔘 SELECTED RADIO CONFIG:",
      selectedRadio
    );


    if (
      selectedRadio &&
      selectedRadio.type ===
        "radio"
    ) {

      // ======================================
      // RADIO LABEL
      // ======================================

      html += `

        <label class="full">
          ${escapeHtml(
            selectedRadio.label ||
            selectedKey
          )}
        </label>

      `;


      // ======================================
      // CHILD FIELDS
      // ======================================

      const childOrder =
        selectedRadio.fields?._order ||
        [];


      console.log(
        "🔽 RADIO CHILD ORDER:",
        childOrder
      );


      for (
        const childKey of
          childOrder
      ) {

        const childField =
          selectedRadio.fields
            ?.options?.[
              childKey
            ];


        if (!childField) {

          console.warn(
            "⚠️ CHILD CONFIG NOT FOUND:",
            childKey
          );

          continue;

        }


        const childValue =
          t[childKey] ??
          "";


        console.log(
          "↳ CHILD:",
          {
            key:
              childKey,

            label:
              childField.label,

            value:
              childValue,

            type:
              childField.type,

            required:
              childField.required
          }
        );


        html +=
          renderField(
            childKey,

            childField,

            childValue
          );

      }

    } else {

      console.warn(
        "⚠️ Selected status is not a radio field:",
        {
          selectedKey,
          availableFields:
            Object.keys(
              cfg.fields
            )
        }
      );

    }

  }


  // ==========================================
  // 3. COMPLETION METADATA
  // ==========================================

  html += `

    <label class="full">
      Completed By
    </label>

    <input
      class="full"
      value="${escapeHtml(
        t.completedBy ||
        ""
      )}"
      disabled
    >


    <label class="full">
      Completed At
    </label>

    <input
      class="full"
      value="${escapeHtml(
        formatFirestoreDate(
          t.completedAt
        )
      )}"
      disabled
    >

  `;


  html += `
    </div>
  `;


  return html;

}

function initLazyPhotos() {
  const images = document.querySelectorAll(".lazy-photo");

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;

      const img = entry.target;
      const realSrc = img.dataset.src;

      if (realSrc) {
        img.src = realSrc;
        img.removeAttribute("data-src");
      }

      observer.unobserve(img);
    });
  }, {
    rootMargin: "100px"
  });

  images.forEach(img => observer.observe(img));
}

window.revertToPending = async function (taskKey) {
  if (!confirm("Reset task and send back to pending?")) return;

  showLoader("Resetting task…");

  try {
    const snap = await getDoc(doc(db, TASK_COLLECTION, taskKey));
    if (!snap.exists()) {
      alert("Task not found");
      return;
    }

    const original = snap.data();

    // 1️⃣ Fields to CLEAR (completion-only data)
    const RESET_FIELDS = [
      "deliveryType",
      "result",
      "remarks",
      "finalized"
    ];

    // Also clear any dynamic form fields
    Object.keys(original).forEach(k => {
      if (
        k.startsWith("photo") === false &&
        k !== "createdAt" &&
        k !== "driverId" &&
        k !== "JOBTYPE" &&
        k !== "BA" &&
        k !== "DMZ" &&
        k !== "MRU" &&
        k !== "SEQUENCE" &&
        k !== "METERNUMBER" &&
        k !== "ACCOUNTNUMBER" &&
        k !== "CUSTOMERNAME" &&
        k !== "ADDRESS" &&
        k !== "ZIPCODE" &&
        k !== "LATITUDE" &&
        k !== "LONGITUDE" &&
        k !== "AGENTID" &&
        k !== "AGENTNAME" &&
        k !== "rowIndex" &&
        k !== "status"
      ) {
        RESET_FIELDS.push(k);
      }
    });

    const updates = {};

    RESET_FIELDS.forEach(k => {
      updates[k] = null;
    });

    // 2️⃣ Force safe pending state
    Object.assign(updates, {
      status: "PENDING",
      finalized: false,
      forceReopen: true,
      reopenedAt: new Date().toISOString()
    });

    // 3️⃣ Apply LIGHT update
    await updateDoc(doc(db, TASK_COLLECTION, taskKey), updates);

    // 4️⃣ Update local cache
    const cached = getCachedTasks() || [];
    const idx = cached.findIndex(t => t._key === taskKey);

    if (idx !== -1) {
      cached[idx] = {
        ...cached[idx],
        ...updates
      };
      setCachedTasks(cached);
    }

    alert("✅ Task reset to pending");

    refreshDashboard();
    loadTasks("PENDING");

  } catch (err) {
    console.error(err);
    alert("Failed to reset task");
  } finally {
    hideLoader();
  }
};

function getDateRangeKeys(from, to) {
  const keys = [];

  const d1 = new Date(from);
  const d2 = new Date(to);

  for (let d = new Date(d1); d <= d2; d.setDate(d.getDate() + 1)) {
    const key = d.toLocaleDateString("en-CA", {
      timeZone: "Asia/Manila"
    }).replace(/-/g, "");

    keys.push(key);
  }

  return keys;
}
  
window.loadTasks = async function (status) {
  CURRENT_STATUS = status;
  taskList.innerHTML = "Loading...";

  showLoader("Loading Firestore…");

  const keys = getDateRangeKeys(DATE_FROM, DATE_TO);
  let firestoreTasks = [];

  try {
    for (let i = 0; i < keys.length; i++) {
      const dateKey = keys[i];
      const firestoreDate =
        `${dateKey.slice(0, 4)}-${dateKey.slice(4, 6)}-${dateKey.slice(6, 8)}`;

      const q = query(
        collection(db, TASK_COLLECTION),
        where("assignedDate", "==", firestoreDate),
        orderBy("createdAt")
      );

      const snap = await getDocs(q);

      snap.forEach(docSnap => {
        const raw = docSnap.data() || {};

        // Normalize the Firestore task schema to the fields used by this UI.
        const task = {
          _key: docSnap.id,
          ...raw,
          driverId: raw.driverId ?? raw.agentId ?? "",
          JOBTYPE: raw.JOBTYPE ?? raw.jobType ?? "",
          BA: raw.BA ?? raw.ba ?? "",
          DMZ: raw.DMZ ?? raw.dmz ?? "",
          MRU: raw.MRU ?? raw.mru ?? "",
          SEQUENCE: raw.SEQUENCE ?? raw.sequence ?? "",
          METERNUMBER: raw.METERNUMBER ?? raw.meterNumber ?? "",
          ACCOUNTNUMBER: raw.ACCOUNTNUMBER ?? raw.accountNumber ?? "",
          CUSTOMERNAME: raw.CUSTOMERNAME ?? raw.customerName ?? "",
          ADDRESS: raw.ADDRESS ?? raw.address ?? "",
          ZIPCODE: raw.ZIPCODE ?? raw.zipCode ?? "",
          LATITUDE: raw.LATITUDE ?? raw.latitude ?? null,
          LONGITUDE: raw.LONGITUDE ?? raw.longitude ?? null,
          deliveryType: raw.deliveryType ?? "",
          status: raw.status ?? (
            String(raw.workStatus || "").toUpperCase() === "COMPLETED"
              ? "COMPLETED"
              : "PENDING"
          )
        };

        firestoreTasks.push(task);
      });

      const progress = ((i + 1) / keys.length) * 100;
      setLoaderText(`Firestore: ${i + 1}/${keys.length} date(s)`);
    }

    window.__FIRESTORE_TASKS__ = firestoreTasks;

    ADMIN_TASK_IDS = firestoreTasks.map(t => t._key);
    FILTERED_TASK_IDS = [...ADMIN_TASK_IDS];
    ADMIN_CURRENT_PAGE = 0;

    ALL_BA_FOR_DATE.clear();
    firestoreTasks.forEach(t => {
      if (t.BA) ALL_BA_FOR_DATE.add(t.BA);
    });

    renderGlobalBAFilters();

    updateDataSourceStatus("☁ Firestore");
    refreshDashboard();

    await loadAdminPageFromFirestore(status);
  } catch (e) {
    console.error("❌ Firestore task load failed:", e);
    window.__FIRESTORE_TASKS__ = [];
    taskList.innerHTML = `
      <div style="padding:12px;background:#fff;border-radius:8px;color:#b00020;">
        ❌ Failed to load tasks from Firestore.
      </div>
    `;
  } finally {
    hideLoader();
  }
};

async function loadAdminPageFromFirestore(status) {
  if (!window.__FIRESTORE_TASKS__) return;

  let tasks = window.__FIRESTORE_TASKS__.filter(t =>
    status === "COMPLETED"
      ? t.status === "COMPLETED"
      : t.status !== "COMPLETED"
  );

  if (FILTER_DRIVER) {
    tasks = tasks.filter(t => t.driverId === FILTER_DRIVER);
  }

  if (SEARCH_TERM) {
    tasks = tasks.filter(t =>
      Object.values(t).some(v =>
        String(v || "").toLowerCase().includes(SEARCH_TERM)
      )
    );
  }

  if (FILTER_BA.size) {
    tasks = tasks.filter(t => FILTER_BA.has(t.BA));
  }

  if (status === "COMPLETED") {
    tasks.sort((a, b) => {
      const timeDifference = completedTaskMillis(b) - completedTaskMillis(a);
      if (timeDifference !== 0) return timeDifference;
      return String(b._key || "").localeCompare(String(a._key || ""));
    });
  }

  FILTERED_TASK_IDS = tasks.map(t => t._key);

  const start = ADMIN_CURRENT_PAGE * ADMIN_PAGE_SIZE;
  const pageTasks = tasks.slice(start, start + ADMIN_PAGE_SIZE);

  renderAdminTasks(pageTasks);
  renderAdminPagination();
}

  window.loadTaskPhotos = async function(taskId, btn) {

  if (!btn) return;

  if (btn.dataset.loaded === "1") {
    return;
  }

  btn.dataset.loaded = "1";
  btn.disabled = true;
  btn.innerText = "Loading photos…";

  try {

    console.log(
      "📸 Loading photos for task:",
      taskId
    );

    // ==========================================
    // 1. GET TASK FROM FIRESTORE
    // ==========================================

    const snap = await getDoc(
      doc(
        db,
        TASK_COLLECTION,
        taskId
      )
    );

    if (!snap.exists()) {

      console.warn(
        "⚠️ Task not found:",
        taskId
      );

      btn.innerText = "No task";
      return;
    }

    // 🔥 FIRESTORE → data()
    const t = snap.data();

    console.log(
      "📸 Firestore task photo data:",
      {
        taskId,
        photo1Url: !!t.photo1Url,
        photo2Url: !!t.photo2Url,
        photo3Url: !!t.photo3Url
      }
    );

    // ==========================================
    // 2. CREATE PHOTO CONTAINER
    // ==========================================

    const photoContainer =
      document.createElement("div");

    photoContainer.style.cssText = `
      display:grid;
      grid-template-columns:repeat(
        auto-fill,
        minmax(140px, 1fr)
      );
      gap:10px;
      margin-top:10px;
    `;

    let hasPhoto = false;

    // ==========================================
    // 3. RENDER ALL AVAILABLE PHOTOS
    // ==========================================

    for (const i of [1, 2, 3]) {

      const url =
        t[`photo${i}Url`];

      if (
        !url ||
        typeof url !== "string"
      ) {
        continue;
      }

      hasPhoto = true;

      // -------------------------------
      // Photo wrapper
      // -------------------------------

      const wrapper =
        document.createElement("div");

      wrapper.style.cssText = `
        position:relative;
        border:2px solid #28a745;
        border-radius:8px;
        overflow:hidden;
        background:#f5f5f5;
      `;

      // -------------------------------
      // Image
      // -------------------------------

      const img =
        document.createElement("img");

      img.src = url;

      img.alt =
        `Task ${taskId} Photo ${i}`;

      img.loading = "lazy";

      img.style.cssText = `
        display:block;
        width:100%;
        aspect-ratio:1/1;
        object-fit:cover;
        cursor:pointer;
      `;

      // -------------------------------
      // Photo label
      // -------------------------------

      const label =
        document.createElement("div");

      label.innerText =
        `Photo ${i}`;

      label.style.cssText = `
        padding:5px;
        text-align:center;
        font-size:12px;
        font-weight:bold;
        background:#fff;
      `;

      // -------------------------------
      // Open full image
      // -------------------------------

      img.onclick = () => {

        window.open(
          url,
          "_blank",
          "noopener,noreferrer"
        );

      };

      // -------------------------------
      // Image error
      // -------------------------------

      img.onerror = () => {

        console.error(
          `❌ Photo ${i} failed to load:`,
          url
        );

        img.style.display =
          "none";

        const error =
          document.createElement("div");

        error.innerText =
          `❌ Photo ${i} unavailable`;

        error.style.cssText = `
          padding:20px 5px;
          text-align:center;
          color:#b00020;
          font-size:12px;
        `;

        wrapper.insertBefore(
          error,
          label
        );
      };

      wrapper.appendChild(img);
      wrapper.appendChild(label);

      photoContainer.appendChild(
        wrapper
      );
    }

    // ==========================================
    // 4. NO PHOTOS
    // ==========================================

    if (!hasPhoto) {

      btn.innerText =
        "No photos";

      btn.dataset.loaded =
        "0";

      return;
    }

    // ==========================================
    // 5. INSERT AFTER BUTTON
    // ==========================================

    btn.insertAdjacentElement(
      "afterend",
      photoContainer
    );

    btn.innerText =
      "Photos Loaded";

    console.log(
      "✅ Photos loaded:",
      taskId
    );

  } catch (error) {

    console.error(
      "❌ Failed to load task photos:",
      error
    );

    // Allow user to try again
    btn.dataset.loaded =
      "0";

    btn.disabled =
      false;

    btn.innerText =
      "📸 Load Photos";

  }
};

  window.saveEdit = async function (btn) {
  const details = btn.closest(".task-details");
  const taskId = details.dataset.taskId;

  showLoader("Saving changes…");

  try {
    // 1️⃣ Read original task (source of truth)
    const snap = await getDoc(doc(db, TASK_COLLECTION, taskId));
    if (!snap.exists()) {
      alert("Task not found");
      return;
    }

    const original = snap.data();

    // 2️⃣ Allowlist editable fields
    const EDITABLE_FIELDS = [
      "driverId",
      "JOBTYPE",
      "BA",
      "DMZ",
      "MRU",
      "SEQUENCE",
      "METERNUMBER",
      "ACCOUNTNUMBER",
      "CUSTOMERNAME",
      "ADDRESS",
      "ZIPCODE",
      "LATITUDE",
      "LONGITUDE",
      "deliveryType"
    ];

    const fields = details.querySelectorAll("input, textarea, select");
    const payload = {};

    fields.forEach(el => {
      const key = el.dataset.field;
      if (!EDITABLE_FIELDS.includes(key)) return;

      payload[key] = el.value;
      el.disabled = true;
    });

    // 3️⃣ Preserve critical fields (ABSOLUTE)
    payload.createdAt = original.createdAt;
    payload.status = original.status;
    payload.finalized = original.finalized || false;

    // 4️⃣ Handle agent name safely
    if (payload.driverId && DRIVER_CACHE[payload.driverId]) {
      payload.AGENTID = payload.driverId;
      payload.AGENTNAME = DRIVER_CACHE[payload.driverId].name || "";
    } else {
      payload.AGENTID = "";
      payload.AGENTNAME = "";
    }

    // 5️⃣ Update Firebase (light write)
    await updateDoc(doc(db, TASK_COLLECTION, taskId), { ...payload, updatedAt: serverTimestamp() });

    alert("✅ Task updated");

    // 7️⃣ Restore UI
    details.querySelector(".form-actions").innerHTML = `
      <button class="toggleBtn" onclick="enableEdit(this)">
        ✏ Modify Task
      </button>
    `;

    refreshDashboard();
    loadTasks(CURRENT_STATUS);

  } catch (err) {
    console.error(err);
    alert("Failed to save task");
  } finally {
    hideLoader();
  }
};

    MAP_VISIBLE
      ? "none"
      : "block";

  // ==========================================
  // MAP CLOSED
  // ==========================================

  if (!MAP_VISIBLE) {

    // Stop listening to driver GPS updates
    if (DRIVER_STATUS_UNSUBSCRIBE) {

      DRIVER_STATUS_UNSUBSCRIBE();

      DRIVER_STATUS_UNSUBSCRIBE =
        null;
    }

    return;

  // ==========================================

  setTimeout(() => {

    map.invalidateSize();

  }, 200);

  buildTaskStatsFromFirestore();
  
  buildDriverBAMapFromFirestore();
  
  // 🗺 Determine which drivers have tasks

  buildLiveMapBAFilters();

function initMap() {

  if (map) return;

  map = L.map("map")
    .setView(
      [14.5995, 120.9842],
      11
    );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
  ).addTo(map);
}
  
function getDriverStatus(lastSeen) {
  if (!lastSeen) return { label: "Unknown", color: "gray" };

  const diff = Date.now() - new Date(lastSeen).getTime();

  if (diff < 60000) return { label: "Active", color: "green" };
  if (diff < 120000) return { label: "Idle", color: "orange" };
  return { label: "Offline", color: "red" };
}

function log(msg) {
  const box = document.getElementById("debugLog");
  if (!box) return;

  box.style.display = "block";
  const time = new Date().toLocaleTimeString();
  box.innerHTML += `[${time}] ${msg}<br>`;
  box.scrollTop = box.scrollHeight;
}

function renderDriverList(statusData = {}) {
  const list = document.getElementById("driverItems");
  list.innerHTML = "";

  const driverIds =
    Object.keys(DRIVER_CACHE)
      .filter(driverId =>
        MAP_ASSIGNED_DRIVER_IDS.has(
          String(driverId).trim()
        )
      );

  driverIds.forEach(driverId => {
    const driverInfo = DRIVER_CACHE[driverId];
    const status = statusData[driverId] || {};

    // 🔹 BA filter (based on tasks, not GPS)
    if (!driverMatchesBA(driverId)) return;

    const hasLocation =
      status.latitude != null &&
      status.longitude != null;

    const driverStatus = getDriverStatus(status.lastSeen);
    const stats = TASK_STATS[driverId] || { open: 0, completed: 0 };
    // ✅ Online-only filter
    if (SHOW_ONLINE_ONLY && driverStatus.label !== "Active") {
      return;
    }

    const row = document.createElement("div");
    row.style.cssText = `
      display:flex;
      gap:8px;
      padding:8px 0;
      border-bottom:1px solid #eee;
      cursor:${hasLocation ? "pointer" : "default"};
      align-items:flex-start;
      opacity:${hasLocation ? "1" : "0.6"};
    `;

    row.innerHTML = `
      <!-- STATUS DOT -->
      <div style="
        width:10px;
        height:10px;
        margin-top:4px;
        border-radius:50%;
        background:${driverStatus.color};
        flex-shrink:0;
      "></div>

      <!-- DRIVER INFO -->
      <div style="flex:1">
        <div style="font-size:13px;font-weight:bold;">
          ${driverInfo.name || "Unnamed Driver"}
        </div>

        <div style="font-size:12px;color:#444;">
          📞 ${driverInfo.contact || "—"}
        </div>

        <div style="font-size:11px;color:#666;margin-top:2px;">
          ${driverId} · ${driverStatus.label}
          ${!hasLocation ? " · No GPS yet" : ""}
        </div>

        <div style="font-size:11px;color:#444;margin-top:4px;">
          <span
            style="color:orange;cursor:pointer;font-weight:bold"
            onclick="event.stopPropagation(); showDriverOpenTasks('${driverId}')">
            🟠 Open: ${stats.open}
          </span>
          |
          <span style="color:green">
            ✅ Done: ${stats.completed}
          </span>
        </div>
      </div>
    `;

    // 🗺 Focus map ONLY if GPS exists
    if (hasLocation) {
      row.onclick = () => {
        map.setView([status.latitude, status.longitude], 15);
        markers[driverId]?.openPopup();
      };
    }

    list.appendChild(row);
  });

  if (!list.children.length) {
    list.innerHTML = `
      <div style="font-size:12px;color:#888;padding:6px 0;">
        No drivers available
      </div>
    `;
  }
}

function buildTaskStatsFromFirestore() {
  TASK_STATS = {};

  if (!window.__FIRESTORE_TASKS__) return;

  window.__FIRESTORE_TASKS__.forEach(t => {
    if (!t.driverId) return;

    if (!TASK_STATS[t.driverId]) {
      TASK_STATS[t.driverId] = { open: 0, completed: 0 };
    }

    if (t.status === "COMPLETED") {
      TASK_STATS[t.driverId].completed++;
    } else {
      TASK_STATS[t.driverId].open++;
    }
  });
}

function buildDriverBAMapFromFirestore() {
  DRIVER_BA_MAP = {};

  if (!window.__FIRESTORE_TASKS__) return;

  window.__FIRESTORE_TASKS__.forEach(t => {
    if (!t.driverId || !t.BA) return;

    if (!DRIVER_BA_MAP[t.driverId]) {
      DRIVER_BA_MAP[t.driverId] = [];
    }

    if (!DRIVER_BA_MAP[t.driverId].includes(t.BA)) {
      DRIVER_BA_MAP[t.driverId].push(t.BA);
    }
  });
}

// =====================================================
// 🗺 LIVE DRIVER LOCATION — REALTIME DATABASE
// =====================================================

let driverStatusData = {};
let DRIVER_STATUS_UNSUBSCRIBE = null;

// =====================================================
// 🗺 DRIVERS ASSIGNED FOR SELECTED MAP DATE
// =====================================================

let MAP_ASSIGNED_DRIVER_IDS = new Set();

function normalizeMapDate(value) {
  if (!value) return "";

  if (
    typeof value === "string" &&
    /^\d{4}-\d{2}-\d{2}$/.test(value)
  ) {
    return value;
  }

  if (
    value?.toDate
  ) {
    return value
      .toDate()
      .toLocaleDateString(
        "en-CA",
        {
          timeZone: "Asia/Manila"
        }
      );
  }

  const d = new Date(value);

  if (isNaN(d.getTime())) {
    return "";
  }

  return d.toLocaleDateString(
    "en-CA",
    {
      timeZone: "Asia/Manila"
    }
  );
}


function buildMapAssignedDriverIds() {

  MAP_ASSIGNED_DRIVER_IDS =
    new Set();

  const tasks =
    window.__FIRESTORE_TASKS__ || [];

  const fromInput =
    document.getElementById("adminDateFrom");

  const toInput =
    document.getElementById("adminDateTo");

  const fromDate =
    fromInput?.value || "";

  const toDate =
    toInput?.value || fromDate;

  tasks.forEach(task => {

    const driverId =
      String(
        task.driverId || ""
      ).trim();

    if (!driverId) {
      return;
    }

    const assignedDate =
      normalizeMapDate(
        task.assignedDate
      );

    if (!assignedDate) {
      return;
    }

    // Date range filter
    if (
      fromDate &&
      assignedDate < fromDate
    ) {
      return;
    }

    if (
      toDate &&
      assignedDate > toDate
    ) {
      return;
    }

    MAP_ASSIGNED_DRIVER_IDS.add(
      driverId
    );
  });

  console.log(
    "🗺 Drivers assigned for selected date:",
    [...MAP_ASSIGNED_DRIVER_IDS]
  );
}

function processDriverStatusData(data = {}) {

  driverStatusData = data || {};

  // Update driver list
  renderDriverList(driverStatusData);

  // Update map markers
  Object.entries(driverStatusData).forEach(([id, d]) => {

    // =================================================
    // 🗺 ONLY PLOT DRIVERS ASSIGNED FOR SELECTED DATE
    // =================================================
    if (
      !MAP_ASSIGNED_DRIVER_IDS.has(
        String(id).trim()
      )
    ) {

      if (markers[id]) {
        map.removeLayer(markers[id]);
        delete markers[id];
      }

      return;
    }

    // BA filter
    if (!driverMatchesBA(id)) {

      if (markers[id]) {
        map.removeLayer(markers[id]);
        delete markers[id];
      }

      return;
    }

    // No GPS coordinates
    if (
      d.latitude == null ||
      d.longitude == null
    ) {

      if (markers[id]) {
        map.removeLayer(markers[id]);
        delete markers[id];
      }

      return;
    }

    const latitude = Number(d.latitude);
    const longitude = Number(d.longitude);

    // Invalid GPS
    if (
      !Number.isFinite(latitude) ||
      !Number.isFinite(longitude)
    ) {
      return;
    }

    const pos = [
      latitude,
      longitude
    ];

    const status =
      getDriverStatus(d.lastSeen);

    // Online-only filter
    if (
      SHOW_ONLINE_ONLY &&
      status.label !== "Active"
    ) {

      if (markers[id]) {
        map.removeLayer(markers[id]);
        delete markers[id];
      }

      return;
    }

    const icon = L.divIcon({
      html: `
        <div style="
          width:14px;
          height:14px;
          background:${status.color};
          border-radius:50%;
          border:2px solid white;
        "></div>
      `,
      className: ""
    });

    // Create marker
    if (!markers[id]) {

      markers[id] =
        L.marker(
          pos,
          { icon }
        )
        .addTo(map)
        .bindPopup(`
          <b>${id}</b><br>
          Status: ${status.label}<br>
          Last seen:
          ${
            d.lastSeen
              ? new Date(
                  d.lastSeen
                ).toLocaleString()
              : "—"
          }
        `);

    } else {

      // Update marker position
      markers[id].setLatLng(pos);

      // Update marker status color
      markers[id].setIcon(icon);

      // Update popup
      markers[id].setPopupContent(`
        <b>${id}</b><br>
        Status: ${status.label}<br>
        Last seen:
        ${
          d.lastSeen
            ? new Date(
                d.lastSeen
              ).toLocaleString()
            : "—"
        }
      `);
    }
  });

  // Remove markers for drivers no longer present
  Object.keys(markers).forEach(id => {

  if (
    !driverStatusData[id] ||
    !MAP_ASSIGNED_DRIVER_IDS.has(
      String(id).trim()
    )
  ) {

    map.removeLayer(
      markers[id]
    );

    delete markers[id];
  }
});
}

// =====================================================
// 🔄 REFRESH MAP FROM CURRENT RTDB DATA
// =====================================================

function refreshMap() {

  if (!MAP_VISIBLE) return;

  processDriverStatusData(
    driverStatusData || {}
  );
}


// =====================================================
// 📡 START REALTIME DRIVER STATUS LISTENER
// =====================================================


function startDriverStatusListener() {

  // Prevent duplicate listeners
  if (DRIVER_STATUS_UNSUBSCRIBE) {
    DRIVER_STATUS_UNSUBSCRIBE();
    DRIVER_STATUS_UNSUBSCRIBE = null;
  }

  const driverStatusRef =
    ref(
      rtdb,
      "driverStatus"
    );

  DRIVER_STATUS_UNSUBSCRIBE =
    onValue(
      driverStatusRef,
      snapshot => {

        const data =
          snapshot.exists()
            ? snapshot.val()
            : {};

        console.log(
          "📡 RTDB driverStatus updated:",
          data
        );

        processDriverStatusData(
          data
        );
      },
      error => {

        console.error(
          "❌ RTDB driverStatus listener failed:",
          error
        );
      }
    );
}
