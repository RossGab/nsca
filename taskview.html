<html lang="en">
<head>

<title>Task Viewer 1.0</title>

<style>
body {
  display:none; /* 🔥 add this */

}

.admin-header {

<body>

  <div class="admin-header">
  <img src="./logo.jpg" class="admin-logo">
  <h2>Tasks Viewer v1.1.0.1.3</h2>

  <div>
    <input type="date" id="from">
    to
    <input type="date" id="to">

    </div>

<input id="searchBox" placeholder="Search..." style="width:100%;padding:10px;margin-bottom:10px">

</div>

<div id="taskList"></div>

<script type="module">import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  initializeFirestore, collection, getDocs, query, where
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getDatabase, ref, get
} from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDFW61pnwLvh6HGKWt10zLYNr860fI8vkg",
  authDomain: "driva-pwa.firebaseapp.com",
  databaseURL: "https://driva-pwa-default-rtdb.firebaseio.com",
  projectId: "driva-pwa",
  storageBucket: "driva-pwa.firebasestorage.app",
  messagingSenderId: "299138219722",
  appId: "1:299138219722:web:623ff6b0a067ea822dfe33"
};


const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const db = getDatabase(app);
const firestore = initializeFirestore(app, {}, "drver-task");
const TASK_COLLECTION = "TASK";

import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const auth = getAuth(app);

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login-taskview.html";
    return;
  }

  const email = (user.email || "").toLowerCase();

  const snap = await get(ref(db, "config/taskviewUsers"));
  const data = snap.val() || {};

  let role = null;
  let userBA = null;
  
  // 🔍 CHECK ADMIN
  Object.values(data.admin || {}).forEach(u => {
    if (u.email === email && u.active) {
      role = "admin";
      userBA = null; // admin sees all
    }
  });
  
  // 🔍 CHECK VIEWER
  Object.values(data.viewer || {}).forEach(u => {
    if (u.email === email && u.active) {
      role = "viewer";
      userBA = u.ba || []; // 👈 IMPORTANT
    }
  });

  // 🔍 CHECK ADMIN
  Object.values(data.admin || {}).forEach(u => {
    if (u.email === email && u.active) {
      role = "admin";
    }
  });

  // 🔍 CHECK VIEWER
  Object.values(data.viewer || {}).forEach(u => {
    if (u.email === email && u.active) {
      role = "viewer";
    }
  });

  // ❌ NOT AUTHORIZED
  if (!role) {
    alert("Access denied");
    window.location.href = "login-taskview.html";
    return;
  }

  // ✅ SAVE ROLE (optional for later UI control)
  window.USER_ROLE = role;
  window.USER_BA = userBA;

  // 👀 SHOW PAGE
  document.body.style.display = "block";

  // ✅ SHOW CONFIG BUTTON IF ADMIN
  if (role === "admin") {
    document.getElementById("configBtn").style.display = "inline-block";
  }
  
  // 🚀 LOAD DATA
  await loadConfig();
  await loadTasks();
});

/* SNAPSHOT */
const BASE =
"https://raw.githubusercontent.com/RossGab/driva-task-snapshots/main/snapshots";

/* GLOBAL */
let TASKS = [];
let SNAPSHOT_TASKS = [];
let FIRESTORE_TASKS = [];
let LOAD_GENERATION = 0;
let DRIVER_UI_CONFIG = {};
let CONFIGURED_BAS = new Set();
let CONFIGURED_BA_VALUES = [];
let FILTER_BA = new Set();
let SEARCH_TERM = "";

const ADMIN_PAGE_SIZE = 200;
let ADMIN_CURRENT_PAGE = 0;
let FILTERED_TASK_IDS = [];

function formatDateTime(ts){
  if(!ts) return "";

  let d;
  if(typeof ts?.toDate === "function") {
    d = ts.toDate();
  } else if(Number.isFinite(ts?.seconds ?? ts?._seconds)) {
    d = new Date((ts.seconds ?? ts._seconds) * 1000);
  } else {
    d = new Date(ts);
  }

  if(Number.isNaN(d.getTime())) return "";

  return d.toLocaleString("en-PH", {
    timeZone: "Asia/Manila",
    year: "numeric",
    month: "short",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit"
  });
}

/* DATE */
function getTodayPH(){
  return new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Manila"});
}

const from = document.getElementById("from");
const to = document.getElementById("to");

from.value = getTodayPH();
to.value = getTodayPH();

/* DATE KEYS */
function getKeys(from,to){
  const keys=[];
  let d=new Date(from);
  const end=new Date(to);

  while(d<=end){
    keys.push(
      d.toLocaleDateString("en-CA",{timeZone:"Asia/Manila"})
       .replace(/-/g,"")
    );
    d.setDate(d.getDate()+1);
  }
  return keys;
}

/* LOAD CONFIG */
async function loadConfig(){
  const [jobTypesSnap, baListSnap] = await Promise.all([
    get(ref(db,"config/driverUI/jobTypes")),
    get(ref(db,"config/baList"))
  ]);

  DRIVER_UI_CONFIG = jobTypesSnap.val() || {};
  CONFIGURED_BA_VALUES = Object.keys(baListSnap.val() || {})
    .map(value => String(value || "").trim())
    .filter(Boolean);
  CONFIGURED_BAS = new Set(CONFIGURED_BA_VALUES.map(normalizeBAName));
}

function normalizeBAName(value){
  return String(value || "").trim().toUpperCase();
}

function isBAInDisplayConfig(ba){
  // Preserve the previous behavior if no BA display list has been configured.
  return !CONFIGURED_BAS.size || CONFIGURED_BAS.has(normalizeBAName(ba));
}

function getFirestoreAllowedBAs(){
  if (window.USER_ROLE === "admin" || !window.USER_BA?.length) {
    return [...CONFIGURED_BA_VALUES];
  }

  const viewerBAs = new Set(window.USER_BA.map(normalizeBAName));
  return CONFIGURED_BA_VALUES.filter(ba => viewerBAs.has(normalizeBAName(ba)));
}

// =====================
// IndexedDB
// =====================
const DB_NAME = "taskViewerDB";
const STORE = "snapshots";

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);

    req.onupgradeneeded = e => {
      e.target.result.createObjectStore(STORE);
    };

    req.onsuccess = e => resolve(e.target.result);
    req.onerror = reject;
  });
}

async function idbGet(key) {
  const db = await openDB();
  return new Promise(res => {
    const tx = db.transaction(STORE, "readonly");
    const store = tx.objectStore(STORE);
    const req = store.get(key);
    req.onsuccess = () => res(req.result);
  });
}

async function idbSet(key, val) {
  const db = await openDB();
  return new Promise(res => {
    const tx = db.transaction(STORE, "readwrite");
    const store = tx.objectStore(STORE);
    store.put(val, key);
    tx.oncomplete = res;
  });
}

/* LOAD TASKS */
async function loadTasks(){
  const generation = ++LOAD_GENERATION;
  showLoader();

  const keys = getKeys(from.value,to.value);
  SNAPSHOT_TASKS = [];
  FIRESTORE_TASKS = [];

  // =========================
  // STEP 1: LOAD FROM CACHE FIRST
  // =========================
  for (const k of keys) {
    const cacheKey = `snapshot_${k}`;
    const cached = await idbGet(cacheKey);

    if (cached?.data) {
      console.log(`⚡ ${k} from cache`);
      mergeTasks(cached.data, SNAPSHOT_TASKS);
    }
  }

  // ✅ render immediately
  rebuildCombinedTasks();
  hideLoader();

  // =========================
  // STEP 2: BACKGROUND VALIDATION
  // =========================
  await Promise.allSettled([
    backgroundValidate(keys, generation),
    loadFirestoreTasks(keys, generation)
  ]);
}

async function backgroundValidate(keys, generation){
  console.log("🔄 Background validation started");

  for (const k of keys) {
    if (generation !== LOAD_GENERATION) return;
    const cacheKey = `snapshot_${k}`;

    try {
      const cached = await idbGet(cacheKey);

      // 🔍 HEAD request (still used, but now NON-BLOCKING)
      const head = await fetch(`${BASE}/${k}.json`, {
        method: "HEAD"
      });

      if (!head.ok) continue;

      const remoteETag = head.headers.get("etag");

      // ✅ if same → skip
      if (cached && cached.etag === remoteETag) {
        continue;
      }

      // ⬇️ changed → fetch full
      console.log(`⬇️ ${k} updated`);

      const res = await fetch(`${BASE}/${k}.json`, {
        cache: "no-store"
      });

      if (!res.ok) continue;

      const data = await res.json();

      await idbSet(cacheKey, {
        etag: remoteETag,
        data: data
      });

      // 🔥 update UI live
      if (generation !== LOAD_GENERATION) return;
      mergeTasks(data, SNAPSHOT_TASKS);
      rebuildCombinedTasks();

    } catch (err) {
      console.warn(`⚠️ background fail ${k}`, err);
    }
  }

  console.log("✅ Background validation done");
}

async function loadFirestoreTasks(keys, generation){
  const liveTasks = [];
  const allowedBAs = getFirestoreAllowedBAs();

  if (!allowedBAs.length) {
    FIRESTORE_TASKS = [];
    rebuildCombinedTasks();
    console.warn("Firestore task load skipped: no configured BA is available for this user.");
    return;
  }

  try {
    for (const key of keys) {
      if (generation !== LOAD_GENERATION) return;

      const assignedDate =
        `${key.slice(0,4)}-${key.slice(4,6)}-${key.slice(6,8)}`;

      for (const ba of allowedBAs) {
        if (generation !== LOAD_GENERATION) return;

        const snapshot = await getDocs(query(
          collection(firestore, TASK_COLLECTION),
          where("assignedDate", "==", assignedDate),
          where("status", "==", "COMPLETED"),
          where("BA", "==", ba)
        ));

        snapshot.forEach(docSnap => {
          const task = normalizeViewerTask({ _key: docSnap.id, ...docSnap.data() });
          if (isVisibleCompletedTask(task)) liveTasks.push(task);
        });
      }
    }

    if (generation !== LOAD_GENERATION) return;
    FIRESTORE_TASKS = liveTasks;
    rebuildCombinedTasks();
    console.log(
      `Firestore added ${liveTasks.length} completed task(s) from ${allowedBAs.length} allowed BA(s)`
    );
  } catch (error) {
    console.warn("Firestore task load failed; snapshot tasks remain available.", error);
  }
}

/* SEARCH */
searchBox.oninput = e=>{
  SEARCH_TERM = e.target.value.toLowerCase();
  ADMIN_CURRENT_PAGE = 0;
  render();
};

/* BA FILTER */
function buildBAFilters(){
  const container = document.getElementById("baFilters");
  container.innerHTML = "";

  let bas = new Set(
    TASKS
      .map(t => t.BA)
      .filter(ba => ba && ba !== "Test" && isBAInDisplayConfig(ba)) // 🔥 REMOVE TEST BA
  );

  // 🔥 restrict BA filters for viewer
  if (window.USER_ROLE !== "admin" && window.USER_BA?.length) {
    bas = new Set([...bas].filter(ba => window.USER_BA.includes(ba)));
  }

  [...bas].sort().forEach(ba => {
    const label = document.createElement("label");
    label.style.marginRight = "10px";

    label.innerHTML = `
      <input type="checkbox" value="${ba}">
      ${ba}
    `;

    label.querySelector("input").onchange = e => {
      if (e.target.checked) FILTER_BA.add(ba);
      else FILTER_BA.delete(ba);

      ADMIN_CURRENT_PAGE = 0;
      render();
    };

    container.appendChild(label);
  });
}

/* MAIN RENDER */
function render(){

  let tasks = TASKS;

  // 🔥 REMOVE TEST BA FROM DATA
  tasks = tasks.filter(t => t.BA !== "Test" && isBAInDisplayConfig(t.BA));

  // 🔥 APPLY USER BA FILTER
  if (window.USER_ROLE !== "admin" && window.USER_BA?.length) {
    tasks = tasks.filter(t => window.USER_BA.includes(t.BA));
  }

  if(SEARCH_TERM){
    tasks = tasks.filter(t =>
      Object.values(t).some(v =>
        String(v||"").toLowerCase().includes(SEARCH_TERM)
      )
    );
  }

  if(FILTER_BA.size){
    tasks = tasks.filter(t => FILTER_BA.has(t.BA));
  }

  FILTERED_TASK_IDS = tasks.map(t => t._key);

  const start = ADMIN_CURRENT_PAGE * ADMIN_PAGE_SIZE;
  const pageTasks = tasks.slice(start, start + ADMIN_PAGE_SIZE);

  renderPage(pageTasks);
  renderPagination();
}

/* PAGE RENDER */
function renderPage(tasks){
  const list = document.getElementById("taskList");
  list.innerHTML="";

  if(!tasks.length){
    list.innerHTML = `<div style="padding:12px;background:#fff;border-radius:8px;text-align:center;">No tasks found</div>`;
    return;
  }

  tasks.forEach(t=>{
    const div=document.createElement("div");
    div.className="task";

    div.innerHTML=`
      <div class="task-header">
        <b>${t.CUSTOMERNAME||""}</b>
        <div class="small">${t.ADDRESS||""}</div>
        <div class="small">Driver: ${t.driverId||"—"}</div>
        <div class="small" style="color:#16a34a;">
          Completed: ${formatDateTime(t.uploadedAt || t.completedAt || t.updatedAt)}
        </div>
      </div>

      <div class="details" style="display:none">
        ${renderDetails(t)}
        ${renderDynamic(t)}
        <button onclick="loadPhotos('${t._key}',this)">📸 Load Photos</button>
      </div>
    `;

    div.querySelector(".task-header").onclick=()=>{
      const d = div.querySelector(".details");
      d.style.display = d.style.display==="none"?"block":"none";
    };

    list.appendChild(div);
  });
}

/* PAGINATION */
function renderPagination(){
  const el = document.getElementById("pagination");

  const totalPages = Math.max(1,
    Math.ceil(FILTERED_TASK_IDS.length / ADMIN_PAGE_SIZE)
  );

  el.innerHTML = `
    <button ${ADMIN_CURRENT_PAGE === 0 ? "disabled" : ""}
      onclick="prevPage()">⬅ Prev</button>

    <span style="margin:0 10px;">
      Page ${ADMIN_CURRENT_PAGE + 1} of ${totalPages}
      (${FILTERED_TASK_IDS.length} tasks)
    </span>

    <button ${ADMIN_CURRENT_PAGE >= totalPages - 1 ? "disabled" : ""}
      onclick="nextPage()">Next ➡</button>
  `;
}

window.prevPage = function(){
  if(ADMIN_CURRENT_PAGE > 0){
    ADMIN_CURRENT_PAGE--;
    render();
  }
};

window.nextPage = function(){
  const totalPages = Math.ceil(FILTERED_TASK_IDS.length / ADMIN_PAGE_SIZE);
  if(ADMIN_CURRENT_PAGE < totalPages - 1){
    ADMIN_CURRENT_PAGE++;
    render();
  }
};

function isVisibleCompletedTask(task){
  return task &&
    task.deleted !== true &&
    String(task.status || "").toUpperCase() === "COMPLETED" &&
    task.BA !== "Test";
}

function normalizeViewerTask(task){
  const raw = task || {};
  return {
    ...raw,
    _key: raw.taskId ?? raw._key ?? raw.id ?? "",
    driverId: raw.driverId ?? raw.agentId ?? "",
    JOBTYPE: raw.JOBTYPE ?? raw.jobType ?? "",
    BA: raw.BA ?? raw.ba ?? "",
    DMZ: raw.DMZ ?? raw.dmz ?? "",
    MRU: raw.MRU ?? raw.mru ?? "",
    BG: raw.BG ?? raw.bg ?? "",
    SEQUENCE: raw.SEQUENCE ?? raw.sequence ?? "",
    METERNUMBER: raw.METERNUMBER ?? raw.meterNumber ?? "",
    ACCOUNTNUMBER: raw.ACCOUNTNUMBER ?? raw.accountNumber ?? "",
    CUSTOMERNAME: raw.CUSTOMERNAME ?? raw.customerName ?? "",
    ADDRESS: raw.ADDRESS ?? raw.address ?? "",
    ZIPCODE: raw.ZIPCODE ?? raw.zipCode ?? "",
    LATITUDE: raw.LATITUDE ?? raw.latitude ?? "",
    LONGITUDE: raw.LONGITUDE ?? raw.longitude ?? "",
    deliveryType: raw.deliveryType ?? raw.DELIVERYTYPE ?? ""
  };
}

function mergeTasks(data, target){
  const incoming = Array.isArray(data)
    ? data
    : Object.entries(data || {}).map(([id, task]) => ({
        ...task,
        _key: task?.taskId ?? task?._key ?? task?.id ?? id
      }));
  const byId = new Map(target.map(task => [task._key, task]));

  incoming.map(normalizeViewerTask).forEach(task => {
    if (isVisibleCompletedTask(task) && task._key) {
      byId.set(task._key, task);
    }
  });

  target.splice(0, target.length, ...byId.values());
}

function rebuildCombinedTasks(){
  const combined = new Map();

  SNAPSHOT_TASKS.forEach(task => combined.set(task._key, task));
  FIRESTORE_TASKS.forEach(task => combined.set(task._key, task));

  TASKS = [...combined.values()];
  buildBAFilters();
  ADMIN_CURRENT_PAGE = 0;
  render();
}

/* DETAILS */
function renderDetails(t){
return `
<div class="task-form">
<label>ASSIGNED DRIVER</label><input value="${t.driverId||""}" disabled>
<label>JOB TYPE</label><input value="${t.JOBTYPE||""}" disabled>
<label>BA</label><input value="${t.BA||""}" disabled>
<label>DMZ</label><input value="${t.DMZ||""}" disabled>
<label>MRU</label><input value="${t.MRU||""}" disabled>
<label>SEQUENCE</label><input value="${t.SEQUENCE||""}" disabled>
<label>METER NUMBER</label><input value="${t.METERNUMBER||""}" disabled>
<label>ACCOUNT NUMBER</label><input value="${t.ACCOUNTNUMBER||""}" disabled>
<label>CUSTOMER NAME</label><input value="${t.CUSTOMERNAME||""}" disabled>
<label class="full">ADDRESS</label>
<textarea class="full" disabled>${t.ADDRESS||""}</textarea>
<label>ZIP CODE</label><input value="${t.ZIPCODE||""}" disabled>
<label>DELIVERY TYPE</label><input value="${t.deliveryType||""}" disabled>
<label>LATITUDE</label><input value="${t.LATITUDE||""}" disabled>
<label>LONGITUDE</label><input value="${t.LONGITUDE||""}" disabled>
</div>`;
}

/* DYNAMIC */
function renderDynamic(t){
  const cfg =
    DRIVER_UI_CONFIG?.[t.JOBTYPE]
    ?.deliveryMethods?.[t.deliveryType];

  if(!cfg) return "";

  let html=`<div class="task-form full"><b>DELIVERY DETAILS</b>`;

  cfg._order.forEach(k=>{
    const f=cfg.fields[k];
    if(!f) return;

    html+=`
      <label class="full">${f.label}</label>
      <input class="full" value="${t[k]||""}" disabled>
    `;
  });

  html+=`</div>`;
  return html;
}

/* PHOTOS */
window.loadPhotos = async function(id,btn){
  if(btn.dataset.loaded) return;

  btn.dataset.loaded=1;
  btn.innerText="Loading photos...";

  let t = TASKS.find(task => task._key === id) || {};
  const hasTaskPhoto = [1,2,3].some(i => t[`photo${i}Url`]);

  // Older snapshots may not contain their photo URLs, so keep the old RTDB
  // lookup as a fallback.
  if(!hasTaskPhoto){
    const snap = await get(ref(db,`tasks/${id}`));
    if(snap.exists()) t = { ...t, ...snap.val() };
  }

  const box=document.createElement("div");
  box.style.display="grid";
  box.style.gridTemplateColumns="repeat(3,1fr)";
  box.style.gap="6px";
  box.style.marginTop="10px";

  [1,2,3].forEach(i=>{
    const url=t[`photo${i}Url`];
    if(!url) return;

    const img=document.createElement("img");
    img.src=url;
    img.style.width="100%";
    img.style.height="90px";
    img.style.objectFit="cover";
    img.onclick=()=>window.open(url);

    box.appendChild(img);
  });

  if(!box.children.length){
    btn.innerText="No photos";
    return;
  }

  btn.after(box);
  btn.innerText="Photos Loaded";
};

/* LOADER */
function showLoader(){
  loadingScreen.style.display="flex";
}
function hideLoader(){
  loadingScreen.style.display="none";
}


from.onchange = async () => {
  await loadConfig();
  await loadTasks();
};

to.onchange = async () => {
  await loadConfig();
  await loadTasks();
};

window.goConfig = function(){
  window.location.href = "taskviewerConfig.html";
};

</script>

<script type="module">
import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const auth = getAuth();
  await signOut(auth);
  window.location.href = "login-taskview.html";
};
