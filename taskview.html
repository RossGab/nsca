<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Completed tasks | NSCA Task Viewer</title>
<style>
:root {
  color-scheme: light;
  --navy: #10223b;
  --ink: #14243a;
  --muted: #485c74;
  --blue: #1c4e84;
  --border: #dbe4ee;
  --surface: #edf2f7;
}

* { box-sizing: border-box; }

body {
  display: none;
  margin: 0;
  background: var(--surface);
  color: var(--ink);
  font: 1rem/1.5 system-ui, sans-serif;
}

.shell {
  width: min(calc(100% - 2rem), 72rem);
  margin-inline: auto;
}

.topbar {
  background: linear-gradient(145deg, var(--navy), #1b3d65);
  color: #fff;
}

.topbar .shell, .brand, .actions {
  display: flex;
  align-items: center;
  gap: .75rem;
}

.topbar .shell {
  justify-content: space-between;
  flex-wrap: wrap;
  padding-block: 1rem;
}

.brand { font-weight: 650; }
.actions { flex-wrap: wrap; }

.brand img {
  display: block;
  object-fit: contain;
  border-radius: .5rem;
  background: #fff;
}

main { padding-block: clamp(1.5rem, 4vw, 3rem); }

h1 {
  margin: 0;
  font-size: clamp(2rem, 5vw, 3rem);
  line-height: 1.1;
  letter-spacing: -.045em;
}

.intro { margin: .625rem 0 1.5rem; color: var(--muted); }

.filters, .empty {
  border: 1px solid var(--border);
  border-radius: .875rem;
  background: #fff;
}

.filters { padding: 1rem; margin-bottom: 1.25rem; }

.filter-fields {
  display: grid;
  grid-template-columns: minmax(0, 1fr) repeat(2, minmax(0, 10rem));
  gap: .875rem;
}

.field { min-width: 0; }

.search-controls {
  display: flex;
  align-items: stretch;
  gap: .5rem;
}

.search-controls input { flex: 1; }

.field label {
  display: block;
  font-size: .875rem;
  font-weight: 650;
}

.field label { margin-bottom: .375rem; }

.field input {
  width: 100%;
  min-width: 0;
  min-height: 2.75rem;
  padding: .5rem .625rem;
  border: 1px solid #8194aa;
  border-radius: .5rem;
  color: inherit;
  background: #fff;
  font: inherit;
}

#baFilters:not(:empty) {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem;
  margin-top: 1rem;
}

#baFilters label {
  display: inline-flex;
  align-items: center;
  gap: .375rem;
  min-height: 2.75rem;
  padding: .375rem .625rem;
  border: 1px solid var(--border);
  border-radius: .5rem;
  font-size: .875rem;
  cursor: pointer;
}

input[type=checkbox] { accent-color: var(--blue); }

button {
  min-height: 2.75rem;
  padding: .5rem .875rem;
  border: 1px solid transparent;
  border-radius: .5rem;
  background: var(--blue);
  color: #fff;
  font: inherit;
  font-weight: 650;
  cursor: pointer;
}

button:hover:not(:disabled) { background: #153c68; }
button:disabled { opacity: .6; cursor: default; }
.actions button { background: transparent; border-color: #90a6bf; }
.actions button:hover { background: #ffffff20; }
:focus-visible { outline: 3px solid #2873c3; outline-offset: 3px; }

.database-spinner {
  width: 1.25rem;
  height: 1.25rem;
  flex: 0 0 1.25rem;
  border: 3px solid #bdcfe3;
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .database-spinner { animation: none; }
}

#databaseLoading {
  display: none;
  align-items: center;
  gap: .625rem;
  padding: .75rem 1rem;
  margin-bottom: 1rem;
  border: 1px solid #b3cce7;
  border-radius: .625rem;
  background: #e7f1fc;
  color: #234e7a;
}

.results {
  width: 100%;
  border-spacing: 0;
  border: 1px solid var(--border);
  border-radius: .875rem;
  background: #fff;
  font-size: .9375rem;
}

.results th, .results td {
  padding: .625rem .875rem;
  text-align: left;
  overflow-wrap: anywhere;
}

.results thead th {
  background: #f4f7fa;
  color: var(--muted);
  font-size: .875rem;
}

.results thead th:first-child { border-top-left-radius: .875rem; }
.results thead th:last-child { border-top-right-radius: .875rem; }
.results tbody tr > * { border-top: 1px solid var(--border); }
.results tbody tr:hover { background: #f4f8fc; }
.results td:last-child { text-align: right; }
.results .completed { color: #17643d; }
.mobile-label { display: none; }

.secondary {
  background: #fff;
  color: var(--blue);
  border-color: #a7bad0;
  white-space: nowrap;
}

.secondary:hover:not(:disabled) { background: #e7f1fc; }

.task-panel {
  position: fixed;
  inset: 0 0 0 auto;
  width: min(100%, 36rem);
  max-width: none;
  height: 100%;
  max-height: none;
  margin: 0;
  padding: 0;
  border: 0;
  color: var(--ink);
  background: #fff;
  box-shadow: -12px 0 40px #10223b28;
}

.task-panel::backdrop { background: #10223b66; }
body:has(.task-panel[open]) { overflow: hidden; }

.panel-header {
  position: sticky;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 1rem 1.25rem;
  background: #fff;
  border-bottom: 1px solid var(--border);
}

.panel-header h2 { margin: 0; font-size: 1.375rem; }
.panel-content { padding: 1.25rem; overflow-wrap: anywhere; }
.panel-content h3 { margin: 0 0 .75rem; font-size: 1rem; }

.detail-fields {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: .875rem 1.25rem;
  margin: 0 0 1.5rem;
}

.detail-fields .wide { grid-column: 1 / -1; }
.detail-fields dt { color: var(--muted); font-size: .875rem; font-weight: 650; }
.detail-fields dd { margin: .125rem 0 0; white-space: pre-wrap; }

.photo-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: .5rem;
  margin-top: .75rem;
}

.photo-grid img {
  display: block;
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  border-radius: .375rem;
}

@media (max-width: 47rem) {
  .results, .results tbody { display: grid; gap: .75rem; border: 0; background: transparent; }

  .results thead {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }

  .results tbody tr {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: .625rem 1rem;
    padding: 1rem;
    border: 1px solid var(--border);
    border-radius: .875rem;
    background: #fff;
  }

  .results tbody tr > * { padding: 0; border: 0; }
  .results tbody th, .results tbody td:last-child { grid-column: 1 / -1; text-align: left; }
  .mobile-label { display: block; color: var(--muted); font-size: .875rem; font-weight: 650; }
}


.empty { padding: 1.25rem; text-align: center; color: var(--muted); }

#pagination:not(:empty) {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: .75rem;
  margin-top: 1.25rem;
}

@media (max-width: 40rem) {
  .filter-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .field:first-child { grid-column: 1 / -1; }
}
</style>
</head>
<body>
  <header class="topbar">
    <div class="shell">
      <div class="brand">
        <img src="./logo.jpg" alt="" width="48" height="48">
        <span>NSCA Task Viewer</span>
      </div>
      <div class="actions">
        <button id="configBtn" onclick="goConfig()" style="display:none">Settings</button>
        <button onclick="logout()">Sign out</button>
      </div>
    </div>
  </header>

  <main class="shell">
    <h1>Completed tasks</h1>
    <p class="intro">Find completed tasks and review delivery details and photos.</p>

    <section class="filters" aria-label="Filter completed tasks">
      <div class="filter-fields">
        <form class="field" id="taskSearch">
          <label for="searchBox">Search tasks</label>
          <div class="search-controls">
            <input id="searchBox" type="search">
            <button type="submit">Search</button>
          </div>
        </form>
        <div class="field">
          <label for="from">Assigned from</label>
          <input type="date" id="from">
        </div>
        <div class="field">
          <label for="to">Assigned through</label>
          <input type="date" id="to">
        </div>
      </div>
      <div id="baFilters" role="group" aria-label="Filter by BA"></div>
    </section>

    <div id="databaseLoading" role="status">
      <span class="database-spinner" aria-hidden="true"></span>
      <span id="databaseLoadingText">Loading completed tasks...</span>
    </div>

    <div id="taskList"></div>
    <nav id="pagination" aria-label="Task pages"></nav>
  </main>


  <dialog id="taskPanel" class="task-panel" aria-labelledby="panelTitle">
    <header class="panel-header">
      <h2 id="panelTitle">Task details</h2>
      <form method="dialog">
        <button class="secondary" autofocus>Close</button>
      </form>
    </header>
    <div id="panelContent" class="panel-content"></div>
  </dialog>

<script type="module">import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {
  getDatabase, ref, get, onValue
} from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDFW61pnwLvh6HGKWt10zLYNr860fI8vkg",
  authDomain: "driva-pwa.firebaseapp.com",
  databaseURL: "https://driva-pwa-default-rtdb.firebaseio.com",
  projectId: "driva-pwa",
  storageBucket: "driva-pwa.firebasestorage.app",
  messagingSenderId: "299138219722",
  appId: "1:299138219722:web:623ff6b0a067ea822dfe33"
};


const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const db = getDatabase(app);

import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const auth = getAuth(app);

onAuthStateChanged(auth, async (user) => {
  stopWatchingAssignment?.();
  clearPageCache();
  clearTaskPage();
  if (!user) {
    window.location.href = "login-taskview.html";
    return;
  }

  const email = (user.email || "").toLowerCase();

  const snap = await get(ref(db, "config/taskviewUsers"));
  const data = snap.val() || {};

  let role = null;
  let userBA = [];
  let userConfigKey = null;
  
  // 🔍 CHECK ADMIN
  Object.entries(data.admin || {}).forEach(([key, u]) => {
    if (String(u.email || "").toLowerCase() === email && u.active) {
      role = "admin";
      userBA = Array.isArray(u.ba) ? u.ba : [];
      userConfigKey = key;
    }
  });
  
  // 🔍 CHECK VIEWER
  Object.entries(data.viewer || {}).forEach(([key, u]) => {
    if (String(u.email || "").toLowerCase() === email && u.active) {
      role = "viewer";
      userBA = Array.isArray(u.ba) ? u.ba : [];
      userConfigKey = key;
    }
  });

  // ❌ NOT AUTHORIZED
  if (!role) {
    alert("Access denied");
    window.location.href = "login-taskview.html";
    return;
  }

  // ✅ SAVE ROLE (optional for later UI control)
  window.USER_ROLE = role;
  window.USER_BA = userBA;

  // 👀 SHOW PAGE
  document.body.style.display = "block";

  // ✅ SHOW CONFIG BUTTON IF ADMIN
  if (role === "admin") {
    document.getElementById("configBtn").style.display = "inline-block";
  }
  
  // 🚀 LOAD DATA
  await loadConfig();

  // Apply BA assignment changes even while this page remains open.
  if (userConfigKey) {
    let assignmentSignature = JSON.stringify(
      [...window.USER_BA].map(normalizeBAName).sort()
    );
    stopWatchingAssignment = onValue(ref(db, `config/taskviewUsers/${role}/${userConfigKey}`), async userSnap => {
      const viewer = userSnap.val();
      if (!viewer?.active || String(viewer.email || "").toLowerCase() !== email) {
        clearPageCache();
        clearTaskPage();
        window.location.href = "login-taskview.html";
        return;
      }

      const updatedBAs =
        viewer?.active && Array.isArray(viewer.ba) ? viewer.ba : [];
      const updatedSignature = JSON.stringify(
        [...updatedBAs].map(normalizeBAName).sort()
      );
      if (updatedSignature === assignmentSignature) return;

      assignmentSignature = updatedSignature;
      clearPageCache();
      clearTaskPage();
      window.USER_BA = updatedBAs;
      FILTER_BA.clear();
      await loadConfig();
      await loadTasks();
    });
  }
  await loadTasks();
});

const VIEWER_TASK_URL =
  "https://asia-southeast1-driva-pwa.cloudfunctions.net/listCompletedViewerTasks";
const PAGE_SIZE = 100;
const PAGE_CACHE_TTL = 2 * 60 * 1000;
const PAGE_CACHE_LIMIT = 20;
const PAGE_CACHE = new Map();
let stopWatchingAssignment;
const FILTER_BA = new Set();
let CONFIGURED_BAS = new Set();
let DRIVER_UI_CONFIG = {};
let TASKS = [];
let ACTIVE_REQUEST;
let appliedSearch = "";
let CURRENT_PAGE = 0;
let PAGE_CURSORS = [null];
let NEXT_CURSOR = null;

function formatDateTime(ts){
  if(!ts) return "";

  let d;
  if(typeof ts?.toDate === "function") {
    d = ts.toDate();
  } else if(Number.isFinite(ts?.seconds ?? ts?._seconds)) {
    d = new Date((ts.seconds ?? ts._seconds) * 1000);
  } else {
    d = new Date(ts);
  }

  if(Number.isNaN(d.getTime())) return "";

  return d.toLocaleString("en-PH", {
    timeZone: "Asia/Manila",
    year: "numeric",
    month: "short",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit"
  });
}

/* DATE */
function getTodayPH(){
  return new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Manila"});
}

const from = document.getElementById("from");
const to = document.getElementById("to");

from.value = getTodayPH();
to.value = getTodayPH();


/* LOAD CONFIG */
async function loadConfig(){
  const [jobTypesSnap, baListSnap] = await Promise.all([
    get(ref(db,"config/driverUI/jobTypes")),
    get(ref(db,"config/baList"))
  ]);

  DRIVER_UI_CONFIG = jobTypesSnap.val() || {};
  CONFIGURED_BAS = new Set(Object.keys(baListSnap.val() || {}).map(normalizeBAName));
  buildBAFilters();
}

function normalizeBAName(value) {
  return String(value || "").trim().toUpperCase();
}

function buildBAFilters() {
  const container = document.getElementById("baFilters");
  container.replaceChildren();
  const bas = [...new Set((window.USER_BA || []).map(normalizeBAName))]
    .filter(ba => ba && ba !== "TEST" && (!CONFIGURED_BAS.size || CONFIGURED_BAS.has(ba)))
    .sort();

  for (const ba of bas) {
    const label = document.createElement("label");
    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = FILTER_BA.has(ba);
    input.onchange = () => {
      if (input.checked) FILTER_BA.add(ba);
      else FILTER_BA.delete(ba);
      loadTasks();
    };
    label.append(input, ba);
    container.append(label);
  }
}

function setDatabaseStatus(message, loading = false) {
  const status = document.getElementById("databaseLoading");
  status.style.display = message ? "flex" : "none";
  status.querySelector(".database-spinner").hidden = !loading;
  document.getElementById("databaseLoadingText").textContent = message;
}

function clearPageCache() {
  ACTIVE_REQUEST?.abort();
  PAGE_CACHE.clear();
  PAGE_CURSORS = [null];
}

function showTaskPage(tasks, cursor) {
  TASKS = tasks;
  NEXT_CURSOR = cursor;
  setDatabaseStatus("");
  renderPage(TASKS);
  renderPagination();
}

function clearTaskPage() {
  document.getElementById("taskPanel").close();
  TASKS = [];
  document.getElementById("taskList").replaceChildren();
  document.getElementById("pagination").replaceChildren();
}

async function loadTasks(page = 0) {
  ACTIVE_REQUEST?.abort();
  const controller = new AbortController();
  ACTIVE_REQUEST = controller;
  const search = appliedSearch;
  const selection = { from: from.value, to: to.value, search, bas: [...FILTER_BA].sort() };

  if (page === 0) PAGE_CURSORS = [null];
  CURRENT_PAGE = page;
  NEXT_CURSOR = null;
  clearTaskPage();

  if (!selection.from || !selection.to || selection.from > selection.to) {
    setDatabaseStatus("Choose a valid date range.");
    return;
  }

  const user = auth.currentUser;
  if (!user) return;

  let cursor = PAGE_CURSORS[page];
  const key = JSON.stringify([user.uid, selection.from, selection.to,
    search.toLowerCase(), selection.bas, cursor]);
  const now = Date.now();
  for (const [cacheKey, entry] of PAGE_CACHE) {
    if (entry.expires <= now) PAGE_CACHE.delete(cacheKey);
  }

  const cached = PAGE_CACHE.get(key);
  if (cached) {
    PAGE_CACHE.delete(key);
    PAGE_CACHE.set(key, cached);
    showTaskPage(cached.tasks, cached.cursor);
    return;
  }

  setDatabaseStatus(search ? "Searching the selected dates..." : "Loading completed tasks...", true);
  try {
    const token = await user.getIdToken();
    const tasks = [];
    do {
      const response = await fetch(VIEWER_TASK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
        body: JSON.stringify({ ...selection, cursor, pageSize: PAGE_SIZE - tasks.length }),
        signal: controller.signal
      });
      if (!response.ok) {
        const error = await response.json().catch(() => null);
        throw new Error(error?.error || "Task request failed (HTTP " + response.status + ").");
      }
      const result = await response.json();
      tasks.push(...result.tasks);
      cursor = result.cursor;
    } while (cursor && tasks.length < PAGE_SIZE && !controller.signal.aborted);

    if (controller.signal.aborted) return;
    PAGE_CACHE.set(key, { tasks, cursor, expires: Date.now() + PAGE_CACHE_TTL });
    if (PAGE_CACHE.size > PAGE_CACHE_LIMIT) PAGE_CACHE.delete(PAGE_CACHE.keys().next().value);
    showTaskPage(tasks, cursor);
  } catch (error) {
    if (controller.signal.aborted) return;
    console.error("Completed tasks request failed", error);
    setDatabaseStatus("Could not load completed tasks. Please try again.");
    const retry = document.createElement("button");
    retry.textContent = "Try again";
    retry.onclick = () => loadTasks(page);
    document.getElementById("pagination").append(retry);
  }
}

document.getElementById("taskSearch").addEventListener("submit", event => {
  event.preventDefault();
  appliedSearch = document.getElementById("searchBox").value.trim();
  loadTasks();
});

const TASK_COLUMNS = [
  ["Customer", task => task.CUSTOMERNAME],
  ["Account No.", task => task.ACCOUNTNUMBER],
  ["Meter No.", task => task.METERNUMBER],
  ["BA", task => task.BA],
  ["Driver", task => task.driverId],
  ["Completed At", task => formatDateTime(
    task.correctedCompletedAt || task.completedAt || task.uploadedAt || task.updatedAt
  )]
];

function renderPage(tasks) {
  const list = document.getElementById("taskList");
  if (!tasks.length) {
    list.innerHTML = '<div class="empty">No completed tasks match your filters.</div>';
    return;
  }

  const table = document.createElement("table");
  table.className = "results";
  table.setAttribute("role", "table");
  table.setAttribute("aria-label", "Completed tasks");
  const headings = table.createTHead();
  headings.setAttribute("role", "rowgroup");
  const header = headings.insertRow();
  header.setAttribute("role", "row");
  for (const name of [...TASK_COLUMNS.map(([label]) => label), "Details"]) {
    const cell = document.createElement("th");
    cell.scope = "col";
    cell.textContent = name;
    header.append(cell);
  }

  const body = table.createTBody();
  body.setAttribute("role", "rowgroup");
  for (const task of tasks) {
    const row = body.insertRow();
    row.setAttribute("role", "row");
    TASK_COLUMNS.forEach(([label, value], index) => {
      const cell = document.createElement(index === 0 ? "th" : "td");
      cell.setAttribute("role", index === 0 ? "rowheader" : "cell");
      if (index === 0) cell.scope = "row";
      if (label === "Completed At") cell.className = "completed";
      if (index > 0) {
        const mobileLabel = document.createElement("span");
        mobileLabel.className = "mobile-label";
        mobileLabel.setAttribute("aria-hidden", "true");
        mobileLabel.textContent = label;
        cell.append(mobileLabel);
      }

      const text = value(task);
      cell.append(text == null || text === "" ? "\u2014" : String(text));
      row.append(cell);
    });

    const action = row.insertCell();
    action.setAttribute("role", "cell");
    const button = document.createElement("button");
    button.type = "button";
    button.className = "secondary";
    button.textContent = "View details";
    button.setAttribute("aria-haspopup", "dialog");
    if (task.CUSTOMERNAME) button.setAttribute("aria-label", "View details for " + task.CUSTOMERNAME);
    button.onclick = () => openTaskDetails(task);
    action.append(button);
  }
  list.replaceChildren(table);
}


function renderPagination() {
  const el = document.getElementById("pagination");
  el.innerHTML = `
    <button id="previousPage" ${CURRENT_PAGE === 0 ? "disabled" : ""}>Previous</button>
    <span>Page ${CURRENT_PAGE + 1} &middot; ${TASKS.length} tasks</span>
    <button id="nextPage" ${NEXT_CURSOR ? "" : "disabled"}>Next</button>
  `;
  document.getElementById("previousPage").onclick = () => loadTasks(CURRENT_PAGE - 1);
  document.getElementById("nextPage").onclick = () => {
    PAGE_CURSORS[CURRENT_PAGE + 1] = NEXT_CURSOR;
    loadTasks(CURRENT_PAGE + 1);
  };
}

function renderFields(fields) {
  const list = document.createElement("dl");
  list.className = "detail-fields";
  for (const [label, value, wide] of fields) {
    const field = document.createElement("div");
    if (wide) field.className = "wide";
    const term = document.createElement("dt");
    const description = document.createElement("dd");
    term.textContent = label;
    description.textContent = value == null || value === "" ? "\u2014" : String(value);
    field.append(term, description);
    list.append(field);
  }
  return list;
}

function openTaskDetails(task) {
  const panel = document.getElementById("taskPanel");
  const content = document.getElementById("panelContent");
  content.replaceChildren(renderFields([
    ...TASK_COLUMNS.map(([label, value]) => [label, value(task)]),
    ["Address", task.ADDRESS, true], ["ZIP code", task.ZIPCODE],
    ["Job type", task.JOBTYPE], ["Delivery type", task.deliveryType],
    ["DMZ", task.DMZ], ["MRU", task.MRU], ["Sequence", task.SEQUENCE],
    ["Latitude", task.LATITUDE], ["Longitude", task.LONGITUDE]
  ]));

  const config = DRIVER_UI_CONFIG?.[task.JOBTYPE]?.deliveryMethods?.[task.deliveryType];
  const deliveryFields = (config?._order || [])
    .filter(key => config.fields?.[key])
    .map(key => [config.fields[key].label, task[key], true]);

  if (deliveryFields.length) {
    const heading = document.createElement("h3");
    heading.textContent = "Delivery details";
    content.append(heading, renderFields(deliveryFields));
  }

  const photos = document.createElement("button");
  photos.type = "button";
  photos.className = "secondary";
  photos.textContent = "Load photos";
  photos.onclick = () => loadPhotos(task, photos);
  content.append(photos);
  panel.showModal();
  panel.scrollTop = 0;
}

async function loadPhotos(task, button) {
  button.disabled = true;
  button.textContent = "Loading photos...";
  const slots = [1, 2, 3];

  try {
    // Older snapshots can omit photo URLs.
    if (task._key && !slots.some(slot => task["photo" + slot + "Url"])) {
      const snapshot = await get(ref(db, "tasks/" + task._key));
      if (snapshot.exists()) task = { ...task, ...snapshot.val() };
    }

    const grid = document.createElement("div");
    grid.className = "photo-grid";
    for (const slot of slots) {
      const url = URL.canParse(task["photo" + slot + "Url"])
        ? new URL(task["photo" + slot + "Url"])
        : null;
      if (url?.protocol !== "https:" && url?.protocol !== "http:") continue;
      const link = document.createElement("a");
      link.href = url.href;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      const image = document.createElement("img");
      image.src = url.href;
      image.alt = "Delivery photo " + slot;
      link.append(image);
      grid.append(link);
    }

    button.textContent = grid.childElementCount ? "Photos loaded" : "No photos available";
    if (grid.childElementCount) button.after(grid);
  } catch (error) {
    console.error("Delivery photos could not be loaded", error);
    button.textContent = "Retry loading photos";
    button.disabled = false;
  }
}


from.onchange = () => loadTasks();
to.onchange = () => loadTasks();

window.goConfig = function(){
  window.location.href = "taskviewerConfig.html";
};

window.logout = async function() {
  clearPageCache();
  clearTaskPage();
  await signOut(auth);
  window.location.href = "login-taskview.html";
};
