<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Completed tasks | NSCA Task Viewer</title>
<style>
:root {
  color-scheme: light;
  --navy: #10223b;
  --ink: #14243a;
  --muted: #485c74;
  --blue: #1c4e84;
  --border: #dbe4ee;
  --surface: #edf2f7;
}

* { box-sizing: border-box; }

body {
  display: none;
  margin: 0;
  background: var(--surface);
  color: var(--ink);
  font: 1rem/1.5 system-ui, sans-serif;
}

.shell {
  width: min(calc(100% - 2rem), 72rem);
  margin-inline: auto;
}

.topbar {
  background: linear-gradient(145deg, var(--navy), #1b3d65);
  color: #fff;
}

.topbar .shell, .brand, .actions {
  display: flex;
  align-items: center;
  gap: .75rem;
}

.topbar .shell {
  justify-content: space-between;
  flex-wrap: wrap;
  padding-block: 1rem;
}

.brand { font-weight: 650; }
.actions { flex-wrap: wrap; }

.brand img {
  display: block;
  object-fit: contain;
  border-radius: .5rem;
  background: #fff;
}

main { padding-block: clamp(1.5rem, 4vw, 3rem); }

h1 {
  margin: 0;
  font-size: clamp(2rem, 5vw, 3rem);
  line-height: 1.1;
  letter-spacing: -.045em;
}

.intro { margin: .625rem 0 1.5rem; color: var(--muted); }

.filters, .task, .empty {
  border: 1px solid var(--border);
  border-radius: .875rem;
  background: #fff;
}

.filters { padding: 1rem; margin-bottom: 1.25rem; }

.filter-fields {
  display: grid;
  grid-template-columns: minmax(0, 1fr) repeat(2, minmax(0, 10rem));
  gap: .875rem;
}

.field { min-width: 0; }

.field label, .task-form label {
  display: block;
  font-size: .875rem;
  font-weight: 650;
}

.field label { margin-bottom: .375rem; }

.field input, .task-form input, .task-form textarea {
  width: 100%;
  min-width: 0;
  min-height: 2.75rem;
  padding: .5rem .625rem;
  border: 1px solid #8194aa;
  border-radius: .5rem;
  color: inherit;
  background: #fff;
  font: inherit;
}

#baFilters:not(:empty) {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem;
  margin-top: 1rem;
}

#baFilters label {
  display: inline-flex;
  align-items: center;
  gap: .375rem;
  min-height: 2.75rem;
  padding: .375rem .625rem;
  border: 1px solid var(--border);
  border-radius: .5rem;
  font-size: .875rem;
  cursor: pointer;
}

input[type=checkbox] { accent-color: var(--blue); }

button {
  min-height: 2.75rem;
  padding: .5rem .875rem;
  border: 1px solid transparent;
  border-radius: .5rem;
  background: var(--blue);
  color: #fff;
  font: inherit;
  font-weight: 650;
  cursor: pointer;
}

button:hover:not(:disabled) { background: #153c68; }
button:disabled { opacity: .6; cursor: default; }
.actions button { background: transparent; border-color: #90a6bf; }
.actions button:hover { background: #ffffff20; }
:focus-visible { outline: 3px solid #2873c3; outline-offset: 3px; }

#loadingScreen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .75rem;
  background: #fffffff5;
  z-index: 9999;
}

.spinner, .database-spinner {
  width: 1.25rem;
  height: 1.25rem;
  flex: 0 0 1.25rem;
  border: 3px solid #bdcfe3;
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .spinner, .database-spinner { animation: none; }
}

#databaseLoading {
  display: none;
  align-items: center;
  gap: .625rem;
  padding: .75rem 1rem;
  margin-bottom: 1rem;
  border: 1px solid #b3cce7;
  border-radius: .625rem;
  background: #e7f1fc;
  color: #234e7a;
}

#databaseLoading.complete {
  background: #eaf8ee;
  color: #176b32;
  border-color: #9bd3aa;
}

#taskList { display: grid; gap: .75rem; }
.task { min-width: 0; }

.task-header {
  display: grid;
  gap: .25rem;
  width: 100%;
  padding: 1rem 1.25rem;
  text-align: left;
  border: 0;
  border-radius: inherit;
  background: #fff;
  color: inherit;
  font-weight: 400;
  overflow-wrap: anywhere;
}

.task-header:hover:not(:disabled) { background: #f4f8fc; }
.task-header b { font-size: 1.0625rem; }
.small { font-size: .875rem; color: var(--muted); }
.completed { color: #17643d; }
.details { padding: 1rem 1.25rem; border-top: 1px solid var(--border); }

.task-form {
  display: grid;
  grid-template-columns: minmax(0, 9rem) minmax(0, 1fr);
  align-items: center;
  gap: .5rem .875rem;
  margin-bottom: 1rem;
}

.task-form .full, .task-form > b { grid-column: 1 / -1; }

.task-form input:disabled, .task-form textarea:disabled {
  opacity: 1;
  background: #f4f7fa;
  border-color: var(--border);
}

.empty { padding: 1.25rem; text-align: center; color: var(--muted); }

#pagination:not(:empty) {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: .75rem;
  margin-top: 1.25rem;
}

@media (max-width: 40rem) {
  .filter-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .field:first-child { grid-column: 1 / -1; }
  .task-form { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
  <header class="topbar">
    <div class="shell">
      <div class="brand">
        <img src="./logo.jpg" alt="" width="48" height="48">
        <span>NSCA Task Viewer</span>
      </div>
      <div class="actions">
        <button id="configBtn" onclick="goConfig()" style="display:none">Settings</button>
        <button onclick="logout()">Sign out</button>
      </div>
    </div>
  </header>

  <main class="shell">
    <h1>Completed tasks</h1>
    <p class="intro">Find completed tasks and review delivery details and photos.</p>

    <section class="filters" aria-label="Filter completed tasks">
      <div class="filter-fields">
        <div class="field">
          <label for="searchBox">Search tasks</label>
          <input id="searchBox" type="search">
        </div>
        <div class="field">
          <label for="from">From date</label>
          <input type="date" id="from">
        </div>
        <div class="field">
          <label for="to">To date</label>
          <input type="date" id="to">
        </div>
      </div>
      <div id="baFilters" role="group" aria-label="Filter by BA"></div>
    </section>

    <div id="databaseLoading" role="status">
      <span class="database-spinner" aria-hidden="true"></span>
      <span id="databaseLoadingText">Loading completed tasks...</span>
    </div>

    <div id="taskList"></div>
    <nav id="pagination" aria-label="Task pages"></nav>
  </main>

  <div id="loadingScreen" role="status">
    <span class="spinner" aria-hidden="true"></span>
    <span>Loading completed tasks...</span>
  </div>


<script type="module">import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  initializeFirestore, collection, getDocs, query, where
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getDatabase, ref, get, onValue
} from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDFW61pnwLvh6HGKWt10zLYNr860fI8vkg",
  authDomain: "driva-pwa.firebaseapp.com",
  databaseURL: "https://driva-pwa-default-rtdb.firebaseio.com",
  projectId: "driva-pwa",
  storageBucket: "driva-pwa.firebasestorage.app",
  messagingSenderId: "299138219722",
  appId: "1:299138219722:web:623ff6b0a067ea822dfe33"
};


const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const db = getDatabase(app);
const firestore = initializeFirestore(app, {}, "drver-task");
const TASK_COLLECTION = "TASK";

import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const auth = getAuth(app);

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login-taskview.html";
    return;
  }

  const email = (user.email || "").toLowerCase();

  const snap = await get(ref(db, "config/taskviewUsers"));
  const data = snap.val() || {};

  let role = null;
  let userBA = [];
  let userConfigKey = null;
  
  // 🔍 CHECK ADMIN
  Object.entries(data.admin || {}).forEach(([key, u]) => {
    if (String(u.email || "").toLowerCase() === email && u.active) {
      role = "admin";
      userBA = Array.isArray(u.ba) ? u.ba : [];
      userConfigKey = key;
    }
  });
  
  // 🔍 CHECK VIEWER
  Object.entries(data.viewer || {}).forEach(([key, u]) => {
    if (String(u.email || "").toLowerCase() === email && u.active) {
      role = "viewer";
      userBA = Array.isArray(u.ba) ? u.ba : [];
      userConfigKey = key;
    }
  });

  // ❌ NOT AUTHORIZED
  if (!role) {
    alert("Access denied");
    window.location.href = "login-taskview.html";
    return;
  }

  // ✅ SAVE ROLE (optional for later UI control)
  window.USER_ROLE = role;
  window.USER_BA = userBA;

  // 👀 SHOW PAGE
  document.body.style.display = "block";

  // ✅ SHOW CONFIG BUTTON IF ADMIN
  if (role === "admin") {
    document.getElementById("configBtn").style.display = "inline-block";
  }
  
  // 🚀 LOAD DATA
  await loadConfig();
  await loadTasks();

  // Apply BA assignment changes even while this page remains open.
  if (userConfigKey) {
    let assignmentSignature = JSON.stringify(
      [...window.USER_BA].map(normalizeBAName).sort()
    );
    onValue(ref(db, `config/taskviewUsers/${role}/${userConfigKey}`), async userSnap => {
      const viewer = userSnap.val();
      const updatedBAs =
        viewer?.active && Array.isArray(viewer.ba) ? viewer.ba : [];
      const updatedSignature = JSON.stringify(
        [...updatedBAs].map(normalizeBAName).sort()
      );
      if (updatedSignature === assignmentSignature) return;

      assignmentSignature = updatedSignature;
      window.USER_BA = updatedBAs;
      FILTER_BA.clear();
      await loadConfig();
      await loadTasks();
    });
  }
});

/* SNAPSHOT */
const BASE =
"https://raw.githubusercontent.com/RossGab/driva-task-snapshots/main/snapshots";

/* GLOBAL */
let TASKS = [];
let SNAPSHOT_TASKS = [];
let FIRESTORE_TASKS = [];
let LOAD_GENERATION = 0;
let DRIVER_UI_CONFIG = {};
let CONFIGURED_BAS = new Set();
let CONFIGURED_BA_VALUES = [];
let FILTER_BA = new Set();
let SEARCH_TERM = "";

const ADMIN_PAGE_SIZE = 200;
let ADMIN_CURRENT_PAGE = 0;
let FILTERED_TASK_IDS = [];

function formatDateTime(ts){
  if(!ts) return "";

  let d;
  if(typeof ts?.toDate === "function") {
    d = ts.toDate();
  } else if(Number.isFinite(ts?.seconds ?? ts?._seconds)) {
    d = new Date((ts.seconds ?? ts._seconds) * 1000);
  } else {
    d = new Date(ts);
  }

  if(Number.isNaN(d.getTime())) return "";

  return d.toLocaleString("en-PH", {
    timeZone: "Asia/Manila",
    year: "numeric",
    month: "short",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit"
  });
}

/* DATE */
function getTodayPH(){
  return new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Manila"});
}

const from = document.getElementById("from");
const to = document.getElementById("to");

from.value = getTodayPH();
to.value = getTodayPH();

/* DATE KEYS */
function getKeys(from,to){
  const keys=[];
  let d=new Date(from);
  const end=new Date(to);

  while(d<=end){
    keys.push(
      d.toLocaleDateString("en-CA",{timeZone:"Asia/Manila"})
       .replace(/-/g,"")
    );
    d.setDate(d.getDate()+1);
  }
  return keys;
}

/* LOAD CONFIG */
async function loadConfig(){
  const [jobTypesSnap, baListSnap] = await Promise.all([
    get(ref(db,"config/driverUI/jobTypes")),
    get(ref(db,"config/baList"))
  ]);

  DRIVER_UI_CONFIG = jobTypesSnap.val() || {};
  CONFIGURED_BA_VALUES = Object.keys(baListSnap.val() || {})
    .map(value => String(value || "").trim())
    .filter(Boolean);
  CONFIGURED_BAS = new Set(CONFIGURED_BA_VALUES.map(normalizeBAName));
}

function normalizeBAName(value){
  return String(value || "").trim().toUpperCase();
}

function isBAInDisplayConfig(ba){
  // Preserve the previous behavior if no BA display list has been configured.
  return !CONFIGURED_BAS.size || CONFIGURED_BAS.has(normalizeBAName(ba));
}

function getFirestoreAllowedBAs(){
  const viewerBAs = new Set((window.USER_BA || []).map(normalizeBAName));
  return CONFIGURED_BA_VALUES.filter(ba => viewerBAs.has(normalizeBAName(ba)));
}

function getFirestoreBAQueryValues(allowedBAs){
  return [...new Set(allowedBAs.map(normalizeBAName).filter(Boolean))];
}

function chunkValues(values,size=30){
  const chunks=[];
  for(let index=0;index<values.length;index+=size){
    chunks.push(values.slice(index,index+size));
  }
  return chunks;
}

// =====================
// IndexedDB
// =====================
const DB_NAME = "taskViewerDB";
const STORE = "snapshots";

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);

    req.onupgradeneeded = e => {
      e.target.result.createObjectStore(STORE);
    };

    req.onsuccess = e => resolve(e.target.result);
    req.onerror = reject;
  });
}

async function idbGet(key) {
  const db = await openDB();
  return new Promise(res => {
    const tx = db.transaction(STORE, "readonly");
    const store = tx.objectStore(STORE);
    const req = store.get(key);
    req.onsuccess = () => res(req.result);
  });
}

async function idbSet(key, val) {
  const db = await openDB();
  return new Promise(res => {
    const tx = db.transaction(STORE, "readwrite");
    const store = tx.objectStore(STORE);
    store.put(val, key);
    tx.oncomplete = res;
  });
}

function setDatabaseLoading(reading,message){
  const box=document.getElementById("databaseLoading");
  const text=document.getElementById("databaseLoadingText");
  if(!box||!text)return;

  box.style.display="flex";
  box.classList.toggle("complete",!reading);
  const spinner=box.querySelector(".database-spinner");
  if(spinner)spinner.style.display=reading?"block":"none";
  text.textContent=message;
}

/* LOAD TASKS */
async function loadTasks(){
  const generation = ++LOAD_GENERATION;
  showLoader();
  setDatabaseLoading(true,"Checking saved snapshots and reading Firestore...");

  const keys = getKeys(from.value,to.value);
  SNAPSHOT_TASKS = [];
  FIRESTORE_TASKS = [];

  // =========================
  // STEP 1: LOAD FROM CACHE FIRST
  // =========================
  for (const k of keys) {
    const cacheKey = `snapshot_${k}`;
    const cached = await idbGet(cacheKey);

    if (cached?.data) {
      console.log(`⚡ ${k} from cache`);
      mergeTasks(cached.data, SNAPSHOT_TASKS);
    }
  }

  // ✅ render immediately
  rebuildCombinedTasks();
  hideLoader();

  // =========================
  // STEP 2: BACKGROUND VALIDATION
  // =========================
  await Promise.allSettled([
    backgroundValidate(keys, generation),
    loadFirestoreTasks(keys, generation)
  ]);

  if(generation===LOAD_GENERATION){
    setDatabaseLoading(
      false,
      `Database check complete - ${TASKS.length.toLocaleString()} task(s) available.`
    );
  }
}

async function backgroundValidate(keys, generation){
  console.log("🔄 Background validation started");

  for (const k of keys) {
    if (generation !== LOAD_GENERATION) return;
    const cacheKey = `snapshot_${k}`;

    try {
      const cached = await idbGet(cacheKey);

      // 🔍 HEAD request (still used, but now NON-BLOCKING)
      const head = await fetch(`${BASE}/${k}.json`, {
        method: "HEAD"
      });

      if (!head.ok) continue;

      const remoteETag = head.headers.get("etag");

      // ✅ if same → skip
      if (cached && cached.etag === remoteETag) {
        continue;
      }

      // ⬇️ changed → fetch full
      console.log(`⬇️ ${k} updated`);

      const res = await fetch(`${BASE}/${k}.json`, {
        cache: "no-store"
      });

      if (!res.ok) continue;

      const data = await res.json();

      await idbSet(cacheKey, {
        etag: remoteETag,
        data: data
      });

      // 🔥 update UI live
      if (generation !== LOAD_GENERATION) return;
      mergeTasks(data, SNAPSHOT_TASKS);
      rebuildCombinedTasks();

    } catch (err) {
      console.warn(`⚠️ background fail ${k}`, err);
    }
  }

  console.log("✅ Background validation done");
}

async function loadFirestoreTasks(keys, generation){
  const liveTasksById = new Map();
  const allowedBAs = getFirestoreAllowedBAs();
  const baQueryChunks = chunkValues(getFirestoreBAQueryValues(allowedBAs));

  if (!allowedBAs.length) {
    FIRESTORE_TASKS = [];
    rebuildCombinedTasks();
    console.warn("Firestore task load skipped: no configured BA is available for this user.");
    return;
  }

  try {
    for (const key of keys) {
      if (generation !== LOAD_GENERATION) return;

      const assignedDate =
        `${key.slice(0,4)}-${key.slice(4,6)}-${key.slice(6,8)}`;

      for (const baValues of baQueryChunks) {
        if (generation !== LOAD_GENERATION) return;

        // Current task documents use lowercase `ba`; older documents may use
        // uppercase `BA`. Firestore field names are case-sensitive, so query
        // both and merge by document ID.
        for (const baField of ["ba", "BA"]) {
          if (generation !== LOAD_GENERATION) return;

          setDatabaseLoading(
            true,
            `Reading Firestore for ${assignedDate} — ${liveTasksById.size.toLocaleString()} completed task(s) found so far…`
          );

          const snapshot = await getDocs(query(
            collection(firestore, TASK_COLLECTION),
            where("assignedDate", "==", assignedDate),
            where("status", "==", "COMPLETED"),
            where(baField, "in", baValues)
          ));

          snapshot.forEach(docSnap => {
            const task = normalizeViewerTask({ _key: docSnap.id, ...docSnap.data() });
            if (isVisibleCompletedTask(task)) liveTasksById.set(docSnap.id, task);
          });
        }
      }
    }

    if (generation !== LOAD_GENERATION) return;
    const liveTasks = [...liveTasksById.values()];
    FIRESTORE_TASKS = liveTasks;
    rebuildCombinedTasks();
    console.log(
      `Firestore added ${liveTasks.length} completed task(s) from ${allowedBAs.length} allowed BA(s)`,
      { queriedBAValues: baQueryChunks.flat() }
    );
  } catch (error) {
    console.warn("Firestore task load failed; snapshot tasks remain available.", error);
  }
}

/* SEARCH */
searchBox.oninput = e=>{
  SEARCH_TERM = e.target.value.toLowerCase();
  ADMIN_CURRENT_PAGE = 0;
  render();
};

/* BA FILTER */
function buildBAFilters(){
  const container = document.getElementById("baFilters");
  container.innerHTML = "";

  let bas = new Set(
    TASKS
      .map(t => t.BA)
      .filter(ba => ba && ba !== "Test" && isBAInDisplayConfig(ba)) // 🔥 REMOVE TEST BA
  );

  // 🔥 restrict BA filters for viewer
  const viewerBAs = new Set((window.USER_BA || []).map(normalizeBAName));
  bas = new Set([...bas].filter(ba => viewerBAs.has(normalizeBAName(ba))));

  [...bas].sort().forEach(ba => {
    const label = document.createElement("label");

    label.innerHTML = `
      <input type="checkbox" value="${ba}">
      ${ba}
    `;

    label.querySelector("input").onchange = e => {
      if (e.target.checked) FILTER_BA.add(ba);
      else FILTER_BA.delete(ba);

      ADMIN_CURRENT_PAGE = 0;
      render();
    };

    container.appendChild(label);
  });
}

/* MAIN RENDER */
function render(){

  let tasks = TASKS;

  // 🔥 REMOVE TEST BA FROM DATA
  tasks = tasks.filter(t => t.BA !== "Test" && isBAInDisplayConfig(t.BA));

  // 🔥 APPLY USER BA FILTER
  const viewerBAs = new Set((window.USER_BA || []).map(normalizeBAName));
  tasks = tasks.filter(t => viewerBAs.has(normalizeBAName(t.BA)));

  if(SEARCH_TERM){
    tasks = tasks.filter(t =>
      Object.values(t).some(v =>
        String(v||"").toLowerCase().includes(SEARCH_TERM)
      )
    );
  }

  if(FILTER_BA.size){
    tasks = tasks.filter(t => FILTER_BA.has(t.BA));
  }

  FILTERED_TASK_IDS = tasks.map(t => t._key);

  const start = ADMIN_CURRENT_PAGE * ADMIN_PAGE_SIZE;
  const pageTasks = tasks.slice(start, start + ADMIN_PAGE_SIZE);

  renderPage(pageTasks);
  renderPagination();
}

/* PAGE RENDER */
function renderPage(tasks){
  const list = document.getElementById("taskList");
  list.innerHTML="";

  if(!tasks.length){
    list.innerHTML = `<div class="empty">No completed tasks match your filters.</div>`;
    return;
  }

  tasks.forEach(t=>{
    const div=document.createElement("div");
    div.className="task";

    div.innerHTML=`
      <button type="button" class="task-header" aria-expanded="false">
        <b>${t.CUSTOMERNAME||""}</b>
        <span class="small">${t.ADDRESS||""}</span>
        <span class="small">Driver: ${t.driverId||"—"}</span>
        <span class="small completed">
          Completed: ${formatDateTime(t.correctedCompletedAt || t.completedAt || t.uploadedAt || t.updatedAt)}
        </span>
      </button>

      <div class="details" hidden>
        ${renderDetails(t)}
        ${renderDynamic(t)}
        <button onclick="loadPhotos('${t._key}',this)">Load photos</button>
      </div>
    `;

    const header = div.querySelector(".task-header");
    const details = div.querySelector(".details");
    header.onclick = () => {
      details.hidden = !details.hidden;
      header.setAttribute("aria-expanded", String(!details.hidden));
    };

    list.appendChild(div);
  });
}

/* PAGINATION */
function renderPagination(){
  const el = document.getElementById("pagination");

  const totalPages = Math.max(1,
    Math.ceil(FILTERED_TASK_IDS.length / ADMIN_PAGE_SIZE)
  );

  el.innerHTML = `
    <button ${ADMIN_CURRENT_PAGE === 0 ? "disabled" : ""}
      onclick="prevPage()">Previous</button>

    <span>
      Page ${ADMIN_CURRENT_PAGE + 1} of ${totalPages}
      (${FILTERED_TASK_IDS.length} tasks)
    </span>

    <button ${ADMIN_CURRENT_PAGE >= totalPages - 1 ? "disabled" : ""}
      onclick="nextPage()">Next</button>
  `;
}

window.prevPage = function(){
  if(ADMIN_CURRENT_PAGE > 0){
    ADMIN_CURRENT_PAGE--;
    render();
  }
};

window.nextPage = function(){
  const totalPages = Math.ceil(FILTERED_TASK_IDS.length / ADMIN_PAGE_SIZE);
  if(ADMIN_CURRENT_PAGE < totalPages - 1){
    ADMIN_CURRENT_PAGE++;
    render();
  }
};

function isVisibleCompletedTask(task){
  return task &&
    task.deleted !== true &&
    String(task.status || "").toUpperCase() === "COMPLETED" &&
    task.BA !== "Test";
}

function normalizeViewerTask(task){
  const raw = task || {};
  return {
    ...raw,
    _key: raw.taskId ?? raw._key ?? raw.id ?? "",
    driverId: raw.driverId ?? raw.agentId ?? "",
    JOBTYPE: raw.JOBTYPE ?? raw.jobType ?? "",
    BA: raw.BA ?? raw.ba ?? "",
    DMZ: raw.DMZ ?? raw.dmz ?? "",
    MRU: raw.MRU ?? raw.mru ?? "",
    BG: raw.BG ?? raw.bg ?? "",
    SEQUENCE: raw.SEQUENCE ?? raw.sequence ?? "",
    METERNUMBER: raw.METERNUMBER ?? raw.meterNumber ?? "",
    ACCOUNTNUMBER: raw.ACCOUNTNUMBER ?? raw.accountNumber ?? "",
    CUSTOMERNAME: raw.CUSTOMERNAME ?? raw.customerName ?? "",
    ADDRESS: raw.ADDRESS ?? raw.address ?? "",
    ZIPCODE: raw.ZIPCODE ?? raw.zipCode ?? "",
    LATITUDE: raw.LATITUDE ?? raw.latitude ?? "",
    LONGITUDE: raw.LONGITUDE ?? raw.longitude ?? "",
    deliveryType: raw.deliveryType ?? raw.DELIVERYTYPE ?? ""
  };
}

function mergeTasks(data, target){
  const incoming = Array.isArray(data)
    ? data
    : Object.entries(data || {}).map(([id, task]) => ({
        ...task,
        _key: task?.taskId ?? task?._key ?? task?.id ?? id
      }));
  const byId = new Map(target.map(task => [task._key, task]));

  incoming.map(normalizeViewerTask).forEach(task => {
    if (isVisibleCompletedTask(task) && task._key) {
      byId.set(task._key, task);
    }
  });

  target.splice(0, target.length, ...byId.values());
}

function rebuildCombinedTasks(){
  const combined = new Map();

  SNAPSHOT_TASKS.forEach(task => combined.set(task._key, task));
  FIRESTORE_TASKS.forEach(task => combined.set(task._key, task));

  TASKS = [...combined.values()];
  buildBAFilters();
  ADMIN_CURRENT_PAGE = 0;
  render();
}

/* DYNAMIC */
function renderDynamic(t){
  const cfg =
    DRIVER_UI_CONFIG?.[t.JOBTYPE]
    ?.deliveryMethods?.[t.deliveryType];

  if(!cfg) return "";

  let html=`<div class="task-form full"><b>DELIVERY DETAILS</b>`;

  cfg._order.forEach(k=>{
    const f=cfg.fields[k];
    if(!f) return;

    html+=`
      <label class="full">${f.label}</label>
      <input class="full" value="${t[k]||""}" disabled>
    `;
  });

  html+=`</div>`;
  return html;
}

/* PHOTOS */
window.loadPhotos = async function(id,btn){
  if(btn.dataset.loaded) return;

  btn.dataset.loaded=1;
  btn.innerText="Loading photos...";

  let t = TASKS.find(task => task._key === id) || {};
  const hasTaskPhoto = [1,2,3].some(i => t[`photo${i}Url`]);

  // Older snapshots may not contain their photo URLs, so keep the old RTDB
  // lookup as a fallback.
  if(!hasTaskPhoto){
    const snap = await get(ref(db,`tasks/${id}`));
    if(snap.exists()) t = { ...t, ...snap.val() };
  }

  const box=document.createElement("div");
  box.style.display="grid";
  box.style.gridTemplateColumns="repeat(3,1fr)";
  box.style.gap="6px";
  box.style.marginTop="10px";

  [1,2,3].forEach(i=>{
    const url=t[`photo${i}Url`];
    if(!url) return;

    const img=document.createElement("img");
    img.src=url;
    img.style.width="100%";
    img.style.height="90px";
    img.style.objectFit="cover";
    img.onclick=()=>window.open(url);

    box.appendChild(img);
  });

  if(!box.children.length){
    btn.innerText="No photos";
    return;
  }

  btn.after(box);
  btn.innerText="Photos Loaded";
};
