<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Completed tasks | NSCA Task Viewer</title>
<style>
:root {
  color-scheme: light;
  --navy: #10223b;
  --ink: #14243a;
  --muted: #485c74;
  --blue: #1c4e84;
  --border: #dbe4ee;
  --surface: #edf2f7;
}

* { box-sizing: border-box; }

body {
  display: none;
  margin: 0;
  background: var(--surface);
  color: var(--ink);
  font: 1rem/1.5 system-ui, sans-serif;
}

.shell {
  width: min(calc(100% - 2rem), 72rem);
  margin-inline: auto;
}

.topbar {
  background: linear-gradient(145deg, var(--navy), #1b3d65);
  color: #fff;
}

.topbar .shell, .brand, .actions {
  display: flex;
  align-items: center;
  gap: .75rem;
}

.topbar .shell {
  justify-content: space-between;
  flex-wrap: wrap;
  padding-block: 1rem;
}

.brand { font-weight: 650; }
.actions { flex-wrap: wrap; }

.brand img {
  display: block;
  object-fit: contain;
  border-radius: .5rem;
  background: #fff;
}

main { padding-block: clamp(1.5rem, 4vw, 3rem); }

h1 {
  margin: 0;
  font-size: clamp(2rem, 5vw, 3rem);
  line-height: 1.1;
  letter-spacing: -.045em;
}

.intro { margin: .625rem 0 1.5rem; color: var(--muted); }

.filters, .task, .empty {
  border: 1px solid var(--border);
  border-radius: .875rem;
  background: #fff;
}

.filters { padding: 1rem; margin-bottom: 1.25rem; }

.filter-fields {
  display: grid;
  grid-template-columns: minmax(0, 1fr) repeat(2, minmax(0, 10rem));
  gap: .875rem;
}

.field { min-width: 0; }

.field label, .task-form label {
  display: block;
  font-size: .875rem;
  font-weight: 650;
}

.field label { margin-bottom: .375rem; }

.field input, .task-form input, .task-form textarea {
  width: 100%;
  min-width: 0;
  min-height: 2.75rem;
  padding: .5rem .625rem;
  border: 1px solid #8194aa;
  border-radius: .5rem;
  color: inherit;
  background: #fff;
  font: inherit;
}

#baFilters:not(:empty) {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem;
  margin-top: 1rem;
}

#baFilters label {
  display: inline-flex;
  align-items: center;
  gap: .375rem;
  min-height: 2.75rem;
  padding: .375rem .625rem;
  border: 1px solid var(--border);
  border-radius: .5rem;
  font-size: .875rem;
  cursor: pointer;
}

input[type=checkbox] { accent-color: var(--blue); }

button {
  min-height: 2.75rem;
  padding: .5rem .875rem;
  border: 1px solid transparent;
  border-radius: .5rem;
  background: var(--blue);
  color: #fff;
  font: inherit;
  font-weight: 650;
  cursor: pointer;
}

button:hover:not(:disabled) { background: #153c68; }
button:disabled { opacity: .6; cursor: default; }
.actions button { background: transparent; border-color: #90a6bf; }
.actions button:hover { background: #ffffff20; }
:focus-visible { outline: 3px solid #2873c3; outline-offset: 3px; }

.database-spinner {
  width: 1.25rem;
  height: 1.25rem;
  flex: 0 0 1.25rem;
  border: 3px solid #bdcfe3;
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .database-spinner { animation: none; }
}

#databaseLoading {
  display: none;
  align-items: center;
  gap: .625rem;
  padding: .75rem 1rem;
  margin-bottom: 1rem;
  border: 1px solid #b3cce7;
  border-radius: .625rem;
  background: #e7f1fc;
  color: #234e7a;
}

#taskList { display: grid; gap: .75rem; }
.task { min-width: 0; }

.task-header {
  display: grid;
  gap: .25rem;
  width: 100%;
  padding: 1rem 1.25rem;
  text-align: left;
  border: 0;
  border-radius: inherit;
  background: #fff;
  color: inherit;
  font-weight: 400;
  overflow-wrap: anywhere;
}

.task-header:hover:not(:disabled) { background: #f4f8fc; }
.task-header b { font-size: 1.0625rem; }
.small { font-size: .875rem; color: var(--muted); }
.completed { color: #17643d; }
.details { padding: 1rem 1.25rem; border-top: 1px solid var(--border); }

.task-form {
  display: grid;
  grid-template-columns: minmax(0, 9rem) minmax(0, 1fr);
  align-items: center;
  gap: .5rem .875rem;
  margin-bottom: 1rem;
}

.task-form .full, .task-form > b { grid-column: 1 / -1; }

.task-form input:disabled, .task-form textarea:disabled {
  opacity: 1;
  background: #f4f7fa;
  border-color: var(--border);
}

.empty { padding: 1.25rem; text-align: center; color: var(--muted); }

#pagination:not(:empty) {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: .75rem;
  margin-top: 1.25rem;
}

@media (max-width: 40rem) {
  .filter-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .field:first-child { grid-column: 1 / -1; }
  .task-form { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
  <header class="topbar">
    <div class="shell">
      <div class="brand">
        <img src="./logo.jpg" alt="" width="48" height="48">
        <span>NSCA Task Viewer</span>
      </div>
      <div class="actions">
        <button id="configBtn" onclick="goConfig()" style="display:none">Settings</button>
        <button onclick="logout()">Sign out</button>
      </div>
    </div>
  </header>

  <main class="shell">
    <h1>Completed tasks</h1>
    <p class="intro">Find completed tasks and review delivery details and photos.</p>

    <section class="filters" aria-label="Filter completed tasks">
      <div class="filter-fields">
        <div class="field">
          <label for="searchBox">Search tasks</label>
          <input id="searchBox" type="search">
        </div>
        <div class="field">
          <label for="from">From date</label>
          <input type="date" id="from">
        </div>
        <div class="field">
          <label for="to">To date</label>
          <input type="date" id="to">
        </div>
      </div>
      <div id="baFilters" role="group" aria-label="Filter by BA"></div>
    </section>

    <div id="databaseLoading" role="status">
      <span class="database-spinner" aria-hidden="true"></span>
      <span id="databaseLoadingText">Loading completed tasks...</span>
    </div>

    <div id="taskList"></div>
    <nav id="pagination" aria-label="Task pages"></nav>
  </main>


<script type="module">import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {
  getDatabase, ref, get, onValue
} from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDFW61pnwLvh6HGKWt10zLYNr860fI8vkg",
  authDomain: "driva-pwa.firebaseapp.com",
  databaseURL: "https://driva-pwa-default-rtdb.firebaseio.com",
  projectId: "driva-pwa",
  storageBucket: "driva-pwa.firebasestorage.app",
  messagingSenderId: "299138219722",
  appId: "1:299138219722:web:623ff6b0a067ea822dfe33"
};


const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const db = getDatabase(app);

import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const auth = getAuth(app);

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login-taskview.html";
    return;
  }

  const email = (user.email || "").toLowerCase();

  const snap = await get(ref(db, "config/taskviewUsers"));
  const data = snap.val() || {};

  let role = null;
  let userBA = [];
  let userConfigKey = null;
  
  // 🔍 CHECK ADMIN
  Object.entries(data.admin || {}).forEach(([key, u]) => {
    if (String(u.email || "").toLowerCase() === email && u.active) {
      role = "admin";
      userBA = Array.isArray(u.ba) ? u.ba : [];
      userConfigKey = key;
    }
  });
  
  // 🔍 CHECK VIEWER
  Object.entries(data.viewer || {}).forEach(([key, u]) => {
    if (String(u.email || "").toLowerCase() === email && u.active) {
      role = "viewer";
      userBA = Array.isArray(u.ba) ? u.ba : [];
      userConfigKey = key;
    }
  });

  // ❌ NOT AUTHORIZED
  if (!role) {
    alert("Access denied");
    window.location.href = "login-taskview.html";
    return;
  }

  // ✅ SAVE ROLE (optional for later UI control)
  window.USER_ROLE = role;
  window.USER_BA = userBA;

  // 👀 SHOW PAGE
  document.body.style.display = "block";

  // ✅ SHOW CONFIG BUTTON IF ADMIN
  if (role === "admin") {
    document.getElementById("configBtn").style.display = "inline-block";
  }
  
  // 🚀 LOAD DATA
  await loadConfig();
  await loadTasks();

  // Apply BA assignment changes even while this page remains open.
  if (userConfigKey) {
    let assignmentSignature = JSON.stringify(
      [...window.USER_BA].map(normalizeBAName).sort()
    );
    onValue(ref(db, `config/taskviewUsers/${role}/${userConfigKey}`), async userSnap => {
      const viewer = userSnap.val();
      const updatedBAs =
        viewer?.active && Array.isArray(viewer.ba) ? viewer.ba : [];
      const updatedSignature = JSON.stringify(
        [...updatedBAs].map(normalizeBAName).sort()
      );
      if (updatedSignature === assignmentSignature) return;

      assignmentSignature = updatedSignature;
      window.USER_BA = updatedBAs;
      FILTER_BA.clear();
      await loadConfig();
      await loadTasks();
    });
  }
});

const VIEWER_TASK_URL =
  "https://asia-southeast1-driva-pwa.cloudfunctions.net/listCompletedViewerTasks";
const PAGE_SIZE = 100;
const FILTER_BA = new Set();
let CONFIGURED_BAS = new Set();
let DRIVER_UI_CONFIG = {};
let TASKS = [];
let ACTIVE_REQUEST;
let SEARCH_TIMER;
let CURRENT_PAGE = 0;
let PAGE_CURSORS = [null];
let NEXT_CURSOR = null;

function formatDateTime(ts){
  if(!ts) return "";

  let d;
  if(typeof ts?.toDate === "function") {
    d = ts.toDate();
  } else if(Number.isFinite(ts?.seconds ?? ts?._seconds)) {
    d = new Date((ts.seconds ?? ts._seconds) * 1000);
  } else {
    d = new Date(ts);
  }

  if(Number.isNaN(d.getTime())) return "";

  return d.toLocaleString("en-PH", {
    timeZone: "Asia/Manila",
    year: "numeric",
    month: "short",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit"
  });
}

/* DATE */
function getTodayPH(){
  return new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Manila"});
}

const from = document.getElementById("from");
const to = document.getElementById("to");

from.value = getTodayPH();
to.value = getTodayPH();


/* LOAD CONFIG */
async function loadConfig(){
  const [jobTypesSnap, baListSnap] = await Promise.all([
    get(ref(db,"config/driverUI/jobTypes")),
    get(ref(db,"config/baList"))
  ]);

  DRIVER_UI_CONFIG = jobTypesSnap.val() || {};
  CONFIGURED_BAS = new Set(Object.keys(baListSnap.val() || {}).map(normalizeBAName));
  buildBAFilters();
}

function normalizeBAName(value) {
  return String(value || "").trim().toUpperCase();
}

function buildBAFilters() {
  const container = document.getElementById("baFilters");
  container.replaceChildren();
  const bas = [...new Set((window.USER_BA || []).map(normalizeBAName))]
    .filter(ba => ba && ba !== "TEST" && (!CONFIGURED_BAS.size || CONFIGURED_BAS.has(ba)))
    .sort();

  for (const ba of bas) {
    const label = document.createElement("label");
    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = FILTER_BA.has(ba);
    input.onchange = () => {
      if (input.checked) FILTER_BA.add(ba);
      else FILTER_BA.delete(ba);
      loadTasks();
    };
    label.append(input, ba);
    container.append(label);
  }
}

function setDatabaseStatus(message, loading = false) {
  const status = document.getElementById("databaseLoading");
  status.style.display = message ? "flex" : "none";
  status.querySelector(".database-spinner").hidden = !loading;
  document.getElementById("databaseLoadingText").textContent = message;
}

function clearTaskPage() {
  TASKS = [];
  document.getElementById("taskList").replaceChildren();
  document.getElementById("pagination").replaceChildren();
}

async function loadTasks(page = 0) {
  clearTimeout(SEARCH_TIMER);
  ACTIVE_REQUEST?.abort();
  const controller = new AbortController();
  ACTIVE_REQUEST = controller;
  const search = document.getElementById("searchBox").value.trim();
  const selection = { from: from.value, to: to.value, search, bas: [...FILTER_BA] };

  if (page === 0) PAGE_CURSORS = [null];
  CURRENT_PAGE = page;
  NEXT_CURSOR = null;
  clearTaskPage();

  if (!selection.from || !selection.to || selection.from > selection.to) {
    setDatabaseStatus("Choose a valid date range.");
    return;
  }

  setDatabaseStatus(search ? "Searching the selected dates..." : "Loading completed tasks...", true);
  try {
    const token = await auth.currentUser.getIdToken();
    let cursor = PAGE_CURSORS[page];
    const tasks = [];
    do {
      const response = await fetch(VIEWER_TASK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
        body: JSON.stringify({ ...selection, cursor, pageSize: PAGE_SIZE - tasks.length }),
        signal: controller.signal
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || "Could not load completed tasks.");
      tasks.push(...result.tasks);
      cursor = result.cursor;
    } while (cursor && tasks.length < PAGE_SIZE && !controller.signal.aborted);

    if (controller.signal.aborted) return;
    TASKS = tasks;
    NEXT_CURSOR = cursor;
    setDatabaseStatus("");
    renderPage(TASKS);
    renderPagination();
  } catch (error) {
    if (controller.signal.aborted) return;
    console.error("Completed tasks request failed", error);
    setDatabaseStatus("Could not load completed tasks. Please try again.");
    const retry = document.createElement("button");
    retry.textContent = "Try again";
    retry.onclick = () => loadTasks(page);
    document.getElementById("pagination").append(retry);
  }
}

document.getElementById("searchBox").oninput = () => {
  clearTimeout(SEARCH_TIMER);
  ACTIVE_REQUEST?.abort();
  clearTaskPage();
  SEARCH_TIMER = setTimeout(() => loadTasks(), 350);
};

/* PAGE RENDER */
function renderPage(tasks){
  const list = document.getElementById("taskList");
  list.innerHTML="";

  if(!tasks.length){
    list.innerHTML = `<div class="empty">No completed tasks match your filters.</div>`;
    return;
  }

  tasks.forEach(t=>{
    const div=document.createElement("div");
    div.className="task";

    div.innerHTML=`
      <button type="button" class="task-header" aria-expanded="false">
        <b>${t.CUSTOMERNAME||""}</b>
        <span class="small">${t.ADDRESS||""}</span>
        <span class="small">Driver: ${t.driverId||"—"}</span>
        <span class="small completed">
          Completed: ${formatDateTime(t.correctedCompletedAt || t.completedAt || t.uploadedAt || t.updatedAt)}
        </span>
      </button>

      <div class="details" hidden>
        ${renderDetails(t)}
        ${renderDynamic(t)}
        <button onclick="loadPhotos('${t._key}',this)">Load photos</button>
      </div>
    `;

    const header = div.querySelector(".task-header");
    const details = div.querySelector(".details");
    header.onclick = () => {
      details.hidden = !details.hidden;
      header.setAttribute("aria-expanded", String(!details.hidden));
    };

    list.appendChild(div);
  });
}

function renderPagination() {
  const el = document.getElementById("pagination");
  el.innerHTML = `
    <button id="previousPage" ${CURRENT_PAGE === 0 ? "disabled" : ""}>Previous</button>
    <span>Page ${CURRENT_PAGE + 1} &middot; ${TASKS.length} tasks</span>
    <button id="nextPage" ${NEXT_CURSOR ? "" : "disabled"}>Next</button>
  `;
  document.getElementById("previousPage").onclick = () => loadTasks(CURRENT_PAGE - 1);
  document.getElementById("nextPage").onclick = () => {
    PAGE_CURSORS[CURRENT_PAGE + 1] = NEXT_CURSOR;
    loadTasks(CURRENT_PAGE + 1);
  };
}

/* DETAILS */
function renderDetails(t){
return `
<div class="task-form">
<label>ASSIGNED DRIVER</label><input value="${t.driverId||""}" disabled>
<label>JOB TYPE</label><input value="${t.JOBTYPE||""}" disabled>
<label>BA</label><input value="${t.BA||""}" disabled>
<label>DMZ</label><input value="${t.DMZ||""}" disabled>
<label>MRU</label><input value="${t.MRU||""}" disabled>
<label>SEQUENCE</label><input value="${t.SEQUENCE||""}" disabled>
<label>METER NUMBER</label><input value="${t.METERNUMBER||""}" disabled>
<label>ACCOUNT NUMBER</label><input value="${t.ACCOUNTNUMBER||""}" disabled>
<label>CUSTOMER NAME</label><input value="${t.CUSTOMERNAME||""}" disabled>
<label class="full">ADDRESS</label>
<textarea class="full" disabled>${t.ADDRESS||""}</textarea>
<label>ZIP CODE</label><input value="${t.ZIPCODE||""}" disabled>
<label>DELIVERY TYPE</label><input value="${t.deliveryType||""}" disabled>
<label>LATITUDE</label><input value="${t.LATITUDE||""}" disabled>
<label>LONGITUDE</label><input value="${t.LONGITUDE||""}" disabled>
</div>`;
}

/* DYNAMIC */
function renderDynamic(t){
  const cfg =
    DRIVER_UI_CONFIG?.[t.JOBTYPE]
    ?.deliveryMethods?.[t.deliveryType];

  if(!cfg) return "";

  let html=`<div class="task-form full"><b>DELIVERY DETAILS</b>`;

  cfg._order.forEach(k=>{
    const f=cfg.fields[k];
    if(!f) return;

    html+=`
      <label class="full">${f.label}</label>
      <input class="full" value="${t[k]||""}" disabled>
    `;
  });

  html+=`</div>`;
  return html;
}

/* PHOTOS */
window.loadPhotos = async function(id,btn){
  if(btn.dataset.loaded) return;

  btn.dataset.loaded=1;
  btn.innerText="Loading photos...";

  let t = TASKS.find(task => task._key === id) || {};
  const hasTaskPhoto = [1,2,3].some(i => t[`photo${i}Url`]);

  // Older snapshots may not contain their photo URLs, so keep the old RTDB
  // lookup as a fallback.
  if(!hasTaskPhoto){
    const snap = await get(ref(db,`tasks/${id}`));
    if(snap.exists()) t = { ...t, ...snap.val() };
  }

  const box=document.createElement("div");
  box.style.display="grid";
  box.style.gridTemplateColumns="repeat(3,1fr)";
  box.style.gap="6px";
  box.style.marginTop="10px";

  [1,2,3].forEach(i=>{
    const url=t[`photo${i}Url`];
    if(!url) return;

    const img=document.createElement("img");
    img.src=url;
    img.style.width="100%";
    img.style.height="90px";
    img.style.objectFit="cover";
    img.onclick=()=>window.open(url);

    box.appendChild(img);
  });

  if(!box.children.length){
    btn.innerText="No photos";
    return;
  }

  btn.after(box);
  btn.innerText="Photos Loaded";
};

from.onchange = () => loadTasks();
to.onchange = () => loadTasks();

window.goConfig = function(){
  window.location.href = "taskviewerConfig.html";
};

</script>

<script type="module">
import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

window.logout = async function(){
  const auth = getAuth();
  await signOut(auth);
  window.location.href = "login-taskview.html";
};
</script>
  
</body>
</html>
