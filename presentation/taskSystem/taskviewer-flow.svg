<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">How completed tasks become viewable in Task Viewer</title>
<desc id="desc">Successful completion uploads create shared completed records. The user signs in with an active authorized account, selects assigned dates, and loads completed records from saved snapshots and Firestore. Records are merged, restricted by configured BA and user BA access, then searched and displayed. Users open task details and load photos.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#536b83"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#17283e;text-anchor:middle;font-size:18px}.small{font-size:14px;fill:#526278}.label{font-size:13px;font-weight:bold;fill:#007e80}.node{fill:white;stroke:#008b8b;stroke-width:2;rx:12}.cloud{fill:#e7f3fb;stroke:#2583d8;stroke-width:2;rx:12}.edge{fill:none;stroke:#536b83;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1200" height="650" rx="16" fill="#f5f8fc"/>
<text x="35" y="42" style="text-anchor:start;font-size:28px;font-weight:bold">Task Viewer — From Completed Work to Visible Records</text>
<text x="35" y="70" class="small" style="text-anchor:start">Completed cloud records + authorized BA access + selected assigned dates</text>
<rect class="node" x="35" y="110" width="230" height="80"/>
<text x="150" y="141" class="">Driver uploads completion</text>
<text x="150" y="167" class="small">Details and supporting photos</text>
<rect class="cloud" x="335" y="110" width="230" height="80"/>
<text x="450" y="141" class="">Shared completed records</text>
<text x="450" y="167" class="small">Cloud status: COMPLETED</text>
<rect class="node" x="635" y="110" width="230" height="80"/>
<text x="750" y="141" class="">User signs in</text>
<text x="750" y="167" class="small">Registered email and password</text>
<rect class="node" x="935" y="110" width="230" height="80"/>
<text x="1050" y="141" class="">Verify viewer access</text>
<text x="1050" y="167" class="small">Active role + assigned BA access</text>
<path class="edge" d="M265 150H335"/>
<path class="edge" d="M865 150H935"/>
<rect class="node" x="635" y="280" width="230" height="80"/>
<text x="750" y="311" class="">Select From / To dates</text>
<text x="750" y="337" class="small">Retrieve by assigned task date</text>
<path class="edge" d="M1050 190V235H750V280"/>
<rect class="cloud" x="35" y="280" width="230" height="80"/>
<text x="150" y="311" class="">Saved task snapshots</text>
<text x="150" y="337" class="small">Cache first; check for updates</text>
<rect class="cloud" x="335" y="280" width="230" height="80"/>
<text x="450" y="311" class="">Read completed tasks</text>
<text x="450" y="337" class="small">Firestore within allowed BAs</text>
<path class="edge" d="M450 190V280"/>
<path class="edge" d="M635 320H565"/>
<path class="edge" d="M750 280V250H150V280"/>
<text x="470" y="236" class="small">Selected date range</text>
<rect class="node" x="35" y="460" width="230" height="80"/>
<text x="150" y="491" class="">Combine task records</text>
<text x="150" y="517" class="small">Merge snapshots and live records</text>
<rect class="node" x="335" y="460" width="230" height="80"/>
<text x="450" y="491" class="">Apply access and filters</text>
<text x="450" y="517" class="small">Configured BA, user BA, search</text>
<rect class="node" x="635" y="460" width="230" height="80"/>
<text x="750" y="491" class="">Display matching tasks</text>
<text x="750" y="517" class="small">Task cards with Prev / Next pages</text>
<rect class="node" x="935" y="460" width="230" height="80"/>
<text x="1050" y="491" class="">Review details and photos</text>
<text x="1050" y="517" class="small">Expand header → Load Photos</text>
<path class="edge" d="M150 360V460"/>
<path class="edge" d="M450 360V411H150V460"/>
<path class="edge" d="M265 500H335"/>
<path class="edge" d="M565 500H635"/>
<path class="edge" d="M865 500H935"/>
<text x="915" y="380" class="small">Not authorized → access denied</text>
<text x="915" y="405" class="small">No matching records → No tasks found</text>
<text x="600" y="590" class="label">Visible task = completed record in the chosen date range + allowed BA + matching filters</text>
<text x="600" y="618" class="small">Work saved only on the driver device still needs a successful upload to become a shared completion.</text>
</svg>